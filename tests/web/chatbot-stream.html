<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatbot 流式测试 · /chatbot/chat/stream</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4d;
      --text: #e6edf3;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --answer: #f0f4f8;
      --meta: #22c55e;
      --err: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 1.25rem 1rem 2rem; }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.25rem; }
    .sub { color: var(--muted); font-size: 0.875rem; margin-bottom: 1.25rem; }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    @media (min-width: 720px) {
      .grid { grid-template-columns: 1fr 1fr; }
      .grid .full { grid-column: 1 / -1; }
    }
    fieldset {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      margin: 0;
      padding: 0.75rem 1rem 1rem;
    }
    legend { padding: 0 0.35rem; color: var(--muted); font-size: 0.8rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-top: 0.5rem; }
    label:first-of-type { margin-top: 0; }
    input[type="text"],
    input[type="url"],
    input[type="password"],
    input[type="file"],
    textarea,
    select {
      width: 100%;
      margin-top: 0.2rem;
      padding: 0.45rem 0.55rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0d1117;
      color: var(--text);
      font-size: 0.9rem;
    }
    textarea { min-height: 4.5rem; resize: vertical; font-family: inherit; }
    .row { display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; align-items: center; margin-top: 0.5rem; }
    .row label { display: flex; align-items: center; gap: 0.35rem; margin: 0; color: var(--text); font-size: 0.875rem; }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; }
    button {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: none;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 500;
    }
    button.primary { background: var(--accent); color: #fff; }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); }
    button.secondary { background: var(--border); color: var(--text); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .out {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      min-height: 200px;
      padding: 1rem;
    }
    .out h2 { font-size: 0.85rem; color: var(--muted); margin: 0 0 0.5rem; font-weight: 500; }
    #answer {
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--answer);
      font-size: 0.95rem;
      min-height: 3rem;
    }
    #answer sup.cite,
    #answer sup.cite-pending {
      font-size: 0.72em;
      line-height: 0;
      margin-left: 0.1em;
    }
    #answer sup.cite a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: 600;
    }
    #answer sup.cite a:hover { text-decoration: underline; }
    #answer sup.cite-pending {
      color: #fbbf24;
      cursor: default;
    }
    #answer .katex-display {
      margin: 0.75rem 0;
      overflow-x: auto;
      overflow-y: hidden;
    }
    #status { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.5rem; }
    #meta {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--meta);
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 240px;
      overflow: auto;
    }
    #hitlPanel {
      margin-top: 1rem;
      border: 1px solid #3b82f6;
      border-radius: 8px;
      background: #152238;
      padding: 1rem;
    }
    #hitlPanel h2 { color: #93c5fd; margin: 0 0 0.5rem; font-size: 0.9rem; }
    #hitlPrompt { color: var(--answer); white-space: pre-wrap; margin-bottom: 0.75rem; }
    #hitlButtons { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    #hitlButtons button.hitl-action {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.55rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
    }
    #hitlButtons button.hitl-action:hover:not(:disabled) { background: var(--accent-hover); }
    #hitlButtons button.hitl-action:disabled { opacity: 0.5; cursor: not-allowed; }
    .err { color: var(--err); font-size: 0.875rem; margin-top: 0.5rem; white-space: pre-wrap; }
    code { font-size: 0.8rem; background: #0d1117; padding: 0.1rem 0.35rem; border-radius: 4px; }
    #uploadResult {
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: var(--meta);
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 120px;
      overflow: auto;
    }
    .thumb-preview {
      margin-top: 0.5rem;
      max-width: 100%;
      max-height: 160px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
</head>
<body>
  <div class="wrap">
    <h1>Chatbot 流式测试</h1>
    <p class="sub">
      调用 <code>POST /chatbot/chat/stream</code>（SSE）。需后端 <code>CORSMiddleware</code> 允许浏览器跨域；
      请求头 <code>Authorization: Bearer &lt;SERVICE_API_KEY&gt;</code> 与线上一致。
    </p>

    <div class="grid">
      <fieldset>
        <legend>连接与服务密钥</legend>
        <label>API 根地址（不含路径尾斜杠）</label>
        <input type="url" id="baseUrl" value="http://127.0.0.1:8083" autocomplete="off" />
        <label>Service API Key（Bearer，可空则不带鉴权头；仅当服务端关闭鉴权时可用）</label>
        <input type="password" id="apiKey" placeholder="留空或粘贴密钥" autocomplete="off" />
      </fieldset>

      <fieldset>
        <legend>会话与身份</legend>
        <label>user_id（勿含冒号 <code>:</code>）</label>
        <input type="text" id="userId" value="u_web_test" autocomplete="off" />
        <label>session_id</label>
        <input type="text" id="sessionId" value="u_web_test_s_001" autocomplete="off" />
      </fieldset>

      <fieldset class="full">
        <legend>本轮问题</legend>
        <label>query</label>
        <textarea id="query" placeholder="输入要向知识库 / 模型提问的内容"></textarea>
      </fieldset>

      <fieldset>
        <legend>布尔开关</legend>
        <div class="row">
          <label><input type="checkbox" id="enableRag" checked /> enable_rag</label>
          <label><input type="checkbox" id="enableContext" checked /> enable_context</label>
          <label><input type="checkbox" id="enableNl2sql" checked /> enable_nl2sql_route</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>可选参数</legend>
        <label>prompt_version（空则服务端默认）</label>
        <input type="text" id="promptVersion" placeholder="例如 boiler_v1" autocomplete="off" />
        <label>enable_fault_vision</label>
        <select id="faultVision">
          <option value="">默认（不传 / 服务端默认）</option>
          <option value="true">true</option>
          <option value="false">false</option>
        </select>
        <label>image_urls（每行一个 URL，可为空；推荐先下方上传）</label>
        <textarea id="imageUrls" rows="2" placeholder="https://..."></textarea>
      </fieldset>

      <fieldset>
        <legend>图片上传（POST /chatbot/upload）</legend>
        <label>选择图片（jpeg/png/webp/gif）</label>
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/gif,.jpg,.jpeg,.png,.webp,.gif" />
        <div class="actions" style="margin-top:0.5rem;">
          <button type="button" class="secondary" id="btnUpload">上传图片</button>
          <button type="button" class="secondary" id="btnAppendUrl" disabled>填入 image_urls</button>
        </div>
        <div id="uploadResult">（尚未上传）</div>
        <img id="thumbPreview" class="thumb-preview" alt="" hidden />
      </fieldset>
    </div>

    <div class="actions">
      <button type="button" class="primary" id="btnSend">发送并开始流式输出</button>
      <button type="button" class="secondary" id="btnStop" disabled>中断（需 stream_id）</button>
      <button type="button" class="secondary" id="btnClear">清空输出</button>
    </div>

    <div class="out" style="margin-top: 1rem;">
      <div id="status">就绪</div>
      <h2>回答（delta 拼接正文；citation_ref 渲染为可点引用；流结束后再 KaTeX）</h2>
      <div id="answer"></div>
      <div id="err" class="err" hidden></div>
      <h2 style="margin-top:1rem;">结束帧 meta</h2>
      <div id="meta">（尚未完成）</div>
    </div>
    <div id="hitlPanel" style="display:none;">
      <h2>人机确认（HITL）— 请选择</h2>
      <div id="hitlPrompt"></div>
      <div id="hitlButtons"></div>
    </div>
  </div>

  <!-- 勿用 defer：须在本页脚本运行前加载完成 -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <script>
(function () {
  const $ = (id) => document.getElementById(id);

  /**
   * 仅渲染公式，不解析 Markdown。定界符顺序：长的 display 优先。
   * 模型常见输出：$$...$$（块级）、\\(...\\)（行内）、\\[...\\]（块级）。
   */
  const KATEX_RENDER_OPTS = {
    delimiters: [
      { left: "$$", right: "$$", display: true },
      { left: "\\[", right: "\\]", display: true },
      { left: "\\(", right: "\\)", display: false },
      { left: "$", right: "$", display: false },
    ],
    throwOnError: false,
    strict: false,
    errorColor: "#f87171",
  };

  let katexTimer = null;
  let katexReady = typeof renderMathInElement === "function";
  let pendingKatexText = "";
  /** @type {{ type: 'text', text: string } | { type: 'citation', refIndex: number }[]} */
  let answerSegments = [];
  /** @type {object[]} */
  let lastRagCitations = [];
  /** @type {{ resume_token: string, ui_buttons: {id:string,label:string}[], prompt?: string, hitl_kind?: string } | null} */
  let pendingHitl = null;
  let hitlBusy = false;

  const DEFAULT_HITL_BUTTONS = {
    intent_route_confirm: [
      { id: "route_data_query", label: "查实时/台账数据" },
      { id: "route_kb_qa", label: "基于知识库分析" },
      { id: "route_clarify", label: "我先补充问题" },
    ],
    nl2sql_gen_failed: [
      { id: "nl2sql_retry", label: "重试查数" },
      { id: "fallback_kb_qa", label: "基于知识库分析" },
    ],
  };

  function defaultButtonsForHitlKind(kind) {
    return DEFAULT_HITL_BUTTONS[kind] ? DEFAULT_HITL_BUTTONS[kind].slice() : [];
  }

  function normalizeHitlEvent(ev) {
    const buttons = Array.isArray(ev.ui_buttons) && ev.ui_buttons.length
      ? ev.ui_buttons
      : defaultButtonsForHitlKind(ev.hitl_kind || "");
    return {
      resume_token: ev.resume_token || "",
      ui_buttons: buttons,
      prompt: ev.prompt || "",
      hitl_kind: ev.hitl_kind || "",
    };
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function escapeAttr(s) {
    return escapeHtml(s).replace(/'/g, "&#39;");
  }

  function findRagCitation(refIndex) {
    return lastRagCitations.find((c) => Number(c.ref_index) === Number(refIndex)) || null;
  }

  function citationSupHtml(refIndex, cite) {
    const label = "[" + refIndex + "]";
    if (!cite) {
      return (
        '<sup class="cite-pending" title="引用 #' +
        refIndex +
        "（等待 finished.meta.rag_citations）\">" +
        escapeHtml(label) +
        "</sup>"
      );
    }
    const title = [cite.doc_name, cite.section_path].filter(Boolean).join(" · ");
    const url = (cite.original_content_url || "").trim();
    if (url) {
      return (
        '<sup class="cite"><a href="' +
        escapeAttr(url) +
        '" target="_blank" rel="noopener noreferrer" title="' +
        escapeAttr(title) +
        '">' +
        escapeHtml(label) +
        "</a></sup>"
      );
    }
    return (
      '<sup class="cite" title="' +
      escapeAttr(title || "知识来源") +
      '">' +
      escapeHtml(label) +
      "</sup>"
    );
  }

  function segmentsToPlainText() {
    return answerSegments
      .map((seg) => (seg.type === "text" ? seg.text : "[" + seg.refIndex + "]"))
      .join("");
  }

  function appendTextDelta(chunk) {
    if (!chunk) return;
    const last = answerSegments[answerSegments.length - 1];
    if (last && last.type === "text") {
      last.text += chunk;
    } else {
      answerSegments.push({ type: "text", text: chunk });
    }
  }

  function appendCitationRef(refIndex) {
    const n = Number(refIndex);
    if (!Number.isFinite(n) || n < 1) return;
    answerSegments.push({ type: "citation", refIndex: n });
  }

  function renderAnswerHtml() {
    const html = answerSegments
      .map((seg) => {
        if (seg.type === "text") return escapeHtml(seg.text);
        return citationSupHtml(seg.refIndex, findRagCitation(seg.refIndex));
      })
      .join("");
    $("answer").innerHTML = html;
    pendingKatexText = segmentsToPlainText();
  }

  /** 流式过程中：更新正文与引用角标。 */
  function updateAnswerImmediate() {
    renderAnswerHtml();
  }

  function applyKatexToAnswer() {
    const el = $("answer");
    if (!katexReady) {
      if (typeof renderMathInElement === "function") {
        katexReady = true;
      } else {
        return;
      }
    }
    try {
      renderMathInElement(el, KATEX_RENDER_OPTS);
    } catch (e) {
      console.warn("KaTeX render failed:", e);
    }
  }

  /** 生成中偶尔刷新公式（可选）；不阻塞上面的即时更新。 */
  function scheduleKatexPass() {
    if (katexTimer) clearTimeout(katexTimer);
    katexTimer = setTimeout(() => {
      katexTimer = null;
      applyKatexToAnswer();
    }, 400);
  }

  function flushAnswerWithKatex(ragCitations) {
    if (katexTimer) {
      clearTimeout(katexTimer);
      katexTimer = null;
    }
    lastRagCitations = Array.isArray(ragCitations) ? ragCitations : [];
    renderAnswerHtml();
    applyKatexToAnswer();
  }

  function resetAnswerContent() {
    answerSegments = [];
    lastRagCitations = [];
    pendingKatexText = "";
    $("answer").innerHTML = "";
  }

  function resetAnswerState() {
    resetAnswerContent();
    clearHitlPanel();
  }

  function clearHitlPanel() {
    pendingHitl = null;
    $("hitlPanel").style.display = "none";
    $("hitlPrompt").textContent = "";
    $("hitlButtons").innerHTML = "";
  }

  function showHitlPanel(ev) {
    const normalized = normalizeHitlEvent(ev);
    if (!normalized.resume_token) {
      console.warn("HITL panel skipped: missing resume_token", ev);
      return;
    }
    // 若已有按钮，仅更新 token，避免 finished 帧用空 ui_buttons 覆盖
    if (pendingHitl && pendingHitl.ui_buttons.length > 0 && (!normalized.ui_buttons || !normalized.ui_buttons.length)) {
      pendingHitl.resume_token = normalized.resume_token;
      pendingHitl.hitl_kind = normalized.hitl_kind || pendingHitl.hitl_kind;
      if (normalized.prompt) pendingHitl.prompt = normalized.prompt;
    } else {
      pendingHitl = normalized;
    }
    $("hitlPanel").style.display = "block";
    if (pendingHitl.prompt) {
      $("hitlPrompt").textContent = pendingHitl.prompt;
    } else if (!$("hitlPrompt").textContent) {
      $("hitlPrompt").textContent = "请选择：";
    }
    const box = $("hitlButtons");
    box.innerHTML = "";
    pendingHitl.ui_buttons.forEach((btn) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "hitl-action";
      b.textContent = btn.label || btn.id;
      b.dataset.action = btn.id;
      b.disabled = hitlBusy;
      b.addEventListener("click", () => resumeHitl(btn.id));
      box.appendChild(b);
    });
  }

  async function resumeHitl(action) {
    if (!pendingHitl || !pendingHitl.resume_token || hitlBusy) return;
    const refined = $("query").value.trim();
    if (action === "route_clarify" && !refined) {
      showErr("选择「我先补充问题」时，请在上方问句框填写补充后的完整问题。");
      return;
    }
    hitlBusy = true;
    $("hitlButtons").querySelectorAll("button").forEach((b) => (b.disabled = true));
    appendStatus("HITL 续跑中… action=" + action);
    // 续跑回答从空白开始，不要把新 delta 追加在先前 HITL 话术后面
    resetAnswerContent();
    abortCtrl = new AbortController();
    setBusy(true);
    const url = baseUrl() + "/chatbot/chat/resume-stream";
    const payload = {};
    if (refined) payload.refined_query = refined;
    const body = {
      user_id: $("userId").value.trim(),
      session_id: $("sessionId").value.trim(),
      resume_token: pendingHitl.resume_token,
      action: action,
      payload: payload,
    };
    try {
      const resp = await fetch(url, {
        method: "POST",
        headers: headers(),
        body: JSON.stringify(body),
        signal: abortCtrl.signal,
        credentials: "omit",
      });
      if (!resp.ok) {
        const t = await resp.text();
        throw new Error("HTTP " + resp.status + "\n" + t.slice(0, 2000));
      }
      clearHitlPanel();
      await readSseStream(resp, handleSseEvent);
    } catch (e) {
      if (e.name !== "AbortError") {
        showErr(String(e.message || e));
        appendStatus("HITL 续跑失败");
      }
    } finally {
      hitlBusy = false;
      setBusy(false);
      $("btnStop").disabled = true;
      abortCtrl = null;
    }
  }

  function handleSseEvent(ev) {
    if (ev.parseError) {
      showErr("SSE JSON 解析失败: " + ev.error + "\n片段: " + (ev.raw || "").slice(0, 500));
      return;
    }
    if (ev.started === true && ev.stream_id) {
      currentStreamId = ev.stream_id;
      $("btnStop").disabled = false;
      appendStatus("已连接，stream_id=" + ev.stream_id);
      return;
    }
    if (ev.error && ev.finished) {
      showErr(String(ev.error));
      appendStatus("服务端错误帧");
      $("meta").textContent = JSON.stringify(ev, null, 2);
      return;
    }
    if (ev.delta != null && ev.finished === false) {
      appendTextDelta(ev.delta);
      updateAnswerImmediate();
      scheduleKatexPass();
      appendStatus("生成中… 已收字符 " + segmentsToPlainText().length);
      return;
    }
    if (ev.citation_ref != null && ev.finished === false) {
      appendCitationRef(ev.citation_ref);
      updateAnswerImmediate();
      scheduleKatexPass();
      appendStatus(
        "生成中… 引用 [" + ev.citation_ref + "]（" + segmentsToPlainText().length + " 字）"
      );
      return;
    }
    if (ev.chatbot_hitl_required === true && ev.finished === false) {
      showHitlPanel(ev);
      appendStatus("等待用户 HITL 确认（" + (ev.hitl_kind || "") + "）");
      return;
    }
    if (ev.finished === true) {
      flushAnswerWithKatex((ev.meta && ev.meta.rag_citations) || []);
      $("meta").textContent = JSON.stringify(ev.meta || {}, null, 2);
      if (ev.meta && ev.meta.pending_hitl && ev.meta.resume_token) {
        showHitlPanel({
          resume_token: ev.meta.resume_token,
          ui_buttons: pendingHitl ? pendingHitl.ui_buttons : [],
          prompt: pendingHitl ? pendingHitl.prompt : "",
          hitl_kind: ev.meta.hitl_kind || (pendingHitl && pendingHitl.hitl_kind) || "",
        });
        appendStatus("等待用户 HITL 确认（" + (ev.meta.hitl_kind || "") + "）");
      } else {
        appendStatus("完成");
      }
      return;
    }
  }

  const baseUrl = () => $("baseUrl").value.replace(/\/+$/, "");
  const headers = () => {
    const h = { "Content-Type": "application/json", Accept: "text/event-stream" };
    const k = $("apiKey").value.trim();
    if (k) h["Authorization"] = "Bearer " + k;
    return h;
  };
  const authHeaders = (extra) => {
    const h = Object.assign({}, extra || {});
    const k = $("apiKey").value.trim();
    if (k) h["Authorization"] = "Bearer " + k;
    return h;
  };

  function pretty(obj) {
    try { return JSON.stringify(obj, null, 2); } catch (_) { return String(obj); }
  }

  async function readJsonSafe(resp) {
    const text = await resp.text();
    try {
      return { json: JSON.parse(text), raw: text };
    } catch (_) {
      return { json: null, raw: text };
    }
  }

  let lastUploadUrl = null;

  function buildBody() {
    const body = {
      user_id: $("userId").value.trim(),
      session_id: $("sessionId").value.trim(),
      query: $("query").value,
      enable_rag: $("enableRag").checked,
      enable_context: $("enableContext").checked,
      enable_nl2sql_route: $("enableNl2sql").checked,
      image_urls: $("imageUrls").value
        .split(/\r?\n/)
        .map((s) => s.trim())
        .filter(Boolean),
    };
    const pv = $("promptVersion").value.trim();
    if (pv) body.prompt_version = pv;
    const fv = $("faultVision").value;
    if (fv === "true") body.enable_fault_vision = true;
    else if (fv === "false") body.enable_fault_vision = false;
    return body;
  }

  let abortCtrl = null;
  let currentStreamId = null;

  function setBusy(b) {
    $("btnSend").disabled = b;
    $("btnStop").disabled = !b || !currentStreamId;
  }

  function appendStatus(t) {
    $("status").textContent = t;
  }

  function showErr(msg) {
    const el = $("err");
    if (!msg) {
      el.hidden = true;
      el.textContent = "";
      return;
    }
    el.hidden = false;
    el.textContent = msg;
  }

  $("btnClear").addEventListener("click", () => {
    resetAnswerState();
    $("meta").textContent = "（尚未完成）";
    showErr("");
    appendStatus("已清空");
    currentStreamId = null;
    setBusy(false);
  });

  $("btnUpload").addEventListener("click", async () => {
    showErr("");
    const file = $("fileInput").files && $("fileInput").files[0];
    if (!file) {
      showErr("请先选择图片文件。");
      return;
    }
    appendStatus("上传中…");
    $("btnUpload").disabled = true;
    try {
      const fd = new FormData();
      fd.append("file", file);
      const resp = await fetch(baseUrl() + "/chatbot/upload", {
        method: "POST",
        headers: authHeaders(),
        body: fd,
        credentials: "omit",
      });
      const out = await readJsonSafe(resp);
      if (!resp.ok) {
        throw new Error("HTTP " + resp.status + "\n" + (out.raw || "").slice(0, 2000));
      }
      lastUploadUrl = out.json && out.json.url ? String(out.json.url) : null;
      $("uploadResult").textContent = pretty(out.json || out.raw);
      $("btnAppendUrl").disabled = !lastUploadUrl;
      const thumb = $("thumbPreview");
      if (lastUploadUrl) {
        thumb.src = lastUploadUrl;
        thumb.hidden = false;
      } else {
        thumb.hidden = true;
        thumb.removeAttribute("src");
      }
      appendStatus("上传成功");
    } catch (e) {
      lastUploadUrl = null;
      $("btnAppendUrl").disabled = true;
      $("thumbPreview").hidden = true;
      appendStatus("上传失败");
      showErr(String(e.message || e));
    } finally {
      $("btnUpload").disabled = false;
    }
  });

  $("btnAppendUrl").addEventListener("click", () => {
    if (!lastUploadUrl) return;
    const ta = $("imageUrls");
    const cur = ta.value.trim();
    const lines = cur ? cur.split(/\r?\n/).map((s) => s.trim()).filter(Boolean) : [];
    if (!lines.includes(lastUploadUrl)) lines.push(lastUploadUrl);
    ta.value = lines.join("\n");
    appendStatus("已填入 image_urls");
  });

  $("btnStop").addEventListener("click", async () => {
    if (!currentStreamId) return;
    const uid = $("userId").value.trim();
    const sid = $("sessionId").value.trim();
    const url = baseUrl() + "/chatbot/chat/stop";
    try {
      const r = await fetch(url, {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({
          user_id: uid,
          session_id: sid,
          stream_id: currentStreamId,
        }),
        credentials: "omit",
      });
      const text = await r.text();
      appendStatus("已请求停止: HTTP " + r.status + " " + text.slice(0, 200));
      if (abortCtrl) abortCtrl.abort();
    } catch (e) {
      appendStatus("停止请求失败: " + e);
    }
  });

  /**
   * 解析 SSE：按空行分帧，每帧内取以 "data: " 开头的行并拼接 JSON。
   */
  async function readSseStream(response, onEvent) {
    const reader = response.body.getReader();
    const dec = new TextDecoder();
    let buffer = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n\n")) >= 0) {
        const raw = buffer.slice(0, idx).trimEnd();
        buffer = buffer.slice(idx + 2);
        const lines = raw.split("\n").map((l) => l.trimEnd());
        const dataLines = lines.filter((l) => l.startsWith("data:"));
        if (!dataLines.length) continue;
        const payload = dataLines
          .map((l) => (l.startsWith("data:") ? l.slice(5).trimStart() : l))
          .join("\n");
        let obj;
        try {
          obj = JSON.parse(payload);
        } catch (e) {
          onEvent({ parseError: true, raw: payload, error: String(e) });
          continue;
        }
        onEvent(obj);
      }
    }
    const tail = buffer.trim();
    if (tail) {
      const dataLines = tail.split("\n").filter((l) => l.startsWith("data:"));
      if (dataLines.length) {
        const payload = dataLines.map((l) => l.slice(5).trimStart()).join("\n");
        try {
          onEvent(JSON.parse(payload));
        } catch (e) {
          onEvent({ parseError: true, raw: payload, error: String(e) });
        }
      }
    }
  }

  $("btnSend").addEventListener("click", async () => {
    showErr("");
    resetAnswerState();
    $("meta").textContent = "…";
    currentStreamId = null;
    abortCtrl = new AbortController();
    setBusy(true);
    appendStatus("请求中…");

    const url = baseUrl() + "/chatbot/chat/stream";

    try {
      const resp = await fetch(url, {
        method: "POST",
        headers: headers(),
        body: JSON.stringify(buildBody()),
        signal: abortCtrl.signal,
        credentials: "omit",
      });

      if (!resp.ok) {
        const t = await resp.text();
        throw new Error("HTTP " + resp.status + "\n" + t.slice(0, 2000));
      }

      const ct = (resp.headers.get("content-type") || "").toLowerCase();
      if (!ct.includes("text/event-stream") && !ct.includes("event-stream")) {
        appendStatus("警告: Content-Type 非 text/event-stream: " + ct);
      }

      await readSseStream(resp, handleSseEvent);
    } catch (e) {
      if (e.name === "AbortError") {
        appendStatus("已中止");
      } else {
        showErr(String(e.message || e));
        appendStatus("失败");
      }
    } finally {
      setBusy(false);
      $("btnStop").disabled = true;
      abortCtrl = null;
    }
  });

  if (katexReady) {
    appendStatus("就绪（已加载 KaTeX：$$、\\\\( \\\\)、\\\\[ \\\\]）");
  } else {
    appendStatus("就绪（警告：KaTeX 未加载，公式为原文；请检查 jsDelivr 或 Ctrl+F5 强刷）");
  }
})();
  </script>
