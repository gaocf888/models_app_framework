services:
  easysearch:
    image: ${EASYSEARCH_IMAGE}
    container_name: ${EASYSEARCH_CONTAINER_NAME}
    environment:
      - cluster.name=${EASYSEARCH_CLUSTER_NAME}
      - node.name=${EASYSEARCH_NODE_NAME}
      # - discovery.type=single-node
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=${EASYSEARCH_JAVA_OPTS}
      # - xpack.security.enabled=true
      # - security.enabled=true
      - ELASTIC_USERNAME=${EASYSEARCH_USERNAME}
      - ELASTIC_PASSWORD=${EASYSEARCH_PASSWORD}
      # init 脚本使用的连接参数（避免默认 elastic/changeme 反复认证失败日志）
      - ES_USER=${EASYSEARCH_USERNAME}
      - ES_PASS=${EASYSEARCH_PASSWORD}
      # 首次初始化可显式指定管理员密码（仅首次生效）
      # - EASYSEARCH_INITIAL_ADMIN_PASSWORD=${EASYSEARCH_INITIAL_ADMIN_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ${EASYSEARCH_DATA}:/app/easysearch/data
      # 不挂载 easysearch_bak0.yml：使用镜像内 easysearch_bak0.yml；TLS 证书（instance.crt 等）通常由镜像入口在启动前生成，
      # 或需按 README「TLS / instance.crt」一节执行 initialize。勿用「仅含 yml 的空目录」挂载整个 config，否则会盖住证书。
      # 若自定义 yml：建议挂载整个已初始化的 config 目录，并持久化 instance.crt / instance.key / ca.crt 等。
      - ./easysearch/config/easysearch_bak0.yml:/app/easysearch/config/easysearch_bak0.yml:ro
      - ./easysearch/config/instance.crt:/app/easysearch/config/instance.crt:ro
      - ./easysearch/config/instance.key:/app/easysearch/config/instance.key:ro
      - ./easysearch/config/ca.crt:/app/easysearch/config/ca.crt:ro
      - ./easysearch/config/ca.key:/app/easysearch/config/ca.key:ro
      - ./easysearch/config/admin.crt:/app/easysearch/config/admin.crt:ro
      - ./easysearch/config/admin.key:/app/easysearch/config/admin.key:ro
      - ./easysearch/init:/opt/easysearch/init:ro
    ports:
      - "${EASYSEARCH_PORT}:9200"
    networks:
      - ${EASYSEARCH_NETWORK}
    healthcheck:
      test: [ "CMD-SHELL", "curl -s -k -u ${EASYSEARCH_USERNAME}:${EASYSEARCH_PASSWORD} https://127.0.0.1:9200/_cluster/health >/dev/null || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  rag_easysearch_data:
    name: ${EASYSEARCH_DATA_VOLUME}

networks:
  ai-stack:
    name: ${EASYSEARCH_NETWORK}
    driver: bridge
