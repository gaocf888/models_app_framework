# 沐曦（Metax）GPU 独立编排（勿与 docker-compose.yml 叠加，避免误读为仍用 Dockerfile.cpu）。
# 与 vllm-deploy/docker/docker-compose.mthreads.yml 一致：privileged + /dev + MX_VISIBLE_DEVICES。
# 使用：docker compose -f docker-compose.gpu.mthreads.yml up -d --build
services:
  paddleocr-layout-api:
    build:
      context: .
      dockerfile: Dockerfile.gpu.mthreads
      args:
        BASE_IMAGE: ${PADDLE_LAYOUT_MT_BASE_IMAGE:-cr.metax-tech.com/public-ai-release/maca/paddle:2.6.0-maca.ai3.7.0.6-py310-kylinv11-amd64}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        METAX_PADDLE_GPU: ${PADDLE_LAYOUT_METAX_PADDLE_GPU:-1}
        PADDLE_METAX_CHANNEL: ${PADDLE_LAYOUT_METAX_CHANNEL:-nightly}
        PADDLE_CPU_METAX_VER: ${PADDLE_LAYOUT_METAX_CPU_PADDLE_VER:-3.3.0}
        PADDLE_METAX_GPU_VER: ${PADDLE_LAYOUT_METAX_GPU_VER:-3.3.0}
        # 麒麟默认源常无 LO：默认启用内置阿里云 EPEL + 默认包名；可改 LO_REPO_URL / RPM 等（见 README §5.2）
        # 未设 LO_REPO_URL 时默认启用镜像内阿里云 EPEL .repo（docker/epel-china-el*.repo）；可设 0 关闭
        PADDLE_LAYOUT_LO_BUILTIN_CHINA_EPEL: ${PADDLE_LAYOUT_LO_BUILTIN_CHINA_EPEL:-1}
        PADDLE_LAYOUT_LO_REPO_URL: ${PADDLE_LAYOUT_LO_REPO_URL:-}
        PADDLE_LAYOUT_LO_YUM_PACKAGES: ${PADDLE_LAYOUT_LO_YUM_PACKAGES:-"libreoffice-headless libreoffice-langpack-zh-Hans"}
        PADDLE_LAYOUT_LO_RPM_URLS: ${PADDLE_LAYOUT_LO_RPM_URLS:-}
        PADDLE_LAYOUT_LO_YUM_NOGPGCHECK: ${PADDLE_LAYOUT_LO_YUM_NOGPGCHECK:-0}
    image: ${PADDLE_LAYOUT_GPU_MT_IMAGE:-paddleocr-layout-api:metax-gpu}
    container_name: ${PADDLE_LAYOUT_CONTAINER_NAME:-paddleocr-layout-api}
    restart: unless-stopped
    ports:
      - "${PADDLE_LAYOUT_PORT:-8010}:8000"
    privileged: true
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PADDLE_LAYOUT_MAX_UPLOAD_MB=${PADDLE_LAYOUT_MAX_UPLOAD_MB:-32}
      - PADDLE_LAYOUT_USE_GPU=1
      - PADDLE_LAYOUT_ENGINE_SEMVER=${PADDLE_LAYOUT_ENGINE_SEMVER:-0.1.0}
      - PADDLE_LAYOUT_ENABLE_TABLE_STRUCTURE=${PADDLE_LAYOUT_ENABLE_TABLE_STRUCTURE:-1}
      - PADDLE_LAYOUT_OCR_IR_OPTIM=${PADDLE_LAYOUT_OCR_IR_OPTIM:-}
      - PADDLE_LAYOUT_OCR_ENABLE_MKLDNN=${PADDLE_LAYOUT_OCR_ENABLE_MKLDNN:-}
      - PADDLEOCR_HOME=/io/.paddleocr
      - MX_VISIBLE_DEVICES=${MX_VISIBLE_DEVICES:-0}
    volumes:
      - ${PADDLE_LAYOUT_MODELS_HOST_PATH:-./data/paddle_layout_models}:/models:ro
      - ${PADDLE_LAYOUT_IO_HOST_PATH:-./data/paddle_layout_io}:/io
      - /dev:/dev
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - paddle-layout-net
    cpus: ${PADDLE_LAYOUT_CPU_LIMIT:-4.0}
    mem_limit: ${PADDLE_LAYOUT_MEM_LIMIT:-16g}

networks:
  paddle-layout-net:
    name: ${PADDLE_LAYOUT_NETWORK_NAME:-paddle-layout-stack}
    driver: bridge
