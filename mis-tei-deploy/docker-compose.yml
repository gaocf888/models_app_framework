# =============================================================================
# MIS-TEI · 昇腾 Embedding / Reranker 独立服务
# =============================================================================
# 镜像：swr.cn-south-1.myhuaweicloud.com/ascendhub/mis-tei:26.0.0-310p-ubuntu22.04-py3.11
# 入口（26.0.0）：start.sh --model-id <path|id> --hostname 0.0.0.0 --port 8080 ...
# 启动（在 mis-tei-deploy 目录）：
#   cp .env.example .env && 编辑路径
#   docker compose --env-file .env up -d
#
# 四卡切分建议：embed=物理卡4，rerank=物理卡5（与 vLLM 0-3、MinerU 6 错开）
# models-app 通过 Docker 网络 mis-tei-stack 访问：
#   http://mis-tei-embed:8080  /embed
#   http://mis-tei-rerank:8080 /rerank
# =============================================================================

version: "3.8"

x-mis-tei-common: &mis-tei-common
  image: ${MIS_TEI_IMAGE:-swr.cn-south-1.myhuaweicloud.com/ascendhub/mis-tei:26.0.0-310p-ubuntu22.04-py3.11}
  restart: unless-stopped
  runtime: ${ASCEND_DOCKER_RUNTIME:-ascend}
  privileged: true
  user: root
  ipc: host
  networks:
    - mis-tei-net
  volumes:
    - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
    - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro
    - /usr/local/sbin:/usr/local/sbin:ro
    - /dev:/dev
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 10
    start_period: 180s

services:
  mis-tei-embed:
    <<: *mis-tei-common
    container_name: ${MIS_TEI_EMBED_CONTAINER_NAME:-mis-tei-embed}
    ports:
      - "${MIS_TEI_EMBED_HOST_PORT:-8091}:8080"
    environment:
      - ASCEND_RT_VISIBLE_DEVICES=${MIS_TEI_EMBED_ASCEND_DEVICES:-4}
      - TEI_NPU_DEVICE=${MIS_TEI_EMBED_TEI_NPU_DEVICE:-0}
      - ENABLE_BOOST=${MIS_TEI_ENABLE_BOOST:-True}
      - HOME=/home/HwHiAiUser
    volumes:
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro
      - /usr/local/sbin:/usr/local/sbin:ro
      - /dev:/dev
      # 宿主机 .../embeddings/bge-large-zh-v1.5 → 容器 /home/HwHiAiUser/model/bge-large-zh-v1.5
      # 须可写：仅有 pytorch_model.bin 时 TEI 会就地生成 model.safetensors（只读挂载会报 ReadOnlyFilesystem）
      - ${MIS_TEI_EMBED_MODELS_HOST_PATH:-/aidata/models/embeddings}:/home/HwHiAiUser/model:rw
    # 26.0.0 要求命名参数（非旧版位置参数 MODEL_ID IP PORT）
    command:
      - --model-id
      - ${MIS_TEI_EMBED_MODEL_ID:-/home/HwHiAiUser/model/bge-large-zh-v1.5}
      - --hostname
      - "0.0.0.0"
      - --port
      - "8080"
      - --served-model-name
      - ${MIS_TEI_EMBED_SERVED_NAME:-bge-large-zh-v1.5}
    mem_limit: ${MIS_TEI_EMBED_MEM_LIMIT:-16g}

  mis-tei-rerank:
    <<: *mis-tei-common
    container_name: ${MIS_TEI_RERANK_CONTAINER_NAME:-mis-tei-rerank}
    ports:
      - "${MIS_TEI_RERANK_HOST_PORT:-8092}:8080"
    environment:
      - ASCEND_RT_VISIBLE_DEVICES=${MIS_TEI_RERANK_ASCEND_DEVICES:-5}
      - TEI_NPU_DEVICE=${MIS_TEI_RERANK_TEI_NPU_DEVICE:-0}
      - ENABLE_BOOST=${MIS_TEI_ENABLE_BOOST:-True}
      - HOME=/home/HwHiAiUser
    volumes:
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro
      - /usr/local/sbin:/usr/local/sbin:ro
      - /dev:/dev
      # 须可写：同上，缺 model.safetensors 时 TEI 会转换写入
      - ${MIS_TEI_RERANK_MODELS_HOST_PATH:-/aidata/models/reranker}:/home/HwHiAiUser/model:rw
    command:
      - --model-id
      - ${MIS_TEI_RERANK_MODEL_ID:-/home/HwHiAiUser/model/bge-reranker-large}
      - --hostname
      - "0.0.0.0"
      - --port
      - "8080"
      - --served-model-name
      - ${MIS_TEI_RERANK_SERVED_NAME:-bge-reranker-large}
    mem_limit: ${MIS_TEI_RERANK_MEM_LIMIT:-32g}

networks:
  mis-tei-net:
    name: ${MIS_TEI_NETWORK_NAME:-mis-tei-stack}
    driver: bridge
