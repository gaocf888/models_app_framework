# =============================================================================
# 应用层在线服务栈（昇腾 Ascend · Atlas 300I Duo · models-app）
# =============================================================================
#
# 【用途】
#   与 docker-compose.yml（CPU）、docker-nvidia/（英伟达）、docker-mx/（沐曦）并列。
#   本文件使 models-app 使用昇腾底座镜像中的 torch_npu，并通过
#   EMBEDDING_DEVICE / RAG_RERANKER_DEVICE（如 npu:0 / npu:1）跑嵌入与重排。
#
# 【外部依赖 · 须先于本文件启动】
#   1) EasySearch：rag_db-deploy
#   2) vLLM：vllm-deploy（./deploy.sh --platform ascend）
#   3) MinerU：mineru-deploy（docker-compose.gpu.ascend.yml，若启用）
#
# 【.env】
#   使用上级目录 app/app-deploy/.env（由 .env.example 复制）。
#   昇腾建议：
#     ASCEND_RT_VISIBLE_DEVICES=4,5
#     EMBEDDING_DEVICE=npu:0
#     RAG_RERANKER_DEVICE=npu:1
#   底座镜像默认：quay.io/ascend/vllm-ascend:v0.23.0-310p（与 vLLM / MinerU 同底座，CANN 9.1.0）
#   建议在 .env 写 BASE_IMAGE=... 以免旧 .env 无此键时误用过期默认
#
# 【启动】（在 app/app-deploy 目录）
#   docker compose -f docker-ascend/docker-compose-ascend.yml up -d --build
#
# 【前置】
#   宿主机：NPU 驱动 26.1.1 + 固件 9.0.0.9.220 + Ascend Docker Runtime 26.1.0
#
# 【业务源码 mount】
#   APP_SOURCE_HOST_PATH / CONFIGS_HOST_PATH（默认 /opt/deploy/models_app_framework/{app,configs}）
#   离线机：有网 build 镜像；代码/配置在宿主机 sync 后 docker compose restart models-app
#
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: models-app-redis
    restart: unless-stopped
    networks:
      - app-internal
    volumes:
      - ${REDIS_DATA_HOST_PATH:-/aidata/data/redis_data}:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/minio/minio:latest
    container_name: models-app-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${MINIO_DATA_HOST_PATH:-/aidata/data/minio_data}:/data
    networks:
      app-internal: {}
      vllm-external: {}

  models-app:
    build:
      context: ../../..
      dockerfile: app/app-deploy/docker-ascend/Dockerfile-ascend
      args:
        BASE_IMAGE: ${BASE_IMAGE:-quay.io/ascend/vllm-ascend:v0.23.0-310p}
    image: ${MODELS_APP_IMAGE:-models-app:ascend}
    container_name: models-app
    restart: unless-stopped
    runtime: ${ASCEND_DOCKER_RUNTIME:-ascend}
    privileged: true
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    env_file:
      - ../.env
    command:
      - sh
      - -c
      - exec python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8083 --workers $${UVICORN_WORKERS:-1}
    ports:
      - "${APP_PORT:-8083}:8083"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      app-internal: {}
      vllm-external: {}
      rag-external: {}
      mineru-external: {}
      paddle-layout-external: {}
      face-milvus-external: {}
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - ${APP_SOURCE_HOST_PATH:-/opt/deploy/models_app_framework/app}:/workspace/app
      - ${CONFIGS_HOST_PATH:-/opt/deploy/models_app_framework/configs}:/workspace/configs
      - ../logs:/workspace/logs
      - ${SESSION_STORAGE_HOST_PATH:-/aidata/data/session_storage}:/workspace/data/conversation_archive
      - ${INSPECT_EXTRACT_JOBS_HOST_PATH:-/aidata/data/inspect_extract_jobs}:/workspace/data/inspection_extract_jobs
      - ${RAG_FAISS_DATA_HOST_PATH:-/aidata/data/faiss_data}:/workspace/data/faiss
      - ${EMBEDDING_MODELS_HOST_PATH:-/aidata/models/embeddings}/Qwen3-Embedding-0.6B:/workspace/models/embeddings/Qwen3-Embedding-0.6B:ro
      - ${RERANKER_MODELS_HOST_PATH:-/aidata/models/reranker}/Qwen3-Reranker-0.6B:/workspace/models/rerank/Qwen3-Reranker-0.6B:ro
      - ${INTENT_MODELS_HOST_PATH:-/aidata/models/intent}/chatbot-intent-bert:/workspace/models/intent/chatbot-intent-bert:ro
      - ${INTENT_LLM_MODELS_HOST_PATH:-/aidata/models/llm}/qwen2.5-0.5b-instruct:/workspace/models/llm/qwen2.5-0.5b-instruct:ro
      - ${MINERU_IO_HOST_PATH:-mineru-io-dummy}:/workspace/mineru-io
      - face-galleries-data:/workspace/data/face_galleries
      - ${INSIGHTFACE_MODELS_HOST_PATH:-/opt/deploy/models_app_framework/app/small_models/pretrained/insightface}:/workspace/app/small_models/pretrained/insightface
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro
      - /dev:/dev
    environment:
      ASCEND_RT_VISIBLE_DEVICES: ${ASCEND_RT_VISIBLE_DEVICES:-4,5}
      RAG_RERANKER_MODEL_PATH: /workspace/models/rerank/Qwen3-Reranker-0.6B
      # 厂商 Python（v0.23+ 为 3.12.13；旧 0.10 为 3.11.13）
      PATH: /usr/local/python3.12.13/bin:/usr/local/python3.11.13/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

networks:
  app-internal:
    driver: bridge
  vllm-external:
    name: ${VLLM_DOCKER_NETWORK:-docker_vllm-network}
    external: true
  rag-external:
    name: ${RAG_DOCKER_NETWORK:-ai-stack}
    external: true
  mineru-external:
    name: ${MINERU_DOCKER_NETWORK:-mineru-stack}
    external: true
  paddle-layout-external:
    name: ${PADDLE_LAYOUT_DOCKER_NETWORK:-paddle-layout-stack}
    external: true
  face-milvus-external:
    name: ${FACE_MILVUS_NETWORK:-face-milvus-stack}
    external: true

volumes:
  huggingface-cache: {}
  face-galleries-data: {}
  insightface-models-dummy:
    driver: local
  mineru-io-dummy:
    driver: local
