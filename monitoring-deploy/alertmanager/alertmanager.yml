global:
  resolve_timeout: 5m

route:
  receiver: default-webhook
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      receiver: default-webhook
      continue: true

receivers:
  # 一期占位：请改为企业微信/钉钉/邮件 Webhook
  - name: default-webhook
    webhook_configs:
      - url: "http://127.0.0.1:9/dev-null"
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: ["alertname", "service"]
