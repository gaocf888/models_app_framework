modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
      preferred_ip_protocol: ip4
      follow_redirects: true
      tls_config:
        insecure_skip_verify: true

  # EasySearch 等 HTTPS 健康探针可改用本模块，并在 prometheus.yml 单独配置带认证的 probe
  http_2xx_insecure:
    prober: http
    timeout: 8s
    http:
      valid_status_codes: [200]
      method: GET
      tls_config:
        insecure_skip_verify: true
