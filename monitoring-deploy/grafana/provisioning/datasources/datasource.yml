apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9091
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  # Tempo：仅当 compose profile tracing 启动 tempo 时可用；未启动时 Grafana 会显示数据源错误（可忽略）
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      tracesToMetrics:
        datasourceUid: prometheus
