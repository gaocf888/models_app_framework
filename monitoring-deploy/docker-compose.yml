# 独立监控栈：Prometheus + Grafana + Alertmanager + Blackbox
# 权威方案：docs/系统Prometheus资源监控实现方案.md
#
# 启动（业务栈须先起，且外部网络已存在）：
#   cp .env.example .env
#   bash scripts/prepare-data-dirs.sh   # bind 目录 chown，避免 permission denied
#   docker network create docker_vllm-network 2>/dev/null || true
#   docker network create ai-stack 2>/dev/null || true
#   docker network create mineru-stack 2>/dev/null || true
#   docker compose --env-file .env up -d
# 英伟达 GPU：COMPOSE_PROFILES=gpu-nvidia 或 --profile gpu-nvidia
# 昇腾 NPU：  COMPOSE_PROFILES=gpu-ascend 或 --profile gpu-ascend
# 其它加速卡：未内置，见 README §3.1

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: monitoring-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9091}:9091"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.listen-address=0.0.0.0:9091
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ${PROMETHEUS_DATA_HOST_PATH:-prometheus-data}:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring-internal
      - vllm-external
      - rag-external
      - mineru-external
    depends_on:
      - blackbox-exporter
      - alertmanager

  grafana:
    image: grafana/grafana:11.2.0
    container_name: monitoring-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3000}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ${GRAFANA_DATA_HOST_PATH:-grafana-data}:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring-internal
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: monitoring-alertmanager
    restart: unless-stopped
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${ALERTMANAGER_DATA_HOST_PATH:-alertmanager-data}:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    networks:
      - monitoring-internal

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: monitoring-blackbox
    restart: unless-stopped
    ports:
      - "${BLACKBOX_PORT:-9115}:9115"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - monitoring-internal
      - vllm-external
      - rag-external
      - mineru-external

  # 宿主机节点指标（默认启动；Linux 宿主机需挂载 /proc /sys）
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: monitoring-node-exporter
    restart: unless-stopped
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks:
      - monitoring-internal

  # ---- GPU / NPU 监控（按现场卡型启用 profile，勿默认全开）----
  # 英伟达：COMPOSE_PROFILES=gpu-nvidia  或  --profile gpu-nvidia
  # 昇腾：  COMPOSE_PROFILES=gpu-ascend  或  --profile gpu-ascend
  # 沐曦/寒武纪/其它：本仓库未内置 exporter，须单独增加（见 README §GPU）
  dcgm-exporter:
    image: ${DCGM_EXPORTER_IMAGE:-nvidia/dcgm-exporter:4.8.3}
    container_name: monitoring-dcgm-exporter
    restart: unless-stopped
    profiles: ["gpu-nvidia"]
    runtime: ${NVIDIA_RUNTIME:-nvidia}
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,compat32
    ports:
      - "${DCGM_EXPORTER_PORT:-9400}:9400"
    cap_add:
      - SYS_ADMIN
    networks:
      - monitoring-internal

  npu-exporter:
    image: ${ASCEND_NPU_EXPORTER_IMAGE:-ascendai/npu-exporter:v7.3.2}
    container_name: monitoring-npu-exporter
    restart: unless-stopped
    profiles: ["gpu-ascend"]
    privileged: true
    pid: host
    ports:
      - "${ASCEND_NPU_EXPORTER_PORT:-8082}:8082"
    volumes:
      - ${ASCEND_DRIVER_HOST_PATH:-/usr/local/Ascend/driver}:/usr/local/Ascend/driver:ro
      - ${ASCEND_DCMI_HOST_PATH:-/usr/local/dcmi}:/usr/local/dcmi:ro
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro
      - /dev:/dev
    # 默认使用镜像 ENTRYPOINT；若需自定义参数，在 docker-compose.override.yml 写 command
    networks:
      - monitoring-internal

  # ---- 请求/任务级 Trace（可选）：COMPOSE_PROFILES=tracing 或 --profile tracing ----
  # 推荐：Redis（/ops/traces）+ Tempo（Grafana 瀑布图）
  # 应用侧：EXECUTION_TRACE_OTLP_ENABLED=true
  #          OTEL_EXPORTER_OTLP_ENDPOINT=http://monitoring-tempo:4318
  # models-app 与 tempo 均在 vllm-external（docker_vllm-network）时可直接 DNS 解析容器名
  tempo:
    image: grafana/tempo:2.6.1
    container_name: monitoring-tempo
    restart: unless-stopped
    profiles: ["tracing"]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "${TEMPO_HTTP_PORT:-3200}:3200"
      - "${TEMPO_OTLP_HTTP_PORT:-4318}:4318"
      - "${TEMPO_OTLP_GRPC_PORT:-4317}:4317"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - ${TEMPO_DATA_HOST_PATH:-tempo-data}:/var/tempo
    networks:
      - monitoring-internal
      - vllm-external

networks:
  monitoring-internal:
    driver: bridge
  vllm-external:
    name: ${VLLM_DOCKER_NETWORK:-docker_vllm-network}
    external: true
  rag-external:
    name: ${RAG_DOCKER_NETWORK:-ai-stack}
    external: true
  mineru-external:
    name: ${MINERU_DOCKER_NETWORK:-mineru-stack}
    external: true

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  tempo-data:
