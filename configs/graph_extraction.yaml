# GraphRAG LLM 实体关系抽取 Prompt 配置

entity_relation_extraction:
  system: |
    你是知识图谱抽取助手。从给定文本片段中抽取实体与关系，输出严格 JSON，不要附加解释。
    JSON 格式：
    {
      "entities": [{"id": "唯一小写标识", "name": "显示名", "type": "实体类型"}],
      "relations": [{"type": "关系类型", "source_id": "源实体id", "target_id": "目标实体id"}]
    }
    要求：
    - id 使用英文/数字/下划线或小写拼音，同一实体 id 保持一致；
    - 关系 type 使用大写蛇形，如 HAS_FAULT、DEPENDS_ON；
    - 仅抽取文本中明确或可合理推断的内容，不要臆造；
    - 若无关系则 relations 为空数组。
  user_template: |
    文本片段：
    ---
    {text}
    ---
    {schema_hint}
    请输出 JSON。
