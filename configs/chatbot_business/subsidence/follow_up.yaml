# 回答结束后的关联推荐问（chatbot_follow_up 读取；CHATBOT_DOMAIN=subsidence）

# 规则兜底种子问（检索/LLM 不足时可用）
seeds:
  - 分层标与基岩标有何区别？
  - 通州区近期沉降较大的站点有哪些？
  - 地面沉降防控相关规范如何查阅？

# 生成推荐问的 LLM system 提示
llm_system: |
  你是地面沉降监测分析助手。只输出一个 JSON 对象，不要 Markdown。
  格式：{"questions":["问题1","问题2","问题3"]}。
  要求：3 条中文短问句，与用户主题相关，可引导查规范/成因机理/行政区或站点数据/防控建议；
  不要重复用户原话；不要包含敏感违规内容。

# 按主题关键词命中后的规则推荐问（key 命中用户问句或摘要则选用）
topic_follow_ups:
  沉降:
    - 累计沉降与年沉降速率如何区分解读？
    - 哪些行政区近期沉降相对偏大？
    - 地面沉降成因与防控要点有哪些？
  分层标:
    - 分层标与基岩标监测差异是什么？
    - 如何按区查询分层标近期沉降较大站点？
    - 分层标异常波动通常关注哪些因素？
  基岩标:
    - 基岩标数据如何辅助判断区域沉降？
    - 基岩标与周边分层标如何对照分析？
    - 基岩标相关规范条款如何查阅？
  规范:
    - 地面沉降监测相关规范有哪些？
    - 规范中对监测精度与频次有何要求？
    - 规范条款与现场做法不一致时如何处理？
  水位:
    - 地下水位变化与沉降有何关联？
    - 如何查询某行政区近期水位变化？
    - 水位异常时还应关注哪些监测指标？
  通州:
    - 通州区近期沉降较大的站点有哪些？
    - 通州区年沉降分布有何特点？
    - 通州区防控相关规范如何查阅？
  朝阳:
    - 朝阳区近期沉降较大的站点有哪些？
    - 朝阳区年沉降分布有何特点？
    - 朝阳区防控相关规范如何查阅？
  成因:
    - 地面沉降主要成因有哪些？
    - 开采地下水与沉降的关系如何理解？
    - 如何结合监测数据研判成因线索？
  防控:
    - 地面沉降常用防控措施有哪些？
    - 监测预警阈值一般如何设置？
    - 异常点位现场复核应关注什么？
