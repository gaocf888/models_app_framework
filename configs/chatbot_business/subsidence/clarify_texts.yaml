# 固定话术与生成侧文案（CHATBOT_DOMAIN=subsidence）

# 意图 clarify：请用户补充信息
clarify: 为了更准确地分析，请补充更具体的信息：关注的行政区或监测站点、时间范围，以及你想了解的是规范解释、成因机理，还是监测数据查询。
# 意图 unsafe：敏感/安全策略拒答
unsafe: 当前问题涉及安全或敏感策略，暂不支持直接回答。请联系业务值班人员进一步确认。
# 意图 handoff_human：转人工占位话术
handoff: 该问题建议转人工确认。请提供联系方式、关注区域/站点与问题详情，监测单位将尽快协助。
# 意图 smalltalk：寒暄欢迎语
smalltalk: 你好，我是地面沉降分析助手。你可以询问监测规范、成因机理，或按行政区/站点查询沉降相关数据。

# 生成约束：知识片段不足时，禁止编造的细粒度内容类型（注入 system）
rag_snippet_granularity_forbid: 监测指标条目、行政区清单、未检索到的规范条款或测点读数
# 无足够知识命中时的生成前置说明（须先声明「暂无足够依据」再做克制分析）
insufficient_evidence_hint: |
  【知识依据不足】本轮未检索到足够相关知识片段。须先明确说明「知识库暂无足够依据」，
  再基于通用地面沉降监测专业知识做收紧、克制的分析；禁止把通用推断写成「依据某规范/某文档」，
  禁止编造测点数据、条文编号；并提示以现行制度与业务方确认为准。
# FAQ 软直通：高分命中时要求优先复述权威片段、避免历史旧答带偏
faq_soft_direct_authority: |
  【高分 FAQ 软直通·权威片段】下列第一条知识片段与本轮用户问题高度匹配（检索分达到软直通阈值）。
  回答时必须优先逐条复述该条片段中的问答内容，不得采用对话历史中关于同一问题的旧结论，
  不得改写成泛化的「成因概述/防控宏观框架」等套话，除非该片段本身如此表述。

# Hybrid 双臂综合：数值以查数结果为准、机理规范以知识库为准
hybrid_synth_constraint: |
  【综合回答约束】数值与列表以【监测查询结果】为准；成因机理、规范条款、防控建议以【规范与知识依据】为准；
  周期沉降 Δ=初值−末值时 Δ>0 通常表示下沉倾向、Δ<0 表示回弹，保持符号语义；禁止编造测点数据；禁止在回答中输出 SQL 或代码块。
# Hybrid 用户消息中查数结果块标题
hybrid_query_result_title: 【监测查询结果】
# Hybrid 用户消息中知识库块标题
hybrid_kb_title: 【规范与知识依据】
# Hybrid 双臂均失败时的降级提示
hybrid_both_failed: 未能同时获取监测查询结果与规范知识依据。请换一种方式描述行政区/站点/时间，或拆分为「查数」与「规范/机理问答」。
