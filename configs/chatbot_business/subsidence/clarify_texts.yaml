# 固定话术与生成侧文案（CHATBOT_DOMAIN=subsidence）

# 意图 clarify：请用户补充信息
clarify: 为了更准确地分析，请补充更具体的信息：关注的行政区或监测站点、时间范围，以及你想了解的是规范解释、成因机理，还是监测数据查询。
# 意图 unsafe：敏感/安全策略拒答
unsafe: 当前问题涉及安全或敏感策略，暂不支持直接回答。请联系业务值班人员进一步确认。
# 意图 handoff_human：转人工占位话术
handoff: 该问题建议转人工确认。请提供联系方式、关注区域/站点与问题详情，监测单位将尽快协助。
# 意图 smalltalk：寒暄欢迎语
smalltalk: 你好，我是地面沉降分析助手。你可以询问监测规范、成因机理，或按行政区/站点查询沉降相关数据。

# 生成约束：禁止冒充库内依据的细粒度类型（注入 system；允许一般成因/防控机理延伸）
rag_snippet_granularity_forbid: 测点读数、行政区或站点清单、未给出的规范条款编号
# 无检索片段注入时的生成说明（勿在用户正文声明检索成败）
insufficient_evidence_hint: |
  【作答说明】本轮未注入检索知识片段。请直接基于地面沉降监测与防控的通用专业知识作答：
  给出清晰结论、必要机理与可操作建议；不要在正文中提及「知识库」「检索」「未命中」「知识片段不足」等元信息；
  禁止编造具体测点读数、未给出的规范条款编号或行政区/站点清单；
  重大结论可提示以监测单位审核与现行制度确认为准。
# FAQ 软直通：以权威片段为准，允许简短解读与延伸
faq_soft_direct_authority: |
  【高分 FAQ 软直通·权威片段】下列第一条知识片段与本轮用户问题高度匹配。
  请以该条片段事实为准作答，可补充简短解读与必要专业延伸，但不得偏离或推翻该片段中的核心结论与表述；
  不要采用对话历史中关于同一问题的冲突旧结论；勿在正文说明「本回答来自知识库/FAQ」或对比通用分析。

# Hybrid 双臂综合：数值以查数结果为准、机理规范以知识库为准
hybrid_synth_constraint: |
  【综合回答约束】数值与列表以【监测查询结果】为准；成因机理、规范条款、防控建议以【规范与知识依据】为准；
  周期沉降 Δ=初值−末值时 Δ<0 表示沉降、Δ>0 表示回弹，保持符号语义；禁止编造测点数据；禁止在回答中输出 SQL 或代码块。
# Hybrid 用户消息中查数结果块标题
hybrid_query_result_title: 【监测查询结果】
# Hybrid 用户消息中知识库块标题
hybrid_kb_title: 【规范与知识依据】
# Hybrid 双臂均失败时的降级提示
hybrid_both_failed: 未能同时获取监测查询结果与规范知识依据。请换一种方式描述行政区/站点/时间，或拆分为「查数」与「规范/机理问答」。
