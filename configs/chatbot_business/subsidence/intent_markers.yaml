  - 为什么
  - 什么原因
  - 常见原因
  - 成因
  - 机理
  - 原理
  - 如何预防
  - 如何防范
  - 如何控制
  - 防控
  - 危害
  - 风险
  - 标准是什么
  - 规范
  - 规程
  - 条款
  - 符合什么
  - 有何区别
  - 差异
  - 区别
  - 什么是
  - 是什么
  - 含义
  - 定义
  - 解释
  - 依据
  - 是否允许
  - 注意事项
  - 如何处置
  - 怎么处理
  - 如何处理
  - 处置建议
  - 监测方法
  - 分层标原理
  - 基岩标原理
  - 经验
  - 论文
  - 参考
  - 出具
  - 出一份
  - 方案
  - 制定计划
  - 制定方案
  - 编制计划
  - 编制方案
  - 给出方案
  - 给出计划
  - 给出建议
  - 提出建议
  - 改进建议
  - 优化建议

# 查数类标记：命中且未命中概念标记时走 data_query
# 只放「查询动词 / 统计指标」；勿放分层标、行政区等实体词，否则概念问会误判为 hybrid_qa
data_markers:
  - 统计
  - 查询
  - 查出
  - 检索
  - 列出
  - 罗列
  - 导出
  - 有多少
  - 多少条
  - 几条
  - 列表
  - 排序
  - top
  - TOP
  - 第几页
  - 分页
  - 筛选
  - 按时间
  - 累计沉降
  - 年沉降
  - 沉降量
  - 沉降速率
  - 回弹
  - total_settle

# 强查数正则：与 data_markers 配合，提高结构化查数识别强度
strong_data_regex: "(统计|查询|查出|列出|有多少|多少条|几条|累计沉降|年沉降|沉降量|沉降速率|total_settle)"

# 短句硬闸：冷启动无足够上下文时走 clarify（需用户补充信息）
unclear_patterns:
  - '^怎么弄[啊呀吗呢]?$'
  - '^怎么办[啊呀吗呢]?$'
  - '^啥意思[啊呀吗呢]?$'
  - '^(这个|那个|它).{0,3}(怎么|怎么办|啥意思)'

# 上一轮助手澄清话术特征：用于识别「澄清后的续问」上下文
clarify_reply_snippet: 请补充更具体的信息

# 历史摘要命中词：短句续问时判断是否延续同一咨询主题
history_continuation_markers:
  - 沉降
  - 分层标
  - 基岩标
  - 规范
  - 站点
  - 监测
  - 图片
  - 照片
  - 上图
  - 这张
  - 行政区
  - 水位
  - 通州
  - 朝阳
  - 成因
  - 防控

# 意图 LLM 分类示例（注入 prompt；勿照抄 reason，仅作标签参考）
intent_llm_examples: |
  - kb_qa：「分层标与基岩标监测差异是什么」「地面沉降成因机理」「相关规范如何查阅」
  - data_query：「通州区近三个月沉降较大的分层标站点有哪些」「统计朝阳区年沉降」
  - hybrid_qa：「查出朝阳区年沉降偏大的点，并结合规范说明关注要点」
  - clarify：「这个呢」「怎么办」（且无足够会话上下文）
