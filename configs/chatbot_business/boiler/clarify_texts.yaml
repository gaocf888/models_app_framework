# 固定话术与生成侧文案（CHATBOT_DOMAIN=boiler）

# 意图 clarify：请用户补充信息
clarify: 为了更准确地回答你，请补充更具体的信息：你要咨询的是哪一项业务、当前遇到的具体问题现象，以及你期望的结果。
# 意图 unsafe：敏感/安全策略拒答
unsafe: 当前问题涉及安全策略，暂不支持直接回答。请联系人工客服进一步处理。
# 意图 handoff_human：转人工占位话术
handoff: 该问题建议转人工处理。请提供联系方式与问题详情，我们将尽快协助你。
# 意图 smalltalk：寒暄欢迎语
smalltalk: 你好，我在这里。你可以告诉我你想咨询的具体业务问题，我会尽力帮你解决。

# 生成约束：禁止冒充库内依据的细粒度类型（注入 system；允许一般机理/排查延伸）
rag_snippet_granularity_forbid: 未列出的故障类型、设备条目、未给出的规程条款编号或厂内测点数据
# 无检索片段注入时的生成说明（勿在用户正文声明检索成败）
insufficient_evidence_hint: |
  【作答说明】本轮未注入检索知识片段。请直接基于燃煤锅炉与承压系统的通用专业知识作答：
  给出清晰结论、必要机理与可操作的排查/检修建议；不要在正文中提及「知识库」「检索」「未命中」「知识片段不足」等元信息；
  禁止编造未列出的故障类型、设备条目、未给出的规程条款编号或厂内测点数据；
  涉及人身与设备重大安全决策时，提醒以现场规程与人工确认为准。
# FAQ 软直通：以权威片段为准，允许简短解读与延伸
faq_soft_direct_authority: |
  【高分 FAQ 软直通·权威片段】下列第一条知识片段与本轮用户问题高度匹配。
  请以该条片段事实为准作答，可补充简短解读与必要专业延伸，但不得偏离或推翻该片段中的核心结论与表述；
  不要采用对话历史中关于同一问题的冲突旧结论；勿改写成泛化的「燃烧优化/安全监控」等宏观框架（除非该片段本身如此表述）；
  勿在正文说明「本回答来自知识库/FAQ」或对比通用分析。

# Hybrid 双臂综合：数值以查数结果为准、机理规程以知识库为准
hybrid_synth_constraint: |
  【综合回答约束】数值与列表以【查询结果】为准；机理、标准、处置以【知识库】为准；禁止编造表数据；禁止在回答中输出 SQL 或代码块。
hybrid_query_result_title: 【查询结果】
hybrid_kb_title: 【知识库】
hybrid_both_failed: 未能同时获取查询结果与知识库依据，请换一种方式描述问题，或拆分为查数与知识问答。
