# 强查数正则：与 data_markers 配合，提高结构化查数识别强度
strong_data_regex: "(统计|查询|查出|列出|有多少|多少条|几条|台账|检修记录|缺陷记录|设备清单|工单号|编号为)"

# 短句硬闸：冷启动无足够上下文时走 clarify
unclear_patterns:
  - '^怎么弄[啊呀吗呢]?$'
  - '^怎么办[啊呀吗呢]?$'
  - '^啥意思[啊呀吗呢]?$'
  - '^(这个|那个|它).{0,3}(怎么|怎么办|啥意思)'

# 上一轮助手澄清话术特征：用于识别「澄清后的续问」
clarify_reply_snippet: 请补充更具体的信息

# 历史摘要命中词：短句续问时判断是否延续同一咨询主题
history_continuation_markers:
  - 缺陷
  - 图片
  - 照片
  - 上图
  - 这张
  - 识别
  - 损伤
  - 裂纹
  - 泄漏
  - 检修
  - 设备
  - 炉
  - 管

# 意图 LLM 分类示例（注入 prompt；勿照抄 reason，仅作标签参考）
intent_llm_examples: |
  - kb_qa：「过热器爆管常见原因」「锅炉启停注意事项」「什么是蠕变」
  - data_query：「查询1号炉最近一次检修记录」「统计本月缺陷单数量」
  - hybrid_qa：「查出超温点列表并结合规程说明如何处置」
  - clarify：「这个呢」「怎么办」（且无足够会话上下文）
