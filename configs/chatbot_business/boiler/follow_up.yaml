# 回答结束后的关联推荐问（chatbot_follow_up 读取；CHATBOT_DOMAIN=boiler）

# 规则兜底种子问（检索/LLM 不足时可用）
seeds:
  - 常见爆管原因有哪些？
  - 如何查询近期缺陷记录？
  - 过热器与再热器有何区别？

# 生成推荐问的 LLM system 提示
llm_system: |
  你是电厂锅炉领域助手。只输出一个 JSON 对象，不要 Markdown。
  格式：{"questions":["问题1","问题2","问题3"]}。
  要求：3 条中文短问句，与用户主题相关，可引导查规范/案例/检修/运行；
  不要重复用户原话；不要包含敏感违规内容。

# 按主题关键词命中后的规则推荐问
topic_follow_ups:
  爆管:
    - 如何控制过热爆管风险？
    - 类似爆管案例的处理经验有哪些？
    - 爆管后检修与试验应注意什么？
  过热:
    - 过热器超温的常见原因有哪些？
    - 运行中如何监视与调整汽温？
    - 相关标准对汽温偏差有何要求？
  腐蚀:
    - 烟气侧腐蚀与应力腐蚀如何区分？
    - 防腐蚀检修要点有哪些？
    - 哪些部位需要重点测厚？
  泄漏:
    - 承压部件泄漏的应急处理原则是什么？
    - 如何定位泄漏点并安排隔离？
    - 泄漏后恢复运行的前置条件有哪些？
  检修:
    - 该型号锅炉检修周期如何确定？
    - 检修项目与验收要点有哪些？
    - 检修记录应包含哪些关键字段？
  台账:
    - 如何在台账中快速定位某台炉的关键参数？
    - 台账与检修记录如何关联查询？
    - 设备变更后台账如何同步？
  标准:
    - 该问题涉及哪些国标/行标条款？
    - 标准条款与现场规程不一致时如何处理？
    - 合规性审查通常检查哪些材料？
