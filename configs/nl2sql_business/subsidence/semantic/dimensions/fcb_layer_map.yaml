source: docs/地降所需求及数据相关/数据库结构及逻辑/沉降数据获取计算逻辑/分层标层位分析.xls
description: 由上述分层标层位分析.xls转换的分层标监测层位字典：project_name↔站点，station_name↔标编号；monitor_layer=0 为站点代表标（浅部）
notes:
- 行政区过滤以 t_station.area 为准；district_raw 为 xls 原文简称，可能无「区」字
- monitor_layer 为空表示中间辅助标，不参与站点代表与相邻层间压缩计算
- 周期沉降 Δ = total_settle(窗初) - total_settle(窗末)；Δ>0 下沉倾向，Δ<0 回弹
