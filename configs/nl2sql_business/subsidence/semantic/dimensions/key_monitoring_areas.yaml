# 重点监测区站点分组（semantic/dimensions/key_monitoring_areas.yaml）
# 来源：监测季报.docx 第四章「表4-1 重点监测区地面沉降监测情况」
# 站点场地名 / 层位0代表标对齐 fcb_layer_map.yaml；行政区过滤仍以 t_station.area 为准。
# 供自动报告「重点监测区」板块与后续 NL2SQL 范围约束使用。
# 说明见 configs/nl2sql_business/subsidence/配置项说明.md
source: docs/地降所需求及数据相关/报告模版/监测季报.docx
description: 季报表4-1提炼的重点监测区→监测站清单；数值列不入库，运行时按报告时间窗重算
notes:
- 周报/月报正文称「××附近地区」，与本表 area_name 为同一组，见 aliases
- project_name / layer0_station_name 必须与 fcb_layer_map 层位0条目一致，禁止用 t_station 全表替代
- location_raw 取自季报附表1地点表述，仅供叙述；SQL 关联用 project_name = t_station.name
- 部分站压缩层不齐（见 fcb_layer_map note：F9/F10 无第四，F11 无第三、四）；表4-1缺层单元格运行时留空，勿臆造
