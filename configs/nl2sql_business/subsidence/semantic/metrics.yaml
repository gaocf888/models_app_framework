# 地降开放指标定义（semantic/metrics.yaml）
# 供 align_semantics 命中指标、preferred_tables/columns、formula_note。
# 周期沉降口径：Δ = total_settle(窗初)−(窗末)；Δ>0 下沉；站点用 monitor_layer=0。
# 说明见上级「配置项说明.md」
version: "2026.09.11"
metrics:
  - id: period_subsidence_mm
    name: 周期沉降量
    synonyms: [沉降量, 下沉量, 累计沉降, 地面沉降, 沉降了多少, 下沉多少, 沉降, 下沉, 监测点沉降]
    unit: mm
    grain: station_period
    formula_note: "窗口内 total_settle 初值减末值（初−末）；Δ>0 下沉倾向，Δ<0 回弹；站点粒度须用 monitor_layer=0 代表标"
    forbidden_confusions: [groundwater_depth, gnss_displacement_3d, pore_pressure]
    preferred_tables: [t_data_wash_fcb, t_data_wash_jyb]
    preferred_columns: [total_settle]
    time_column: data_time

  - id: period_rebound_mm
    name: 周期回弹量
    synonyms: [回弹量, 回弹, 上升量]
    unit: mm
    grain: station_period
    formula_note: "同周期沉降公式 Δ=初−末；回弹对应 Δ<0（或按业务取 |Δ| 表述时须说明符号约定）"
    forbidden_confusions: [groundwater_depth, gnss_displacement_3d]
    preferred_tables: [t_data_wash_fcb, t_data_wash_jyb]
    preferred_columns: [total_settle]
    time_column: data_time

  - id: layer_compress_mm
    name: 压缩层层间压缩量
    synonyms: [压缩层沉降, 层间压缩, 层间沉降, 第1压缩层, 第2压缩层]
    unit: mm
    grain: layer_interval
    formula_note: "compress(i→i+1)=Δ(层位i)−Δ(层位i+1)；边界标见 fcb_layer_map；非单标 total_settle 直接当层沉降"
    forbidden_confusions: [groundwater_depth, gnss_displacement_3d]
    preferred_tables: [t_data_wash_fcb, t_data_wash_jyb]
    preferred_columns: [total_settle]
    time_column: data_time

  - id: point_subsidence_mm
    name: 测点累计沉降
    synonyms: [当前沉降, 最新沉降, 累计值]
    unit: mm
    grain: station_point
    preferred_tables: [t_data_wash_fcb, t_data_wash_jyb]
    preferred_columns: [total_settle]
    time_column: data_time

  - id: gnss_displacement_2d
    name: GNSS水平位移
    synonyms: [水平位移, 二维位移]
    unit: mm
    preferred_tables: [t_data_wash_gnss]
    preferred_columns: [displacement_2d]
    time_column: data_time
    forbidden_confusions: [period_subsidence_mm]

  - id: gnss_displacement_3d
    name: GNSS三维位移
    synonyms: [三维位移, 空间位移, GNSS位移, 位移]
    unit: mm
    preferred_tables: [t_data_wash_gnss]
    preferred_columns: [displacement_3d, displacement_2d]
    time_column: data_time
    forbidden_confusions: [period_subsidence_mm]

  - id: groundwater_depth
    name: 地下水埋深
    synonyms: [水位, 埋深, 降深, 地下水, 水位埋深]
    unit: m
    preferred_tables: [t_data_wash_dxswj]
    preferred_columns: [deep, elevation]
    time_column: data_time
    forbidden_confusions: [period_subsidence_mm]

  - id: pore_pressure
    name: 孔隙水压力
    synonyms: [孔隙水, 孔压, 孔隙水压]
    unit: kPa
    preferred_tables: [t_data_wash_kxsylj]
    preferred_columns: [pressure]
    time_column: data_time

  - id: meteo_temp
    name: 气温
    synonyms: [温度, 气温]
    unit: "℃"
    preferred_tables: [t_data_wash_qxz]
    preferred_columns: [temp]
    time_column: data_time

  - id: meteo_rain
    name: 降水
    synonyms: [降雨, 降水量, 雨量]
    unit: mm
    preferred_tables: [t_data_wash_qxz]
    preferred_columns: [real_time_rain]
    time_column: data_time

  - id: fiber_settle
    name: 光纤沉降
    synonyms: [光纤沉降量]
    unit: mm
    preferred_tables: [t_data_wash_gq]
    preferred_columns: [total_settle]
    time_column: data_time

  # ---------- 运维中间库 om_result（须按 snapshot_time 最新批次过滤）----------
  - id: om_online_rate
    name: 仪器在线率
    synonyms: [在线率, 在线情况, 设备在线, 仪器在线]
    unit: "%"
    grain: device_type_snapshot
    formula_note: "按仪器类型汇总；须 snapshot_time=最新批次；列 online_rate"
    forbidden_confusions: [period_subsidence_mm]
    preferred_tables: [t_om_device_online_by_type]
    preferred_columns: [type, total, online, offline, online_rate]
    time_column: snapshot_time

  - id: om_complete_rate
    name: 数据完整率
    synonyms: [完整率, 数据完整率, 完好率]
    unit: "%"
    grain: device_type_snapshot
    formula_note: "近4天窗口(T-5~T-2)；rate；须最新 snapshot_time；禁止用沉降有数天数估算"
    forbidden_confusions: [period_subsidence_mm]
    preferred_tables: [t_om_complete_rate_by_type]
    preferred_columns: [type, rate, device_count, actual_count, theory_count]
    time_column: snapshot_time

  - id: om_effective_rate
    name: 数据有效率
    synonyms: [有效率, 数据有效率]
    unit: "%"
    grain: device_type_snapshot
    formula_note: "近4天窗口；含 invalid_count；须最新 snapshot_time"
    forbidden_confusions: [period_subsidence_mm]
    preferred_tables: [t_om_effective_rate_by_type]
    preferred_columns: [type, rate, invalid_count]
    time_column: snapshot_time

  - id: om_alarm_summary
    name: 数据告警总览
    synonyms: [告警总览, 告警统计, 告警仪器数, 数据告警, 告警台数, 告警设备台数]
    unit: ""
    grain: snapshot
    formula_note: "固定1行；total_count/alarm_count/normal_count/week_avg/month_avg；最新批次"
    forbidden_confusions: [period_subsidence_mm]
    preferred_tables: [t_om_data_alarm_summary]
    preferred_columns: [total_count, alarm_count, normal_count, week_avg, month_avg]
    time_column: snapshot_time

  - id: om_alarm_ratio
    name: 告警设备占比
    synonyms: [告警占比, 告警设备占比, 告警比例, 有警占比]
    unit: "%"
    grain: snapshot
    formula_note: "alarm_count/total_count*100（t_om_data_alarm_summary）；须最新 snapshot_time；勿用 week_avg/month_avg 冒充当前占比"
    forbidden_confusions: [period_subsidence_mm]
    preferred_tables: [t_om_data_alarm_summary]
    preferred_columns: [total_count, alarm_count]
    time_column: snapshot_time

  - id: om_alarm_list
    name: 告警仪器列表
    synonyms: [告警列表, 有警仪器, 设备告警, 仪器告警, 当前告警]
    unit: ""
    grain: device
    formula_note: "status恒为有警；持续时间=now()-off_time；最新 snapshot_time"
    forbidden_confusions: [period_subsidence_mm]
    preferred_tables: [t_om_device_alarm_list]
    preferred_columns: [device_name, type, area_name, ss_value, content, off_time]
    time_column: snapshot_time

  - id: om_offline_list
    name: 离线仪器列表
    synonyms: [离线仪器, 离线设备, 离线列表, 哪些设备离线]
    unit: ""
    grain: device
    formula_note: "须 status=0 且最新 snapshot_time；离线时长=now()-data_collect_time；勿依赖 create_time"
    forbidden_confusions: [period_subsidence_mm]
    preferred_tables: [t_om_offline_device_list]
    preferred_columns: [name, type, area_name, data_collect_time, status]
    time_column: snapshot_time

  - id: om_offline_duration
    name: 离线时长
    synonyms: [离线时长, 离线天数, 离线多久, 掉线多久, 离线时间]
    unit: day
    grain: device
    formula_note: "t_om_offline_device_list；status=0；时长=now()-data_collect_time（天≈EPOCH/86400）；须最新 snapshot_time"
    forbidden_confusions: [period_subsidence_mm]
    preferred_tables: [t_om_offline_device_list]
    preferred_columns: [name, type, area_name, data_collect_time]
    time_column: snapshot_time

  - id: om_month_complete_low
    name: 月完整性不达标名单
    synonyms: [月完整率低, 完整率不达标, 月完整性]
    unit: "%"
    grain: device
    formula_note: "仅含完整率<92%设备；近30天窗口；最新 snapshot_time"
    preferred_tables: [t_om_month_complete_list]
    preferred_columns: [name, type, area_name, complete_rate]
    time_column: snapshot_time

  - id: om_month_effective_low
    name: 月有效性不达标名单
    synonyms: [月有效率低, 有效率不达标, 月有效性]
    unit: "%"
    grain: device
    formula_note: "仅含有效率<90%设备；最新 snapshot_time"
    preferred_tables: [t_om_month_effective_list]
    preferred_columns: [name, type, area_name, complete_rate]
    time_column: snapshot_time
