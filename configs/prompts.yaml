#          "item_id": "q5",
#          "purpose": "运行参数联动分析",
#          "question": "围绕超温时段查询风门开度、蒸汽流量、氧量、负荷等关键运行参数及其同时间窗变化",
#          "mandatory": true,
#          "dependency_ids": []
#        },
#        {
#          "item_id": "q6",
#          "purpose": "设备状态与告警佐证",
#          "question": "查询燃烧器投退记录、火检状态、相关设备状态与异常告警，并与超温时段对齐",
#          "mandatory": true,
#          "dependency_ids": []
#        }

  - version: v2
    weight: 1.0
    description: 超温专项 v2 数据计划（20260602 四段式模板；q0～q7；SQL 参考 overheat_plan_v2_reference_sql.sql；建议 max_nl2sql_calls≥9）
    content: |
      [
        {
          "item_id": "q0",
          "purpose": "超温情况概览-机组超温事件时间包络",
          "question": "在用户指定时间窗内，按机组汇总有效超温事件（highest_temp>limit_temp），返回：机组名称、最早超温开始时间、最晚超温结束时间（分别取 MIN(start_time) 与 MAX(IFNULL(end_time,start_time))，格式 YYYY.MM.DD HH:MM:SS）。WHERE 时间窗与机组范围与 q1 一致。未指定机组时不 LIMIT 1。单条 SELECT，按机组名称排序，禁止 UNION。",
          "mandatory": true,
          "dependency_ids": []
        },
        {
          "item_id": "q1",
          "purpose": "超温情况概览-测点明细（按日表/周详情共用）",
          "question": "在用户指定时间窗内，按机组+受热面+测点聚合超温记录，返回：机组名称、区域名称（受热面+限温）、规格材质、测点编号、测点名称、最大/最小超温值（壁温℃）、最大连续超温时长（分钟）、超温日期、最大监测超温差值、异常等级（Ⅰ轻微/Ⅱ中度/Ⅲ严重/Ⅳ临界，按 delta≥5/10/20/40℃）。未指定机组时不 LIMIT 1，按机组名称排序。单条 SELECT，禁止 UNION。",
          "mandatory": true,
          "dependency_ids": []
        },
        {
          "item_id": "q2",
          "purpose": "超温情况概览-周区域概览",
          "question": "在用户指定周/月时间窗内，按机组+受热面汇总：区域名称、超温点数、周最大/最小超温值、周最大连续超温时长（分钟）、Ⅰ～Ⅳ级测点数量。未指定机组时不 LIMIT 1。单条 SELECT。",
          "mandatory": false,
          "dependency_ids": ["q1"]
        },
        {
          "item_id": "q3",
          "purpose": "超温情况概览-周趋势按日",
          "question": "在用户指定时间窗内，按机组+受热面+日期统计当日超温测点数，返回机组名称、受热面名称、超温日期、当日超温测点数。单条 SELECT。",
          "mandatory": false,
          "dependency_ids": ["q2"]
        },
        {
          "item_id": "q4",
          "purpose": "超温原因剖析-全事件运行工况",
          "question": "查询用户指定锅炉在用户指定时间窗内超温事件的全事件平均工况，按机组返回：机组名称、平均负荷（MW）、负荷百分比、平均主汽压力（MPa）。单条 SELECT 聚合。",
          "mandatory": true,
          "dependency_ids": []
        },
        {
          "item_id": "q5",
          "purpose": "超温原因剖析-SIS/DCS关联参数汇总",
          "question": "在用户指定时间窗内，按测点汇总 sis_pi_data 中六类 SIS/DCS 关联参数：减温水、烟温、排烟、总风量、氧量、炉膛负压（勿查壁温，壁温由 q1 承担；机组负荷、总给煤量分别由 q4/q7 承担，禁止纳入 q5）。须 sis_pi_data 聚合输出：禁止 correlated EXISTS、禁止 REGEXP、禁止 JOIN base_temp_point、禁止逐事件 CROSS JOIN。时间范围：monitor_hotarea_temp 有效超温事件（highest_temp>limit_temp）取 MIN(DATE_SUB(start_time,INTERVAL 30 MINUTE)) 至 MAX(DATE_ADD(IFNULL(end_time,start_time),INTERVAL 30 MINUTE)) 的单行子查询包络。允许 LEFT JOIN base_dev_pi_b ON pi_code=tag 取 pi_name_ch 作为测点名称与兜底筛选。排除壁温 tag：含 CT 且含 HAD/HAC/HAH 之一。纳入条件：tag 编码匹配六类之一（FW/CWF/DSW=减温水，FGT/FLUE=烟温，EXH/STACK=排烟，PAF/SAF/TAF=总风量，O2/OXY=氧量，DRFT/FURNP=炉膛负压），或 pi_name_ch 含减温水/炉膛烟温/烟温/排烟/炉膛负压，或 pi_name_ch 为炉膛出口氧量/总风量。用 CASE 输出参数类型（tag 优先、pi_name_ch 兜底），HAVING 排除其他关联参数；按参数类型+测点编码 GROUP BY，返回参数类型、测点编码、测点名称、采样点数、采样天数、最小/最大/平均值、首次/末次采样时间；禁止返回逐时刻明细行。按参数类型、采样点数降序排序。",
          "mandatory": false,
          "dependency_ids": ["q1"]
        },
        {
          "item_id": "q6",
          "purpose": "超温原因剖析-吹灰区域汇总（频次/时长）",
