# ************************************************************
# ②.3-2 综合分析 · 分阶段编排 . 检修策略专项（analysis_type=maintenance_strategy）
# ************************************************************
#
# 与 ②.3-1 相同：AnalysisGraphRunner 优先命中 *_maintenance_strategy，再回退通用 stage。
# 数据子任务见下方 analysis_plan_maintenance_strategy（表名与业务库清单对齐，由 NL2SQL 按 catalog 生成 SQL）。

analysis_intent_maintenance_strategy:
  - version: v1
    weight: 1.0
    description: 检修策略专项意图模板（输出 JSON，强调分级清单与方案影响分析边界）
    content: |
      你是「承压部件金属监督与检修策划」意图识别助手。请围绕用户问题提取可执行分析边界，严格输出可 JSON 化的要点（勿写长叙述），包含：
      1) 分析目标：风险与寿命评估、AI 分级检修优先级清单（1 级必检/2 级建议检/3 级可暂缓）、方案影响分析（优先处置 1 级 vs 全部暂缓的风险与成本）、大修窗口排程、暂缓检修后果等（可多选）；
      2) 空间与对象：锅炉（account_boiler）、受热面/设备/管排（account_static_device、account_device_piperow 等）、检测位置（overhaul_new_checklocation）；是否点名具体受热面（如高温过热器、水冷壁、省煤器）；
      3) 时间范围：默认若未写明则倾向「近一次检修周期至当前」或「近 90/180 天」，并写出用户显式时间窗（若有）；是否涉及「未来 N 个月内」风险预判；
      4) 输出期望：
         - 检修优先级判定：是否需拉取「统一检修优先级汇总」（按设备/管段自动分级，含 1/2/3 级及判定条件，如过热器剩余寿命阈值、水冷壁磨损、省煤器低风险等）；
         - 检修优先级清单格式：1 级必检（立即处置）/ 2 级建议检（大修处置）/ 3 级可暂缓（下次复检）；条目宜含受热面、数量（根/处）、判定条件；**优先与统一检修优先级汇总一致**，再用测厚/缺陷/超温/泄爆等佐证；
         - 方案影响分析：是否需量化「优先做 1 级」的爆管风险规避、检修成本，以及「全部暂缓」的风险上升与非计划停机影响（若用户未提则默认需要简要方案分析）；
         - 资源与窗口：人力/备件/停机/造价若用户提及则记录；
         - 数据域：统一检修优先级（分级清单）、测厚与换管、历史缺陷、超温、泄爆、时间轴、剩余寿命/风险模型（overhaul_thickness_rate 等）、检修策划等；
      5) 禁止输出与锅炉检修策略无关的泛化内容。

analysis_data_plan_maintenance_strategy:
  - version: v1
    weight: 1.0
    description: 检修策略专项数据计划 LLM 辅助模板（tasks JSON，与 analysis_plan_maintenance_strategy 含 q0 对齐）
    content: |
      你是「检修策略取数」规划助手。请在候选域内组织 tasks（顶层 JSON 数组 tasks），满足：
      - **一律以汇总/聚合 SQL 为主**（GROUP BY 设备/受热面/管段/检修优先级等级等），禁止拉取大篇幅明细流水；问句 purpose 宜与下列汇总名称一致或可直接映射；
      - 优先覆盖（与 analysis_plan_maintenance_strategy 对齐，可按 catalog 增删）：
        ⓪ **统一检修优先级汇总**（**优先、mandatory**）：基于设备名称（如过热器、水冷壁、省煤器）及检测数据（剩余寿命、缺陷类型/磨损程度、风险等级等），对受热面管段自动划分 1/2/3 级并输出统一分级清单及判定条件（示例口径：过热器剩余寿命＜6 个月→1 级，水冷壁磨损→2 级，省煤器低风险→3 级；具体阈值以 catalog 与用户问题为准）；
        ① **测厚与换管数据汇总**（overhaul_record、overhaul_record_tubes；最大减薄速率、最新壁厚、换管状态；剩余寿命/风险等级；按受热面统计管段数量）；
        ② **历史遗留问题（缺陷）汇总**（缺陷条数、现象、处置方法、原因分类、处理状态）；
        ③ **超温数据与运行参数关联汇总**（monitor_hotarea_temp 等）；
        ④ **泄爆数据汇总**（overhaul_leakage）；
        ⑤ **综合时间轴事件关联汇总**（超温、泄爆、换管合并时间轴，倒序）；
      - **q0 为分级主表**，q1～q5 为佐证；取数问句应使 q0 能直接支撑 synthesis 的 1/2/3 级清单，勿仅依赖 LLM 自行推断分级；
      - 检修成本、爆管风险比例一般无业务表，**不要**为此虚构取数任务；若用户追问成本可标注需外部造价数据；
      - mandatory 仅保留「无则无法输出 1 级必检或风险与寿命评估」的关键项；可选佐证（泄爆、时间轴）勿全部 mandatory；
      - dependency_ids 仅引用已出现 item_id，避免环；问句写明真实表名以便命中 catalog；
      - 输出仅为 JSON（顶层 tasks 数组），不要输出解释文本。

analysis_synthesis_maintenance_strategy:
  - version: v1
    weight: 1.0
    description: 检修策略专项合成（q0统一优先级为主 + 风险寿命 + 分级清单 + 方案影响分析）
    content: |
      你是电站锅炉「金属监督与检修策划」专家。请**仅**基于系统提供的检修策略查库汇总结果（与 analysis_plan_maintenance_strategy 六项数据计划一致，含 **统一检修优先级汇总**）及**知识库片段（RAG）**，输出可执行的检修决策（含 AI 生成的检修优先级清单与方案影响分析），不要写成超温分析式的长篇诊断报告。

      【输入与依据】
      你将接收经 NL2SQL 取回的下列六类汇总结果，以及可选的 RAG 知识片段。正文与附录**必须基于查库返回的全量行**（在上下文允许范围内），不得用臆造明细替代。正文引用数据依据时，**必须使用下列汇总名称**，不要使用 q0、q1 等内部编号：

      **【检修优先级判定主依据】**
      0. **统一检修优先级汇总**（**分级主表，优先采用**）：基于设备名称（如过热器、水冷壁、省煤器）及检测数据（剩余寿命、缺陷类型/磨损程度、风险等级等）对管段/位置的 **1/2/3 级检修优先级** 及**判定条件**（如「过热器剩余寿命＜6 个月→1 级」「水冷壁磨损→2 级」「省煤器低风险→3 级」等，以查库返回字段为准）。生成「2.1 检修优先级清单」时**须优先按本表归并、计数与表述**；本表与下列佐证表冲突时，以本表分级为准，并在条目中注明佐证差异。

      **【分级佐证与方案分析补充】**
      1. **测厚与换管数据汇总**：设备、管屏、管位置、减薄速率、最新壁厚、换管状态、剩余寿命/风险等级、管段数量等——用于校验 1 级寿命阈值、补充根数。
      2. **历史遗留问题（缺陷）汇总**：问题数量、现象、处置方法、原因分类、处理状态——用于校验 2 级磨损/缺陷类条目。
      3. **超温数据与运行参数关联汇总**：超温次数、时长、最高温、运行参数——用于解释升级至 1 级或维持 2 级的热工诱因。
      4. **泄爆数据汇总**：泄爆频次、时间、原因与处理——用于强化 1 级必检依据。
      5. **综合时间轴事件关联汇总**：超温、泄爆、换管事件时间轴——用于说明分级背后的时序关联。

      - **RAG**：补充判据口径、处置时机、方案影响分析的**定性**依据；**不得**用 RAG 覆盖「统一检修优先级汇总」中已有的本机组分级；不得将 RAG 示例数值、比例、成本当作本机组事实。
      - **判定逻辑**：① 有「统一检修优先级汇总」→ 按表输出 1/2/3 级清单并聚合根/处数；② 无 q0 或为空 → 方可综合「测厚与换管数据汇总」等佐证 + RAG 推断分级，并明确标注「未获取统一优先级汇总，以下为佐证推断」。

      【输出结构】按顺序输出 Markdown：

      ## 一、风险与寿命评估
      - **优先引用「统一检修优先级汇总」**：概括 1 级/2 级/3 级管段分布及主要判定条件（设备类型、寿命阈值、磨损/风险等级等）。
      - 用「测厚与换管数据汇总」「泄爆数据汇总」等**佐证**高风险区域；至少 2 条写明汇总名称 + 关键字段/数值。
      - 无统一优先级且无寿命/风险列时，说明「不足以做数值寿命与分级承诺」，禁止编造剩余月数与级别。

      ## 二、检修策略

      **2.1 检修优先级清单（AI 生成）**（**以「统一检修优先级汇总」为分级主依据**；RAG 仅作口径补充；默认给出三级）
      按下列标题分节；条目须能从主表对应到具体设备/区域，格式：**受热面/区域 + 数量（N 根 / N 处，由主表统计或佐证表核对）+ 判定条件**（引用主表中的分级规则或字段值）：
      - **1 级必检（立即处置）**：对应主表中 1 级管段/位置的归并条目（如「高温过热器 N 根剩余寿命＜6 个月管段」——N 与阈值须来自主表或「测厚与换管数据汇总」核对）。
      - **2 级建议检（大修处置）**：对应主表中 2 级（如「水冷壁 N 处磨损区域」——磨损程度须对应主表或「历史遗留问题（缺陷）汇总」字段）。
      - **3 级可暂缓（下次复检）**：对应主表中 3 级（如「省煤器低风险管段」——须对应主表风险/等级字段）。
      - 每条末尾注明**依据来源**：**首选「统一检修优先级汇总」**；若补充佐证，再写「测厚与换管数据汇总」等，格式如「（依据：统一检修优先级汇总·检修优先级=1级；佐证：泄爆数据汇总·频次 x）」；禁止臆造管号。

      **2.2 方案影响分析**（默认给出；聚焦「优先处置 1 级」与「1～2 级均暂缓」）
      - **优先处置 1 级项目**：结合主表中 1 级规模与「泄爆数据汇总」「综合时间轴事件关联汇总」等说明效益；风险比例**仅有模型/RAG/查库依据时可写**，否则定性；成本无字段则「待核算」。
      - **若 1～2 级均暂缓**：结合主表 2/3 级占比与佐证说明风险与时间窗；**无依据不得写精确风险提升比例**。
      - 可简述主表分级规则与用户问题的匹配情况（1～2 句）。

      【硬约束】
      - 禁止编造表名、字段、管段编号、未在查库中出现的级别/数量/阈值；禁止用示意表或假数据填表。
      - 正文与清单中**禁止出现 q0～q5**，统一使用六类汇总名称。
      - 有「统一检修优先级汇总」时，**不得**无视主表另写与主表矛盾的 1/2/3 级清单。
      - 爆管风险比例、成本金额：无查库或可追溯 RAG 判据时不得输出看似精确的百分数或金额。
      - 若「统一检修优先级汇总」为空且佐证亦不足以推断：输出「当前无统一检修优先级汇总及足够佐证，请检查分级模型数据或测厚/缺陷/寿命取数后重试。」

analysis_report_maintenance_strategy:
  - version: v1
    weight: 1.0
    description: 检修策略专项报告口径模板（与 synthesis 结构对齐）
    content: |
      请将检修策略输出组织为可拆解章节（与 synthesis 一致）：
      1) 风险与寿命评估（优先依据统一检修优先级汇总）
      2) 检修策略
         - 2.1 检修优先级清单（AI 生成）：以统一检修优先级汇总为主表；1 级必检（立即处置）/ 2 级建议检（大修处置）/ 3 级可暂缓（下次复检）
         - 2.2 方案影响分析：优先处置 1 级 vs 暂缓情形下的风险与成本（有数据可量化，无则定性）
      3) 附录（统一检修优先级、测厚与换管、历史遗留缺陷、超温与运行参数、泄爆、综合时间轴六类汇总表）
      全文中文；引用依据使用汇总名称而非 q0～q5；不与查库结果矛盾；无依据不写精确风险比例与造价金额。

# ************************************************************
# ②.3-3 综合分析 · 分阶段编排 . 四管健康报告智能解读（analysis_type=four_tube_health_interpretation）
# ************************************************************
#
# 目标：将系统已产出的四管健康指数、风险等级、剩余寿命等结构化结果，结合测厚/超温/缺陷等佐证数据，
# 生成为运行人员与检修班组可读的「运行简报」「检修建议书」类解读；支持用户指定篇幅、受众与侧重点。
# 与 ②.3-1 / ②.3-2 相同：Runner 优先命中本区 *_four_tube_health_interpretation，再回退通用 stage；取数见 analysis_plan_four_tube_health_interpretation。
# 说明：历次报告 AI 对比、Word/PDF 导出可后续单独建设；本专项 synthesis 可对「若用户携带两次评估时间窗」做趋势口径说明，无数据则明确不写对比结论。

analysis_intent_four_tube_health_interpretation:
  - version: v1
    weight: 1.0
    description: 四管健康解读意图（输出 JSON 要点：对象、产物形态、受众、篇幅）
    content: |
      你是「四管健康报告智能解读」意图识别助手。请从用户问题中提取可 JSON 化的要点（勿写长叙述），包含：
      1) 解读对象：锅炉/机组、受热面或管段范围（如高温过热器 B 侧若干排）、是否点名高风险清单；
      2) 产物形态：运行简报 / 检修建议书 / 二者都要 / 未指定（未指定则默认「简报摘要 + 检修要点」）；
      3) 受众与语气：运行值长、检修班组交底、金属监督专工、领导周阅等；是否要求「通俗」「少术语」「条目化」；
      4) 篇幅：简洁版（如周简报一页内）/ 标准 / 详细交底；
      5) 时间范围：评估批次时间、统计周期或「近一次评估」等用户显式窗；若用户问及与上次对比，写出可识别的两次时间锚点（若缺失则记为待补）；
      6) 输出重点：风险点排序、诱因（磨损/超温/腐蚀等）、剩余寿命含义说明、可执行巡检与检修动作；
      7) 禁止输出与锅炉四管健康解读无关的泛化内容。

analysis_data_plan_four_tube_health_interpretation:
  - version: v1
    weight: 1.0
    description: 四管健康解读取数计划 LLM 辅助（tasks JSON，与 YAML 模板合并）
    content: |
      你是「四管健康解读取数」规划助手。请输出顶层 JSON 数组 tasks，组织可执行 NL2SQL 子问题，满足：
      - 优先拉取「健康/风险/寿命」类业务结果（以 catalog 中真实表/视图为准，列名须来自清单），再拉测厚与缺陷、超温、泄爆履历、台账定位做佐证；
      - 任务可覆盖：评估结果表或等价视图 → overhaul_thickness_rate / overhaul_record / overhaul_record_tubes → monitor_hotarea_temp（可关联 base_temp_point、base_temp_device）→ overhaul_leakage → account_boiler、account_static_device、account_device_piperow → overhaul_boiler、overhaul_new_checklocation（检修窗口）；
      - mandatory 仅保留「无则无法解读风险分级或核心对象」的关键项；不要把全部佐证都设为 mandatory；
      - dependency_ids 仅引用已出现 item_id，避免环；问句中写明真实表名以便命中 catalog；
      - 输出仅为 JSON（顶层 tasks 数组），不要输出解释文本。

analysis_synthesis_four_tube_health_interpretation:
  - version: v1
    weight: 1.0
    description: 四管健康解读合成（运行简报 + 检修建议书口径，可随用户指令伸缩）
    content: |
      你扮演「四管健康状态解读与检修沟通」联合专家。仅基于系统给出的结构化查库结果（及知识片段）用中文输出 Markdown，禁止编造表名、字段或未出现的数值。

      【遵从用户指令】若用户明确要求只出「运行简报」或只出「检修建议书」，则仅输出对应一块；若要求二者或「未指定」，则按下文两块依次输出（简报可短、建议书可条文化）。

      【一、运行简报（面向运行）】
      - 用 1 段话给出本期整体健康指数（若有）、整体风险等级、高风险区域集中位置（管段/排号等以数据为准，无则写「待定位」）。
      - 用 3～6 条要点：突出风险管段数量、剩余寿命低于阈值的根数（仅当有数据）、主要诱因标签（如飞灰磨损、间歇性超温、腐蚀等）须与查库事实或明确推断依据对应。
      - 本周运行关注：巡检与壁温/工况控制建议（可执行、可观察指标）；无数据则列「待补数据项」。

      【二、检修建议书（面向检修班组）】
      - 分条列出：优先测厚复核点、建议立即更换或消缺项、可加装防磨护瓦或延期至下次小修项；每条尽量对齐数据中的设备/管段/位置标识与壁厚、缺陷、超温频次等关键量。
      - 无足够字段时列「待补数据项」，禁止臆造具体管号。

      【三、风险变化与趋势（仅当用户明确问及对比且数据中具备两次评估或可区分时间批次时）】
      - 简要对比风险等级或高风险管段数量变化，并给出「重点关注建议」；否则说明「当前结果不足以做历次对比」。

      【四、风险与限制】数据缺口、评估模型口径未知、样本不足等。

analysis_report_four_tube_health_interpretation:
  - version: v1
    weight: 1.0
    description: 四管健康解读报告章节口径（与 synthesis 对齐，供结构化拆解）
    content: |
      请将四管健康智能解读输出组织为可拆解章节（与 synthesis 对齐即可）：
      1) 运行简报
      2) 检修建议书
      3) 风险变化与趋势（若有可靠对比数据）
      4) 风险与限制
      全文中文，不与查库结果矛盾。


# ************************************************************
# ②.3-4 综合分析 · 分阶段编排 . 泄爆分析（analysis_type=leakage_burst_analysis）
# ************************************************************
#
# 目标：围绕锅炉受热面泄漏、爆管等泄爆类事件，结合履历、测厚、超温与台账数据做原因复盘与防控建议。
# 与 ②.3-1～②.3-3 相同：Runner 优先命中 *_leakage_burst_analysis，再回退通用 stage；取数见 analysis_plan_leakage_burst_analysis。

analysis_intent_leakage_burst_analysis:
  - version: v1
    weight: 1.0
    description: 泄爆专项意图模板（输出 JSON，强调事件/位置/时段与取数边界）
    content: |
      你是「锅炉受热面泄爆（泄漏/爆管）分析」意图识别助手。请严格围绕以下维度识别本次分析意图：
      1) 分析目标：事件复盘 / 原因定位 / 同类风险排查 / 处置与防控建议 / 趋势统计（可多选）；
      2) 空间对象：锅炉、机组、受热面分区、管段/排号、泄漏或爆管位置（若用户点名）；
      3) 时间范围：优先提取用户显式时间窗或「最近一次/近一年/近检修周期」等表述；
      4) 输出重点：事件事实清单、关键依据、可能原因与置信度、可执行建议、风险说明；
      5) 需引用的数据域（若可识别）：overhaul_leakage、overhaul_record/overhaul_record_tubes、overhaul_thickness_rate、monitor_hotarea_temp、account_boiler/account_static_device/account_device_piperow 等；
      6) 禁止输出与锅炉泄爆分析无关的泛化内容。输出须可转为结构化 JSON。

analysis_data_plan_leakage_burst_analysis:
  - version: v1
    weight: 1.0
    description: 泄爆专项数据计划 LLM 辅助模板（tasks JSON，与 YAML 模板合并）
    content: |
      你是「泄爆分析取数」规划助手。请将取数计划组织为可执行任务列表（顶层 JSON 数组 tasks），并满足：
      - 任务覆盖「泄爆/泄漏履历事实 → 同区域测厚与缺陷 → 超温与运行劣化佐证 → 台账定位」闭环；
      - 优先使用 catalog 中真实表名：overhaul_leakage、overhaul_record、overhaul_record_tubes、overhaul_thickness_rate、monitor_hotarea_temp（可关联 base_temp_point、base_temp_device）、account_boiler、account_static_device、account_device_piperow 等；
      - mandatory 任务优先保证泄爆履历与关键佐证，不要把全部可选项设为 mandatory；
      - dependency_ids 仅引用已出现 item_id，避免循环依赖；问句面向数据库可执行；
      - 输出仅为 JSON（顶层 tasks 数组），不要输出解释文本。

analysis_synthesis_leakage_burst_analysis:
  - version: v1
    weight: 1.0
    description: 泄爆专项结论模板（事实-归因-建议-风险，通用占位结构）
    content: |
      你是电站锅炉泄爆（泄漏/爆管）专项分析师。请基于系统给出的事实数据与知识片段，输出「可审计、可执行」的分析结论：

      【输出结构（按顺序）】
      一、结论摘要
      - 用 2～4 条说明：是否存在需关注的泄爆/泄漏模式、主要集中区域或受热面、影响程度与紧迫性。

      二、泄爆/泄漏事件与履历
      - 按时间或区域归纳 overhaul_leakage 等查库中的关键事件（时间、位置、原因或结论类字段以数据为准）；无记录须明确说明。

      三、关键依据
      - 逐条引用数据事实（时间窗、位置/管段、壁厚或缺陷、超温频次等）；区分「事实」与「推断」，推断须写明依据。

      四、可能原因与置信度
      - 至少给出 2 类原因（超温、磨损减薄、腐蚀、焊接/制造缺陷、运行工况扰动等）；每条标注高/中/低置信度及理由。

      五、处置与防控建议（可执行）
      - 按「立即 / 短期 / 持续跟踪」给出运行调整、扩检范围、测厚复核或检修窗口建议；含可观察指标或触发条件。

      六、风险与限制
      - 说明数据缺口、样本不足、未联上台账等限制，避免过度结论。

      【硬约束】禁止编造数值、字段、表名、设备状态；证据不足须明确「不足以支持」的结论。

analysis_report_leakage_burst_analysis:
  - version: v1
    weight: 1.0
    description: 泄爆专项报告口径模板（结构化报告描述）
    content: |
      请将泄爆分析报告组织为标准章节：
      1) 结论摘要
      2) 泄爆/泄漏事件与履历
      3) 关键依据
      4) 原因分析与置信度
      5) 处置与防控建议
      6) 风险与限制
      文本需便于结构化拆解，不要输出与章节无关内容。
      

# ---------------------------------------------------------------------
# ②.4 综合分析模块 · NL2SQL 数据计划 JSON（scene=analysis_plan_<analysis_type>）
# 当前通用综合分析，支持的专项分析类型：超温分析(overheat_guidance)、检修策略(maintenance_strategy)、四管健康报告智能解读(four_tube_health_interpretation)、泄爆分析(leakage_burst_analysis)，下面针对这几种场景分别单独配置模板
# 对应各个专项的NL2SQL数据计划的提示词模板的版本，目前没有实现配置化，默认使用下述的v1版本（若需要配置其他版本，把希望当前生效的版本命名为v1即可）
# ---------------------------------------------------------------------
#
# 【谁用】_build_data_plan_from_template：content 必须为 JSON 数组；每项字段建议：
#   - item_id（string，唯一）、purpose、question、mandatory（bool）、dependency_ids（string 数组，引用其他 item_id，若都是空没有引用，即实现4个q同时并行）
# 【优先级】相对 LLM plan 模板优先；无模板或 JSON 非法时回退代码内置默认任务再合并。
# 【扩展】新增分析类型时：增加 analysis_plan_<新 analysis_type> 顶级键，并在 API 模型 AnalysisType（app/models/analysis.py）中对齐。

# --- ②.4-1 综合分析模块 · NL2SQL 数据计划 . 超温分析   analysis_type=overheat_guidance ---
# 下面v2为原来模板，v1为最细模板
analysis_plan_overheat_guidance:
  - version: v1
    weight: 1.0
    description: 超温专项数据计划模板（JSON 数组，事实-参数-状态闭环）
    content: |
      [
        {
          "item_id": "q1",
          "purpose": "按【设备/受热面】汇总超温信息",
          "question": "统计各个锅炉受热面的超温汇总情况。需要展示锅炉名称、受热面名称，计算每个受热面的超温报警总次数、累计超时总秒数、平均最高温度以及历史极值，请按总超时秒数从大到小排序。",
          "mandatory": true,
          "dependency_ids": []
        },
        {
          "item_id": "q2",
          "purpose": "按【管排/位置】汇总超温信息",
          "question": "基于超温数据，按管排维度进行统计分析。需要查询出受热面名称、管排名称、规格材质、管径，并统计该管排的超温次数、该管排的历史最高温以及总超时长，结果请按超温次数降序排列。",
          "mandatory": true,
          "dependency_ids": []
        },
        {
          "item_id": "q3",
          "purpose": "按【严重程度】分组汇总超温信息",
          "question": "分析超温事件的严重等级分布。请根据最高温度减去限值的差值，将数据分为三个等级：轻微--差值小于等于 5℃；中度：差值大于 5℃ 且小于等于 10℃；严重：差值大于 10℃。统计每个受热面在各个等级下的发生次数、平均超时长以及关联的最大负荷(MW)，请按等级和次数排序",
          "mandatory": true,
          "dependency_ids": []
        },
        {
          "item_id": "q4",
          "purpose": "超温明细严重单点Top 20",
          "question": "找出超温最严重的前 20 条记录（Top 20）。需要展示锅炉名称、受热面名称、测点名称、最高温度、限值、超时秒数、触发时的负荷(MW) 以及设备描述的前 20 个字符，结果请按最高温度从高到低排序",
          "mandatory": true,
          "dependency_ids": []
        }
      ]

# 上述 q5、q6暂时注释掉
#        {
#          "item_id": "q5",
#          "purpose": "运行参数联动分析",
#          "question": "围绕超温时段查询风门开度、蒸汽流量、氧量、负荷等关键运行参数及其同时间窗变化",
#          "mandatory": true,
#          "dependency_ids": []
#        },
#        {
#          "item_id": "q6",
#          "purpose": "设备状态与告警佐证",
#          "question": "查询燃烧器投退记录、火检状态、相关设备状态与异常告警，并与超温时段对齐",
#          "mandatory": true,
#          "dependency_ids": []
#        }

  - version: v2
    weight: 1.0
    description: 超温专项 v2 数据计划（q1～q6 对齐九段报告；question 为业务意图问句，SQL 参考见 overheat_plan_v2_reference_sql.sql 及 nl2sql_qa_examples 闭环）
    content: |
      [
        {
          "item_id": "q1",
          "purpose": "一、报告基础信息（锅炉台账+超温测点分级统计）",
          "question": "查询用户指定锅炉/机组的基本台账，展示机组名称、锅炉型号、额定负荷（MW）。并统计用户指定时间窗内发生超温的测点总数，按各测点最大超温差值分级：严重超温（≥20℃）、中度超温（10～20℃）、轻微超温（5～10℃），分别输出各级测点数量。",
          "mandatory": true,
          "dependency_ids": []
        },
        {
          "item_id": "q2",
          "purpose": "二、超温事件概况（按测点汇总时段与工况）",
          "question": "统计用户指定锅炉在用户指定时间窗内各超温测点的事件概况。按测点汇总：测点编号与名称、所属受热面、管排位置（若有），各测点最早超温起始时间、最晚结束时间、累计超温时长（秒），期间平均机组负荷与平均主汽压力；以及各测点实测最高壁温、最大超温差值、设计允许壁温。按累计超温时长从长到短排序。",
          "mandatory": true,
          "dependency_ids": []
        },
        {
          "item_id": "q3",
          "purpose": "三、超温数据统计（区域汇总+尖峰频次）",
          "question": "对用户指定锅炉在用户指定时间窗内的超温数据进行量化统计。(1) 按超温区域/受热面汇总：各区域超温测点数量、最高/最低/平均壁温、平均超温差值、累计超温时长，按累计时长降序；(2) 按测点统计瞬时尖峰超温（单次温差≥15℃）的发生次数及累计时长，按尖峰次数降序。",
          "mandatory": true,
          "dependency_ids": []
        },
        {
          "item_id": "q4",
          "purpose": "三、关联参数联动（壁温时序）",
          "question": "查询用户指定锅炉在用户指定时间窗内超温事件的壁温时序明细。展示每条超温记录的采集/起始时间、测点编号与名称、实测最高壁温、限温值，以及对应时刻的机组负荷（MW）和主汽压力（MPa），按时间先后、测点编号排序。",
          "mandatory": true,
          "dependency_ids": []
        },
        {
          "item_id": "q5",
          "purpose": "七、历史缺陷/泄爆/换管记录",
          "question": "查询用户指定锅炉近一年内的检修与泄爆相关记录，包括：遗留问题（问题描述、处理措施、状态、涉及设备、记录时间）、泄漏/泄爆记录（泄漏描述、处置方法、原因类型、涉及设备、发生日期）、换管记录（缺陷类型、管段位置、涉及设备、标记时间）。按记录时间从新到旧排列。",
          "mandatory": true,
          "dependency_ids": []
        },
        {
          "item_id": "q6",
          "purpose": "九、附件（多测点对照+壁温明细）",
          "question": "查询用户指定锅炉在用户指定时间窗内超温测点的附件用明细。每条记录包含：测点编号与名称、所属受热面、采集/起始时间、实测最高壁温、限温值、超温差值、设计允许壁温、单次超温持续时长；按时间先后、测点编号排序。",
          "mandatory": true,
          "dependency_ids": []
        }
      ]

# --- ②.4-2 综合分析模块 · NL2SQL 数据计划 . 检修策略   analysis_type=maintenance_strategy ---
# 默认 6 条子任务（q0～q5）：q0 统一检修优先级汇总为分级主表；与 synthesis 输入/附录一一对应。
# 与常见部署 ANALYSIS_DEFAULT_MAX_NL2SQL_CALLS=6 对齐；若子任务超 6 需提高上限或 data_requirements_hint。启停机 monitor_boiler_start_stop、
# 吹灰 monitor_soot_blower_run_record 等，请通过 data_requirements_hint 追加或提高上限后扩展。

analysis_plan_maintenance_strategy:
  - version: v1
    weight: 1.0
    description: 检修策略数据计划模板（JSON 数组，q0 统一优先级 + q1～q5 佐证，与 synthesis 对齐）
    content: |
      [
        {
          "item_id": "q0",
          "purpose": "统一检修优先级汇总",
          "question": "请基于设备名称（过热器、水冷壁、省煤器）及检测数据（剩余寿命、缺陷类型），对所有受热面管段进行自动分级。要求：过热器剩余寿命<6个月为1级，水冷壁磨损为2级，省煤器为3级，并生成统一的检修优先级汇总清单。",
          "mandatory": true,
          "dependency_ids": []
        },
        {
          "item_id": "q1",
          "purpose": "测厚与换管数据汇总",
          "question": "请查询最近3年内所有受热面的缺陷检测记录，按设备和位置分组汇总。仅展示所属设备、管屏号、管位置、规格材质、原始参数、最大减薄速率、最新壁厚测量值以及是否已换管的状态。注意：请直接返回基础检测数据，严禁添加任何关于检修优先级（如1级必检、2级建议检等）的 CASE WHEN 判别逻辑，也不要关联锅炉基础信息表。",
          "mandatory": true,
          "dependency_ids": []
        },
        {
          "item_id": "q2",
          "purpose": "历史遗留问题（缺陷）汇总",
          "question": "请按锅炉、受热面设备及具体位置（排/管）汇总最近3年内的历史遗留缺陷数据，统计各位置的问题数量，并聚合并展示问题的现象描述与处置维修方法的汇总信息，同时显示问题的原因分类和当前处理状态。",
          "mandatory": true,
          "dependency_ids": []
        },
        {
          "item_id": "q3",
          "purpose": "超温数据与运行参数关联汇总",
          "question": "请汇总最近3年内锅炉壁温超限事件，关联显示测点所在的锅炉、受热面区域、管排及集箱信息，并统计该测点的超温次数、平均超时时长及历史最高温度，同时提取超温期间的平均负荷与主汽压力运行参数。",
          "mandatory": true,
          "dependency_ids": []
        },
        {
          "item_id": "q4",
          "purpose": "泄爆数据汇总",
          "question": "请按锅炉和设备位置汇总最近3年内的泄爆记录，统计各管排/管号的泄爆频次，展示首次与最近的泄爆时间，并聚合并展示泄爆原因描述与处理方法的汇总信息，以便分析高频故障点。",
          "mandatory": false,
          "dependency_ids": ["q3"]
        },
        {
          "item_id": "q5",
          "purpose": "综合时间轴事件关联汇总 (核心关联)",
          "question": "请生成一个最近5年的设备异常综合统计视图，将超温、泄爆和换管事件合并，并按“发生日期、锅炉名称、所属区域”进行分组汇总，统计每天每个区域内这三类事件各自发生的次数以及总事件数。",
          "mandatory": false,
          "dependency_ids": []
        }
      ]

# --- ②.4-3 综合分析模块 · NL2SQL 数据计划 . 四管健康解读   analysis_type=four_tube_health_interpretation ---
# 与常见 ANALYSIS_DEFAULT_MAX_NL2SQL_CALLS=6 对齐；健康指数/风险/寿命以 catalog 中业务结果表为准（名称可能是视图或专题表）。
analysis_plan_four_tube_health_interpretation:
  - version: v1
    weight: 1.0
    description: 四管健康解读数据计划（JSON 数组：评估结果 + 金属监督 + 超温 + 泄爆 + 台账 + 检修窗口）
    content: |
      [
        {
          "item_id": "q1",
          "purpose": "四管健康评估与风险结果",
          "question": "在 catalog 中查找存放四管或受热面「健康指数/评分」「风险等级」「剩余寿命或寿命区间」「评估时间」及对象定位字段（炉号、受热面、侧别、排管号等）的业务表或视图；按用户问题中的机组/锅炉与时间窗筛选（无则不做具体锅炉名臆测），列出当前批次关键结论行，按风险等级或健康指数排序并限制合理行数。禁止臆造表名，仅用清单中存在的对象。",
          "mandatory": true,
          "dependency_ids": []
        },
        {
