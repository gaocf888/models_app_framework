# 1.2 检修策略 · analysis_type=maintenance_strategy（q0～q6，q0 为统一检修优先级主表）
analysis_agent_plan_maintenance_strategy:
  - version: analysis_agent_v1
    weight: 1.0
    description: 检修策略数据计划 analysis_agent_v1（q0 统一优先级 + q1～q6 佐证）
    content: |
      [
        {
          "item_id": "q0",
          "purpose": "统一检修优先级汇总",
          "question": "请优先查询 catalog 中寿命/风险评估结果表或视图（若有：含风险等级、剩余寿命区间）；否则使用 overhaul_thickness_rate 与 overhaul_record。生成**按检修优先级+所属设备聚合的汇总表**（禁止仅返回零散明细）：①1级必检：device_name 含「高温过热器」（或同级高温过热面）且剩余寿命<6个月，统计**根数**；②2级建议检：device_name 含「水冷壁」且**轻微磨损**（defect_type=磨损且 mark_area 较小或描述/备注含「轻微」），按检测位置（device+管屏+检测位置）统计**处数**；③3级可暂缓：device_name 含「省煤器」且**低风险**（剩余寿命≥12个月、减薄速率低、同位置无磨损缺陷）。输出：锅炉名称、所属设备、检修优先级、数量、数量单位（根/处）、判定条件。",
          "mandatory": true,
          "dependency_ids": []
        },
        {
          "item_id": "q1",
          "purpose": "测厚与换管数据汇总",
          "question": "请查询近1年（或用户指定检修周期）内受热面检测记录：overhaul_record（mark_type 测厚1与缺陷2）关联 overhaul_record_tubes、overhaul_thickness_rate，按设备和管段位置分组汇总。展示所属设备、管屏号、管位置、规格材质、原始参数、最大减薄速率、最新壁厚测量值、剩余寿命_月、是否已换管、本组管段数量。严禁添加检修优先级 CASE WHEN，不要 JOIN account_boiler 展示锅炉字段（可用 boiler_id 子查询过滤机组）。",
          "mandatory": true,
          "dependency_ids": []
        },
        {
