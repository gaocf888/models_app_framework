# -----------------------------------------------------------------------------
# 3. 报告规格（在configs/analysis_agent_reports路径配置，此处仅字段说明）
#
# 【文件路径】configs/analysis_agent_reports/{analysis_type}.analysis_agent.json（兜底）
#             或 {analysis_type}.{ANALYSIS_AGENT_PLAN_TEMPLATE_VERSION}.json
#   analysis_type：overheat_guidance | maintenance_strategy |
#                   four_tube_health_interpretation | leakage_burst_analysis
# 【加载】app/analysis_agent/report_spec.py → load_report_spec()
#         app/analysis_agent/context_loader.py → load_analysis_run_context()
# 【与 yaml 分工】
#   - 本 JSON：报告章节结构、取数绑定（source_item_ids）、每章合成蓝图
#   - analysis_agent_plan_*（上文 §1）：NL2SQL 问句清单（report 未内嵌 plan 时回退）
#   - analysis_agent_synthesis_*（上文 §2）：LLM system（角色与全局硬约束）
#
# 【根对象字段】
#   schema_version  int     规格版本号，当前为 2
#   title           string  报告标题（meta / trace）
#   description     string  维护说明，可选
#   plan            object  可选；内嵌 NL2SQL 数据计划时使用
#     plan.items[]  array   与 analysis_agent_plan_* 中 JSON 数组元素同结构：
#                           item_id, question, purpose, mandatory, dependency_ids
#   plan_items      array   plan.items 的简写别名（与 plan.items 二选一）
#   chapters        array   必填；按顺序执行的章节列表（旧字段名 slots 仍兼容）
#
# 【chapters[] 公共字段】
#   id              string  章节唯一 ID（trace、SSE、structured_report 索引）
#   kind            string  章节类型，见下表
#   title           string  章节展示标题（SSE slot_start；勿让 LLM 再输出 # 标题行）
#
# 【kind 取值与用途】
#   static_markdown   固定 Markdown，不经 LLM；常用作报告主标题
#   llm_section       当前主推：ReAct/LLM 按章合成，user prompt 来自本章蓝图字段
#   llm_narrative     兼容旧名，行为同 llm_section
#   table_deterministic / chart_structured / template_deterministic
#                     已废弃，运行时输出占位提示；请改用 llm_section + emit 工具
#
# 【kind=static_markdown 专用】
#   static_body     string  直接推送的 Markdown 正文（如 "# 报告名\n\n"）
#
# 【kind=llm_section 常用字段】
#   source_item_ids   string[]  绑定的数据计划 item_id（如 q1、q2a）；
#                               本章 NL2SQL 只取这些 id；须在 plan 中存在
#   outline           string[]  本章结构要点 → 注入 user prompt【本章结构 outline】
#   constraints       string[]  本章硬约束 → 注入 user prompt【硬约束 constraints】
#   field_hints       object   业务名→数据说明映射（key=汇总名称，value=hint）；
#                               注入【字段说明 field_hints】，正文禁止写 q 编号
#   narrative_instruction string 本章写作任务 → 注入【本章写作任务】
#   allowed_outputs   string[]  允许呈现形式，影响 emit 工具提示：
#                               paragraph | table | bar_chart | pie_chart
#   use_emit_tools    bool     true 时启用 emit_markdown_table / emit_chart（默认
#                               llm_section 或有 allowed_outputs 时为 true）
#   allow_human_confirm bool   mandatory 取数失败且重试用尽时，是否允许 HITL interrupt
#   stream_live       bool     true 时本章合成优先流式推送（orchestrator 标记）
#   max_nl2sql_retries int     本章取数失败重试次数，默认 2
#   max_synthesize_retries int 合成失败重试，默认 1
#
# 【kind=llm_section 少用 / 遗留字段】
#   table_id, template_id, table_kind, chart_when_table, mandatory_data
#                               旧确定性渲染遗留，当前 llm_section 流程可忽略
#
# 【校验规则】（load_analysis_run_context validate_plan_refs=true）
#   - chapters 非空
#   - 每章 source_item_ids 中的 id 必须存在于 plan（report 内嵌或 plan_* 回退）
#
# 【示例文件】
#   overheat_guidance.analysis_agent.json          9 章（1 static + 8 llm_section）
#   maintenance_strategy.analysis_agent.json       3 章
#   four_tube_health_interpretation.analysis_agent.json
#   leakage_burst_analysis.analysis_agent.json
# -----------------------------------------------------------------------------

