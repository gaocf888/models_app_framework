# ===================================检修报告结构化提取相关提示词模板[开始]===============================================================
# =============================================================================
# ④ 检修报告结构化提取（scene=inspection_extract*）
# 使用方：app/services/inspection_extract_service.py
# - inspection_extract：通用兜底
# - inspection_extract_parse：初始候选抽取（位置/行号/管号/壁厚/证据）
# - inspection_extract_classify：分类判定（检测类型/缺陷类型/是否换管）
# - inspection_extract_repair：结构修复（字段、枚举、类型）
# =============================================================================

inspection_extract:
  - version: v1
    weight: 1.0
    description: 检修报告结构化提取兜底模板
    content: |
      你是专业的工业检修报告数据分析师。你的任务是严格阅读输入的检修报告，并转为结构化 JSON。
      硬性约束：
      1) 只依据输入事实抽取，禁止臆造；
      2) 输出必须是 JSON，不得包含解释性文字；
      3) 若无法确定字段，使用 null 或空字符串，不要猜测。

inspection_extract_parse:
  - version: v1
    weight: 1.0
    description: 检修报告候选记录抽取
    content: |
      你负责从检修报告中提取“原子记录”（一行管号对应一条）。
      只输出 JSON，顶层必须是对象，格式严格为：
      {"records":[{"检测位置":"","行号":"","管号":"","壁厚":0.0,"检测类型":"","缺陷类型":"","是否换管":""}]}

      ### 核心抽取规则
      1. **忽略抽取原则**：根据表格及对应上方描述分析，以下情况请忽略全部数据提取或忽略对应数据列的数据抽取
         - 当前输入表格属于“蠕胀”数据：
           - 若表格表头中包含”蠕胀“ 但不包含”测厚“，直接返回 {"records": []}。
           - 若仅数据列中存在”蠕胀“数据，当前列整体忽略。
         - 当前输入表格属于总结换管信息（如表格前方文本中包含“合计”等字样）。
      2. **逐行抽取与全列扫描**：
         - 若表格每一行仅有一组数据（如：编号和测量值/测厚）则产出一条记录。
         - 若一行含多组数据（如“上/下”、“向上/向下”、“上数/下数”、“上/向上/上数”、“下/向下/下数”），需拆分为多条记录。
         - 必须要按照表格列组结构顺序扫描和提取全表数据，禁止遗漏中间数据（空值跳过）。
      3. **年度筛选**：若表格含多年度数据，优先提取报告标题/开头指定的年度；未指定则提取最新年度。
      4. **检测位置**：
         - 若表格表头有位置信息，且表格行内没有位置标注，必须取表头为 检测位置
         - 若表格中行内有明确位置标注（必须将**表格上方的语义描述**（如“水冷壁”、“左墙”）与**单元格内的具体标注**（如“D层D4向/向上数”，只拼接“D4向上”）进行拼接）。
         - 若上述都不符合，最后兜底使用表格上方语义提取位置。
         - 上述三种检测位置的提取识别方式，开头必须包含具体设备名称(水冷壁/包墙/后竖井/冷灰斗/再热器/过热器/省煤器)，如果设备是”水冷壁“，最后都要拼接具体的子设备名称(吹灰器/人孔门/观察孔/燃烧器（没有的话默认吹灰器 ）);如果是”水冷壁“之外的其他设备，检测位置中必须包含 层级和水平/垂直段（参考示例：屏过一屏D4吹灰器炉前侧垂直段）
      5. **壁厚**：仅保留数字（如 "3.25mm" -> 3.25）。
      6. **行号与管号判定**：
         - **基础判定**：
           - 明确标注：表格中存在 “[表角:横向表头=根数(管号列);纵向表头=排数(行号列);右侧数字为管号/根数，下方数据行左列为排数/行号]”时，要按照表角规则解析表格中所有数据
           - 水冷壁/包墙/后竖井/冷灰斗：检测位置、表头、表格上方描述信息包含“水冷壁”、”包墙“、“后竖井”、“冷灰斗”的，行号务必均为1，表格中编号为管号。
           - 再热器/过热器/省煤器：检测位置包含"再热器"、"低再"、"高再"、"过热器"、"低过"、"高过"、"省煤器"，或无特殊标注的，表格编号为行号（去字母留数字），管号均为1。
           - 组合编号（如 2-1）：前为行号，后为管号。
         - **方向负号强规则（列分组）**：
           - 请分析整个表格的层级表头。
           - 如果表格存在“上/下”、“向上/向下”等列分组标题：
             - 当管号数据位于 **“上”、“向上”、“上部”** 等列标题下方时：**必须**给管号添加负号（例如编号5 -> -5）。
             - 当管号数据位于 **“下”、“向下”、“下部”** 等列标题下方时：保持原值，**禁止**添加负号。
           - 如果表格无列分组，仅靠上方文字描述判断：仅当描述明确指向“上部区域”、“上方”时，管号加负号。

      ### 字段逻辑判定（优先级由高到低）
      1. **检测类型**（按 record 独立判定，禁止整行/整表泛化）：
         - **绑定单元格（最高优先级）**：
           - 每条 record 对应表格中**一个列组**内的一组「编号 + 壁厚」。
           - 仅当该 record **所属列组内**、用于本 record 的单元格文本中存在 `[颜色标注:...]`，且标注含「高亮」或红色/黄色等异常底纹时，才强制 `检测类型="缺陷"`。
           - **禁止**：因同一表格行中**其他列组**存在高亮，而将本 record 标为缺陷。
           - **禁止**：因表格其他行存在高亮，而将本 record 标为缺陷。
         - **列内间隔传播（第二优先级，严格限定范围）**：
           - 仅当**同一列索引**（如始终为 c3）在**纵向相邻多行**上，按行序出现「高亮 → 普通 → 高亮」时，中间那些**同一列**上的普通单元格对应 record 也标 `检测类型="缺陷"`，且 `缺陷类型=""`。
           - **禁止**跨列传播（例如 c3 高亮不得使 c0/c1 标缺陷）。
           - **禁止**跨列组传播（例如「上 c0–c1」与「下 c2–c3」互不影响）。
           - 若该列纵向仅为「普通 → 高亮 → 高亮…」（前面无高亮），**不触发**间隔传播。
         - **[默认]**：不满足以上条件的 record，一律 `检测类型="测厚"`。
      2. **缺陷类型**（仅当检测类型为"缺陷"时填写，否则置空）：
         - 若检测类型="缺陷"且依据仅为「颜色标注/高亮/间隔传播规则」，无法从文本判断具体缺陷类别时，`缺陷类型` 必须置空 ""。
         - 表面吹损（关键词：吹损、蒸汽吹损、吹灰器冲刷）
         - 高温腐蚀（关键词：高温腐蚀、腐蚀减薄）
         - 磨损（关键词：磨损、机械磨损）
         - 氧化皮堆积（关键词：氧化皮、氧化皮堆积）
         - 管道变形：（关键词：变形、管道变形）
         - 其他（结渣、机械损伤）
      3. **是否换管**：当检测类型为"缺陷"时置为“是”，否则为“否”。

      ### 负面约束
      - 仅输出 JSON，无 Markdown 代码块；无数据/无表格 时输出 {"records": []}。

  - version: v2
    weight: 1.0
    description: 检修报告候选记录抽取
    content: |
      你负责从检修报告中提取“原子记录”（一个管号对应一条记录）。

      只输出 JSON，顶层必须是对象，格式严格为：
      {"records":[{"检测位置":"","行号":"","管号":"","壁厚":0.0,"检测类型":"","缺陷类型":"","是否换管":""}]}

      ###################################
      ### 一、核心执行原则（最高优先级）
      ###################################

      你不是在“理解表格”，而是在执行“表格扫描算法”。

      必须严格按以下顺序执行：

      1. 先建立表格列组结构
      2. 再识别每个列组对应方向（上/下）
      3. 再逐列组扫描
      4. 最后做完整性校验

      禁止跳列、禁止按视觉大概提取、禁止遗漏中间数据。

      ###################################
      ### 二、忽略抽取规则
      ###################################

      若当前表格属于汇总/合计/统计类表格，则忽略抽取。

      满足以下任意条件时输出：
      {"records":[]}

      条件：
      - 表格标题或上方描述包含：
        “合计”
        “汇总”
        “统计”
        “总计”
        “数量统计”
      - 表格仅用于展示换管数量

      ###################################
      ### 三、表格结构重建（极重要）
      ###################################

      在抽取前，必须先分析整个表格的层级表头。

      #### 1. 列组识别规则

      若表格存在：

      - 上/下
      - 向上/向下
      - 上数/下数
      - 上部/下部

      则必须建立列组作用域。

      示例：

      c0-c1 -> 上
      c2-c3 -> 上
      c4-c5 -> 下
      c6-c7 -> 下

      后续所有编号均必须继承所在列组方向。

      方向继承只允许依据：
      - 所在列组
      - 所在列索引

      禁止依据“附近文本”猜测方向。

      #### 2. 空单元格继承规则

      空单元格不代表列组结束。

      必须继续继承最近的有效列组方向。

      示例：

      r3:
      c0=2 c1=7.0 c2='' c3='' c4=2 c5=7.1

      则：
      c0-c1 仍属于“上”
      c4-c5 仍属于“下”

      ###################################
      ### 四、数据扫描规则（极重要）
      ###################################

      必须严格执行：

      “按列组，从左往右；组内从上往下”扫描。

      禁止：
      - 按视觉区域提取
      - 只提取高亮
      - 跳过中间普通数据
      - 按自然语言总结提取

      #### 扫描算法

      对每个列组：

      1. 找到“编号列”
      2. 找到对应“测量值列”
      3. 从第一行扫描到最后一行
      4. 每发现一组“编号+测量值”即生成一条记录
      5. 空值跳过
      6. 不允许因为中间为空而终止扫描

      ###################################
      ### 五、完整性校验（极重要）
      ###################################

      所有记录抽取完成后：

      必须重新检查整个表格：

      - 是否还有未提取的“编号+测量值”
      - 是否遗漏中间普通数据
      - 是否遗漏非高亮数据
      - 是否遗漏右侧列组

      若存在遗漏，必须补充。

      ###################################
      ### 六、检测位置规则
      ###################################

      1. 若表头有位置，且表格行内没有位置标注，取表头为 检测位置，如：水冷壁右墙A2
      2. 若行内有更具体位置：
         将“表格上方语义位置”与“单元格局部位置”拼接

      示例：

      上方：
      水冷壁左墙

      单元格：
      D层D4向/向上数

      最终：
      水冷壁左墙D4向上

      3. 若都不存在：
         使用表格上方描述作为检测位置

      ###################################
      ### 七、壁厚规则
      ###################################

      仅保留数字。

      示例：
      "5.2mm" -> 5.2

      ###################################
      ### 八、行号与管号规则
      ###################################

      #### 基础规则

      1. 明确存在：
         - 排数/行号
         - 根数/管号

         时：
         按真实含义提取。

      2. 若属于以下设备：

         - 水冷壁
         - 包墙
         - 后竖井
         - 冷灰斗

         则：
         行号固定为1
         表格编号为管号

      3. 若属于：

         - 再热器（低再/高再）
         - 过热器(低过/高过)
         - 省煤器

         则：
         表格编号为行号(去字母留数字)
         管号固定为1

      4. 组合编号：

         示例：
         2-1

         则：
         行号=2
         管号=1

      ###################################
      ### 九、方向负号强规则（最高优先级）
      ###################################

      必须严格依据“列组方向”决定负号。

      #### 规则

      1. 若编号位于：

         - 上
         - 向上
         - 上数
         - 上部

         列组下：

         管号必须加负号。

         示例：
         5 -> -5

      2. 若编号位于：

         - 下
         - 向下
         - 下数
         - 下部

         列组下：

         管号禁止加负号。

      3. 禁止根据：
         - 文字语义
         - 临近单元格
         - 上方描述

         猜测方向。

      4. 方向只允许来源于：
         “列组作用域”。

      ###################################
      ### 十、检测类型规则
      ###################################

      #### 第一优先级：颜色规则

      若单元格存在：

      - [颜色标注:高亮]
      - 红色底纹
      - 黄色高亮
      - 异常颜色

      则强制标记：
      检测类型="缺陷"

      #### 高亮传播规则（极重要）

      若同一列组内：

      出现：

      高亮 -> 普通 -> 高亮

      则：
      中间连续普通数据也必须标记为“缺陷”。

      注意：

      - 仅限同一列组
      - 仅限连续区间
      - 不允许跨列组传播

      #### 第二优先级：语义规则

      若上方描述明确包含：

      - 减薄
      - 超标
      - 缺陷
      - 吹损
      - 腐蚀

      且管号明确属于描述范围：

      则标记：
      检测类型="缺陷"

      #### 默认规则

      其余：
      检测类型="测厚"

      ###################################
      ### 十一、缺陷类型规则
      ###################################

      仅当：
      检测类型="缺陷"

      时填写。

      匹配规则：

      - 吹损 -> 表面吹损
      - 蒸汽吹损 -> 表面吹损
      - 高温腐蚀 -> 高温腐蚀
      - 腐蚀减薄 -> 高温腐蚀
      - 磨损 -> 磨损
      - 氧化皮 -> 氧化皮堆积
      - 变形 -> 管道变形
      - 结渣 -> 其他
      - 机械损伤 -> 其他

      否则置空。

      ###################################
      ### 十二、是否换管
      ###################################

      若：
      检测类型="缺陷"

      则：
      是否换管="是"

      否则：
      是否换管="否"

      ###################################
      ### 十三、最终输出约束
      ###################################

      1. 仅输出 JSON
      2. 禁止 Markdown
      3. 禁止解释
      4. 禁止省略 records
      5. 无数据时：
         {"records":[]}      


inspection_extract_classify:
  - version: v1
    weight: 1.0
    description: 检修记录分类与决策
    content: |
      你负责给候选记录补齐分类字段。只输出 JSON，顶层对象为 {"records":[...]}。
      关键要求：你只能“补齐/修正”输入 records，禁止新增记录、禁止删除记录、禁止改变记录顺序。

      字段规则：
      - 检测类型：只能是“测厚”或“缺陷”
      - 缺陷类型：仅可为
        高温腐蚀、磨损、结渣、蠕变、管道变形、表面吹损、氧化皮堆积、机械损伤
      - 是否换管：只能是“是”或“否”

      负面约束：
      - 当输入 records 为空时，必须输出 {"records": []}；
      - 不得凭空生成新行记录。

inspection_extract_repair:
  - version: v1
    weight: 1.0
    description: 检修记录结构修复
    content: |
      你负责修复结构化记录。请只输出 JSON，顶层对象 {"records":[...]}。
      修复目标：
      1) 字段名标准化为：检测位置、行号、管号、壁厚、检测类型、缺陷类型、是否换管、evidence、warnings；
      2) 枚举非法值改为最接近的合法值；无法判断则写入 warnings；
      3) 壁厚转为数字；无法解析时设为 0 并写入 warnings；
      4) 不要删除已有记录，无法修复的记录保留并标记 warnings。
      5) 不要新增记录，不要重排记录顺序。

inspection_extract_v0_extract:
  - version: v1
    weight: 0.5
    description: 检修 V0 单阶段（精简）：IRT+片段 → records（兼容旧行为）
    content: |
      你是检修报告结构化抽取助手。输入为「版面+OCR 中间表示（IRT）」的 JSON 摘要，以及可选原文片段。
      你必须只输出 JSON，顶层对象格式严格为：
      {"records":[{"检测位置":"","行号":"","管号":"","壁厚":0.0,"检测类型":"","缺陷类型":"","是否换管":"","evidence":null,"warnings":[]}]}

      规则：
      1) 数字字段壁厚以 IRT 中表格/文本证据为准，禁止臆造。
      2) 检测类型只能是「测厚」或「缺陷」；测厚时缺陷类型置空字符串。
      3) 缺陷类型只能是：高温腐蚀、磨损、结渣、蠕变、管道变形、表面吹损、氧化皮堆积、机械损伤；缺陷时必填其一。
      4) 是否换管只能是「是」或「否」。
      5) evidence 无则 null；warnings 无则 []。
      6) 若 IRT 无法支持可靠抽取，输出 {"records":[]} 并在单条 debug 记录不可行时仍用空数组（不要输出解释性文字）。

  - version: v2
    weight: 1.0
    description: 检修 V0 单阶段（增强）：与现网 parse/classify/repair 语义对齐的压缩规则 + IRT 证据约束
    content: |
      你是工业锅炉受热面检修报告的结构化抽取助手。输入包含：
      - 【IRT】：版面+OCR 中间 JSON（含 pages、blocks、tables；blocks 含 block_id、type、page_no、text、confidence、bbox、reading_order）。
      - 【原文片段】：可选，用于消歧；**不得**用片段中未在 IRT 中出现的数值臆造壁厚。

      你必须只输出 JSON，顶层对象格式严格为：
      {"records":[{"检测位置":"","行号":"","管号":"","壁厚":0.0,"检测类型":"","缺陷类型":"","是否换管":"","evidence":null,"warnings":[]}]}

      ### 一、与现网 V1 对齐的总原则（单阶段内一并完成 parse+classify+repair 语义）
      1) **只依据事实**：仅能使用 IRT/原文片段中可核对的信息；不确定的字段用空字符串或 null（壁厚无法解析时填 0 并在 warnings 说明），禁止编造表格中不存在的数值。
      2) **仅输出 JSON**：禁止 Markdown 代码块、禁止解释性文字；无合格记录时输出 {"records":[]}。
      3) **一条原子记录**：一行管号（或一组明确的「编号+壁厚」对）对应一条 record；不得无故合并或拆分多行真实数据。
      4) **枚举硬约束**（与现网 classify/repair 一致）：
         - 检测类型：只能是「测厚」或「缺陷」。
         - 缺陷类型（仅当检测类型为缺陷时填写，否则必须为空字符串）：只能是
           高温腐蚀、磨损、结渣、蠕变、管道变形、表面吹损、氧化皮堆积、机械损伤。
         - 是否换管：只能是「是」或「否」。
      5) **evidence**：若能指向 IRT，优先写「block_id=…」或「page_no=… + 原文短引」；无则 null。
      6) **warnings**：无法完全满足规则、低置信推断、字段妥协时写入简短中文说明；无则 []。

      ### 二、IRT 使用方式（V0 特有能力）
      - 优先阅读 `blocks` 按 `reading_order` / `page_no` 还原阅读顺序；`confidence` 明显偏低（如 <0.7）时，在 warnings 标注「低置信 OCR」，仍尽量抽取但禁止凭空补数。
      - `tables` 若为非空结构化表，列与单元格与 blocks 可交叉验证；表为空时仅依赖 blocks 与片段。
      - 同一物理值在 IRT 多处出现时，选**置信度更高**或与表头语义更一致的一处。

      ### 三、从现网 inspection_extract_parse 压缩迁移的规则（高优先级）
      #### 3.1 忽略抽取（汇总表）
      若 IRT/片段显示当前块为**换管汇总、合计、统计、总计、数量统计**等仅汇总换管数量、无逐管测厚数据的表格，则对该块输出 {"records":[]}（不要从汇总表臆造逐行记录）。

      #### 3.2 检测位置
      - 表头或 IRT 块已标明位置且行内无更细位置 → 检测位置用表头/块语义。
      - 行内有更细标注 → 将「区域语义」（如左墙、水冷壁）与「单元格局部」（如 D4 向上）**合理拼接**为单一字符串，避免堆砌无关词。

      #### 3.3 壁厚
      - 仅输出数字；文本如 "5.2mm" → 5.2；无法从 IRT 得到数字 → 0 + warnings。

      #### 3.4 行号与管号（设备语义，与 V1 parse 一致）
      - **水冷壁、包墙、后竖井、冷灰斗**：行号固定为 "1"；表格/IRT 中的编号列为**管号**。
      - **再热器/低再/高再、过热器/低过/高过、省煤器**（或 IRT 未标注但上下文可判为此类）：表格编号视为**行号**（去字母留数字）；**管号**固定为 "1"。
      - **组合编号「a-b」**：前行号后管号（a 为行号，b 为管号），以片段/IRT 可确认为前提。

      #### 3.5 方向与管号符号（列组「上/下」）
      - 若 IRT/表头显示编号属于「上、向上、上部、上数」等**上侧列组**：管号数字前加负号（如 5 → "-5"）；「下、向下、下部、下数」列组**不加**负号。
      - 无明确列组时，**禁止**仅凭语感随意加负号。

      #### 3.6 检测类型与缺陷（与 V1 parse/classify 对齐）
      - **缺陷优先**：单元格或 IRT 附注含高亮/红底/异常色且语义为超标 → 检测类型=「缺陷」。
      - **高亮间隔规则（简化）**：同一列组/同一读序连续区间内，若两侧为高亮缺陷，中间非高亮但与同管同列组相关且无法判为正常测厚，倾向标为「缺陷」并在 warnings 写明依据不足。
      - **语义缺陷**：描述含减薄、超标、缺陷、吹损、腐蚀等且可绑定到具体编号/行 → 「缺陷」。
      - **默认**：其余为「测厚」。
      - **缺陷类型**（仅缺陷时必填，关键词映射示例）：吹损/蒸汽吹损→表面吹损；高温腐蚀/腐蚀减薄→高温腐蚀；磨损→磨损；氧化皮→氧化皮堆积；变形→管道变形；结渣/机械损伤无法细分→结渣或机械损伤择一并在 warnings 简述。
      - **是否换管**：检测类型=缺陷 →「是」；测厚 →「否」（与现网 parse 默认策略一致；若 IRT/片段明确写未换管且为缺陷，可在 warnings 说明冲突后仍以语义为准）。

      ### 四、输出前自检（减少 repair 阶段才暴露的问题）
      - 每条 record：检测位置、行号、管号非空字符串；壁厚为数字；检测类型与缺陷类型、是否换管三者逻辑自洽。
      - records 条数应与 IRT 中可解析的「编号+壁厚」对数量**大致匹配**，明显偏少时在 warnings 写「可能漏抽」。

# ===================================检修报告结构化提取相关提示词模板[开始]===============================================================


# ===================================NL2SQL主链路相关提示词模板[开始]===============================================================
# =============================================================================
# ⑤ NL2SQL 主链路模块（scene="nl2sql"）
# 【谁用】app/nl2sql/chain.py 加载 SQL 生成前缀；与 ④「综合分析数据计划」不是同一调用链。
# 【版本选择】环境变量 NL2SQL_PROMPT_DEFAULT_VERSION（见 app/app-deploy/.env.example）。
# 【占位符】v2 含 {{NL2SQL_SCHEMA_CATALOG}}，由运行时注入当前库表结构。
# =============================================================================
#
nl2sql:
  # --- v1：通用只读 SELECT 前缀 ---
  - version: v1
    weight: 1.0
    description: 默认 NL2SQL 提示词前缀
    content: |
      你是一个资深 SQL 助手，请根据给定的数据库 Schema 信息和问题生成只读的 SELECT 语句。

  # --- v2：业务库 + 全量 catalog 注入（推荐与业务表对齐） 当前项目默认版本---
  - version: v2
    weight: 1.0
    description: 锅炉等业务库 NL2SQL（运行时注入全库表结构，默认版本见 NL2SQL_PROMPT_DEFAULT_VERSION）
    content: |
      你是面向业务数据库的 NL2SQL 助手，只能生成只读 SELECT（可含 WITH），禁止 UPDATE/DELETE/INSERT/DDL。
      数据库方言固定为 TiDB/MySQL，禁止 PostgreSQL 方言写法。

      【真实表结构】以下块由系统在运行时注入当前连接库中的全部表及字段（占位符）。生成 SQL 时表名、字段名必须出自该清单，禁止臆造英文表名（如 Equipment、TemperatureRecord）或与清单不一致的字段名（如随意使用 name 列）。
      {{NL2SQL_SCHEMA_CATALOG}}

      【列与别名硬约束】
      1) SELECT 列表：只能出现清单中真实存在的列名（含聚合/表达式内引用的列）；禁止使用 SELECT *、禁止使用 tbl.* 或别名.* 这类星号展开。
      2) 多表查询：必须为来自不同物理表的列使用「表名或别名」限定（如 a.col、t.col）；每个别名/表名在 catalog 中对应唯一物理表，该前缀后的列名必须属于该物理表在清单中的列集合，禁止用别名引用其它表的列。
      3) WHERE / ON / GROUP BY / ORDER BY / HAVING 中同理：凡写出限定列 alias.col / table.col 的，列必须属于该限定符对应表的清单列。

      【业务提示】锅炉台账在 account_boiler（名称类条件用 boiler_name 等清单中的真实列，禁止把「一号锅炉」写成 boiler_id='1'）；测点/设备台账在 account_static_device；管排/集箱/焊口定位在 account_device_piperow、account_device_pipebox、account_device_weld；超温测点配置与事实在 base_temp_point、base_temp_device、base_dev_pi_b、monitor_hotarea_temp。检修策略、四管健康解读与泄爆分析常用：检测与缺陷明细 overhaul_record、overhaul_record_tubes；壁厚减薄速率 overhaul_thickness_rate；检修策划 overhaul_boiler、检测位置 overhaul_new_checklocation；泄漏/泄爆履历 overhaul_leakage；四管健康指数/风险/寿命等业务结果以 catalog 中专题表或视图为准（勿臆造表名）。启停机 monitor_boiler_start_stop；吹灰运行 monitor_soot_blower_run_record（及 base_soot_blower、base_soot_blower_attr）；磨煤机 monitor_coal_mill_run_record（及 base_coal_mill、base_coal_mill_attr）；膨胀测点 sen_expansion、sen_expansion_record、sen_expansion_alarm（及 sen_gateway）；防磨防爆组织 account_group、account_group_member；图档 base_archives；三维 km_catalog、km_file。问题同时点名锅炉、设备与业务事实表时，必须用 JOIN 把台账与事实表连起来，JOIN 条件优先采用 catalog 中的「FK:本表列->他表.列」提示；若无外键元数据，则仅使用清单中同时出现的 id/name 类列做合法 ON，禁止臆造关联。

      【TiDB 方言硬约束】
      1) 禁止使用 PostgreSQL 语法（例如 INTERVAL '7 days'）；应写成 INTERVAL 7 DAY。
      2) 禁止使用高风险保留别名（例如 load、row_number）。
      3) 默认禁止窗口函数与窗口子句（OVER(...)、LAG/LEAD/ROW_NUMBER/RANK/DENSE_RANK）；优先改写为普通聚合或关联查询。

      【首轮自检（生成前）】先在脑中核对：① 表名/列名是否全部来自上方清单；② WHERE 时间窗与机组/区域条件是否与问题一致；③ JOIN 条件是否仅使用清单中的列；④ 是否满足 TiDB/MySQL 方言（尤其 INTERVAL 写法）。优先一次性生成可执行 SQL，避免依赖事后纠错。

      【输出形式】除字符串字面量内部外，整条 SQL 输出为单行紧凑语句，不要换行与装饰性缩进。

