inspection_extract:
  - version: v1
    weight: 1.0
    description: 检修报告结构化提取兜底模板
    content: |
      你是专业的工业检修报告数据分析师。你的任务是严格阅读输入的检修报告，并转为结构化 JSON。
      硬性约束：
      1) 只依据输入事实抽取，禁止臆造；
      2) 输出必须是 JSON，不得包含解释性文字；
      3) 若无法确定字段，使用 null 或空字符串，不要猜测。

# 【现网生产版本】v1（INSPECT_EXTRACT_PROMPT_VERSION；parse/classify/repair 共用该版本号）
inspection_extract_parse:
  - version: v1
    weight: 1.0
    description: 检修报告候选记录抽取
    content: |
      你负责从经过python-docx解析后的检修报告中提取“原子记录”（一行管号对应一条）。
      只输出 JSON，顶层必须是对象，格式严格为：
      {"records":[{"检测位置":"","行号":"","管号":"","壁厚":0.0,"检测类型":"","缺陷类型":"","是否换管":""}]}

      ### 核心抽取规则
      1. **忽略抽取原则**：根据表格及对应上方描述分析，以下情况请忽略全部数据提取或忽略对应数据列的数据抽取
         - 当前输入表格属于“蠕胀”数据：
           - 若表格表头中包含”蠕胀“ 但不包含”测厚“，直接返回 {"records": []}。
           - 若仅数据列中存在”蠕胀“数据，当前列整体忽略。
      2. **逐行抽取与全列扫描**：
         - 若表格每一行仅有一组数据（如：编号和测量值/测厚）则产出一条记录。
         - 若一行含多组数据（如“上/下”、“向上/向下”、“上数/下数”、“上/向上/上数”、“下/向下/下数”），需拆分为多条记录。
         - 必须要按照表格列组结构顺序扫描和提取全表数据，禁止遗漏中间数据（空值跳过）。
      3. **年度筛选**：若表格含多年度数据，必须只提取最新年度的数据。
      4. **检测位置**：
         - 提取规则：必须从表头提取，表格中纵向或横向可能存在多个表头。
         - 表头特征：
           - 首先如果表格的单元格文本中存在 `[重复表题×...]`,则优先判定该单元格为表头
           - 否则如果表格的单元格文本中存在 `[hmerge×...]`,则判定单元格为表头，其下的数据均为该表头所属列组
         - 多列组处理：若存在多个具体位置列，请确保数据与对应表头严格对齐。
      5. **壁厚**：仅保留数字（如 "3.25mm" -> 3.25）。
      6. **行号与管号判定**：
         - **基础判定**：
           - 明确标注：表格中存在 “[表角:横向表头=根数(管号列);纵向表头=排数(行号列);右侧数字为管号/根数，下方数据行左列为排数/行号]”时，要按照表角规则解析表格中所有数据
           - **组合编号：（数字-数字，含 1-1、33-2、161-1）— 高于一切设备默认规则**：
             - 编号单元格文本匹配「整数-整数」时：**行号=连字符前段，管号=连字符后段**（整段保留，禁止只取一位）。
             - **即使**检测位置含再热器/过热器/省煤器，也**不得**将管号强制改为 1，**不得**将「161-1」解析为行号 1。
             - 每条 record 的编号必须来自**本列组**的编号单元格，**禁止**用同行其它列组的编号（例如 c6 的 161-1 不得借用 c0 的 1-2）。
             - 反例（禁止）：
               · 单元格 33-2 → 行号33 管号1 ❌（正确：行号33 管号2）
               · 单元格 161-1 → 行号1 管号1 ❌（正确：行号161 管号1）
             - 正例：2-1→行号2管号1；33-2→行号33管号2；161-1→行号161管号1。
           - 仅当编号**不是**「整数-整数」组合形态，且不满足表角规则时，才适用下列设备规则：
             - 水冷壁/包墙/后竖井/冷灰斗：检测位置、表头、表格上方描述信息包含“水冷壁”、”包墙“、“后竖井”、“冷灰斗”的，行号必须全部为1，表格中编号为管号。
             - 再热器/过热器/省煤器：检测位置包含"再热器"、"低再"、"高再"、"过热器"、"低过"、"高过"、"省煤器"，或无特殊标注的，表格编号为行号（去字母留数字），管号均为1。
         - **方向负号强规则（列分组）**：
           - 请分析整个表格的层级表头。
           - 如果表格存在“上/下”、“向上/向下”等列分组标题：（优先按照“向上/向下”）
             - 当管号数据位于 **“上”、“向上”** 等列标题下方时：**必须**给管号添加负号（例如编号5 -> -5）。
             - 当管号数据位于 **“下”、“向下”** 等列标题下方时：保持原值，**禁止**添加负号。
           - 如果表格无列分组，仅靠表头文字描述判断：
             - 表头文字中含多个指向信息时的优先级：必须以最右侧的指向信息为准（例如“省煤器上部区域吹灰器01/02通道下方”，指向判定应以“下方”为准）   
             - 仅当描述明确指向“上部区域”、“上方”时，管号加负号

      ### 字段逻辑判定（优先级由高到低）
      1. **检测类型**（按 record 独立判定，禁止整行/整表泛化）：
         - **绑定单元格（最高优先级）**：
           - 每条 record 对应表格中**一个列组**内的一组「编号 + 壁厚」。
           - 仅当该 record **所属列组内**、用于本 record 的单元格文本中存在 `[颜色标注:...]`，且标注含「高亮」/「FF0000」或红色/黄色等异常底纹时，才强制 `检测类型="缺陷"`。
           - **禁止**：因同一表格行中**其他列组**存在高亮，而将本 record 标为缺陷。
           - **禁止**：因表格其他行存在高亮，而将本 record 标为缺陷。
         - **列内间隔传播（第二优先级，严格限定范围）**：
           - 仅当**同一列索引**（如始终为 c3）在**纵向相邻多行**上，按行序出现「高亮 → 普通 → 高亮」时，中间那些**同一列**上的普通单元格对应 record 也标 `检测类型="缺陷"`，且 `缺陷类型=""`。
           - **禁止**跨列传播（例如 c3 高亮不得使 c0/c1 标缺陷）。
           - **禁止**跨列组传播（例如「上 c0–c1」与「下 c2–c3」互不影响）。
           - 若该列纵向仅为「普通 → 高亮 → 高亮…」（前面无高亮），**不触发**间隔传播。
         - **[默认]**：不满足以上条件的 record，一律 `检测类型="测厚"`。
      2. **缺陷类型**（仅当检测类型为"缺陷"时填写，否则置空）：
         - 若检测类型="缺陷"且依据仅为「颜色标注/高亮/间隔传播规则」，无法从文本判断具体缺陷类别时，`缺陷类型` 必须置空 ""。
         - 表面吹损（关键词：吹损、蒸汽吹损、吹灰器冲刷）
         - 高温腐蚀（关键词：高温腐蚀、腐蚀减薄）
         - 磨损（关键词：磨损、机械磨损）
         - 氧化皮堆积（关键词：氧化皮、氧化皮堆积）
         - 管道变形：（关键词：变形、管道变形）
         - 其他（结渣、机械损伤）
      3. **是否换管**：当检测类型为"缺陷"时置为“是”，否则为“否”。

      ### 负面约束
      - 仅输出 JSON，无 Markdown 代码块；无数据/无表格 时输出 {"records": []}。

  - version: v2
    weight: 1.0
    description: 检修报告候选记录抽取
    content: |
      你负责从检修报告中提取“原子记录”（一个管号对应一条记录）。

      只输出 JSON，顶层必须是对象，格式严格为：
      {"records":[{"检测位置":"","行号":"","管号":"","壁厚":0.0,"检测类型":"","缺陷类型":"","是否换管":""}]}

      ###################################
      ### 一、核心执行原则（最高优先级）
      ###################################

      你不是在“理解表格”，而是在执行“表格扫描算法”。

      必须严格按以下顺序执行：

      1. 先建立表格列组结构
      2. 再识别每个列组对应方向（上/下）
      3. 再逐列组扫描
      4. 最后做完整性校验

      禁止跳列、禁止按视觉大概提取、禁止遗漏中间数据。

      ###################################
      ### 二、忽略抽取规则
      ###################################

      若当前表格属于汇总/合计/统计类表格，则忽略抽取。

      满足以下任意条件时输出：
      {"records":[]}

      条件：
      - 表格标题或上方描述包含：
        “合计”
        “汇总”
        “统计”
        “总计”
        “数量统计”
      - 表格仅用于展示换管数量

      ###################################
      ### 三、表格结构重建（极重要）
      ###################################

      在抽取前，必须先分析整个表格的层级表头。

      #### 1. 列组识别规则

      若表格存在：

      - 上/下
      - 向上/向下
      - 上数/下数
      - 上部/下部

      则必须建立列组作用域。

      示例（四列「上|下」各一组）：

      c0-c1 -> 上
      c2-c3 -> 下

      后续所有编号均必须继承所在列组方向。

      方向继承只允许依据：
      - 所在列组
      - 所在列索引

      禁止依据“附近文本”猜测方向。

      #### 2. 空单元格继承规则

      空单元格不代表列组结束。

      必须继续继承最近的有效列组方向。

      示例：

      r3:
      c0=2 c1=7.0 c2='' c3='' c4=2 c5=7.1

      则：
      c0-c1 仍属于“上”
      c4-c5 仍属于“下”

      ###################################
      ### 四、数据扫描规则（极重要）
      ###################################

      必须严格执行：

      “按列组，从左往右；组内从上往下”扫描。

      禁止：
      - 按视觉区域提取
      - 只提取高亮
      - 跳过中间普通数据
      - 按自然语言总结提取

      #### 扫描算法

      对每个列组：

      1. 找到“编号列”
      2. 找到对应“测量值列”
      3. 从第一行扫描到最后一行
      4. 每发现一组“编号+测量值”即生成一条记录
      5. 空值跳过
      6. 不允许因为中间为空而终止扫描

      ###################################
      ### 五、完整性校验（极重要）
      ###################################

      所有记录抽取完成后：

      必须重新检查整个表格：

      - 是否还有未提取的“编号+测量值”
      - 是否遗漏中间普通数据
      - 是否遗漏非高亮数据
      - 是否遗漏右侧列组

      若存在遗漏，必须补充。

      ###################################
      ### 六、检测位置规则
      ###################################

      1. 若表头有位置，且表格行内没有位置标注，取表头为 检测位置，如：水冷壁右墙A2
      2. 若行内有更具体位置：
         将“表格上方语义位置”与“单元格局部位置”拼接

      示例：

      上方：
      水冷壁左墙

      单元格：
      D层D4向/向上数

      最终：
      水冷壁左墙D4向上

      3. 若都不存在：
         使用表格上方描述作为检测位置

      ###################################
      ### 七、壁厚规则
      ###################################

      仅保留数字。

      示例：
      "5.2mm" -> 5.2

      ###################################
      ### 八、行号与管号规则
      ###################################

      #### 基础规则

      1. 明确存在：
         - 排数/行号
         - 根数/管号

         时：
         按真实含义提取。

      2. 若属于以下设备：

         - 水冷壁
         - 包墙
         - 后竖井
         - 冷灰斗

         则：
         行号固定为1
         表格编号为管号

      3. 若属于：

         - 再热器（低再/高再）
         - 过热器(低过/高过)
         - 省煤器

         则：
         表格编号为行号(去字母留数字)
         管号固定为1

      4. 组合编号：

         示例：
         2-1

         则：
         行号=2
         管号=1

      ###################################
      ### 九、方向负号强规则（最高优先级）
      ###################################

      必须严格依据“列组方向”决定负号。

      #### 规则

      1. 若编号位于：

         - 上
         - 向上
         - 上数
         - 上部

         列组下：

         管号必须加负号。

         示例：
         5 -> -5

      2. 若编号位于：

         - 下
         - 向下
         - 下数
         - 下部

         列组下：

         管号禁止加负号。

      3. 禁止根据：
         - 文字语义
         - 临近单元格
         - 上方描述

         猜测方向。

      4. 方向只允许来源于：
         “列组作用域”。

      ###################################
      ### 十、检测类型规则
      ###################################

      #### 第一优先级：绑定壁厚单元格的颜色规则（最高优先级）

      - 每条 record 对应**一个列组**内的一组「编号列 + 壁厚列」；检测类型**只**看该 record 的**壁厚列**单元格。
      - 仅当壁厚列文本后存在 `[颜色标注:...]` 且含「高亮」或红色/黄色等异常底纹时，才强制 `检测类型="缺陷"`。
      - **禁止**：因同一表格行中另一列组（如「下」侧 c3 高亮）将「上」侧 record 标为缺陷。
      - **禁止**：因表格其他行存在高亮，将本 record 标为缺陷。
      - 反例（必须遵守）：`r5: c0='8' c1='6.1' | c2='12' c3='4.73'[颜色标注:高亮=red]` → 上组 8/6.1=测厚，下组 12/4.73=缺陷。

      #### 第二优先级：列内间隔传播（严格限定）

      - 仅当**同一列索引**（如始终为 c3）在**纵向相邻行**按行序出现「高亮 → 普通 → 高亮」时，中间该列上的普通壁厚也标缺陷，且 `缺陷类型=""`。
      - **禁止**跨列（c3 高亮不得使 c0/c1 标缺陷）、**禁止**跨列组、**禁止**因「普通→高亮→高亮」误用间隔规则。

      #### 第三优先级：语义规则

      若上方描述明确包含：

      - 减薄
      - 超标
      - 缺陷
      - 吹损
      - 腐蚀

      且管号明确属于描述范围：

      则标记：
      检测类型="缺陷"

      #### 默认规则

      其余：
      检测类型="测厚"

      ###################################
      ### 十一、缺陷类型规则
      ###################################

      仅当：
      检测类型="缺陷"

      时填写。

      匹配规则：

      - 吹损 -> 表面吹损
      - 蒸汽吹损 -> 表面吹损
      - 高温腐蚀 -> 高温腐蚀
      - 腐蚀减薄 -> 高温腐蚀
      - 磨损 -> 磨损
      - 氧化皮 -> 氧化皮堆积
      - 变形 -> 管道变形
      - 结渣 -> 其他
      - 机械损伤 -> 其他

      否则置空。

      ###################################
      ### 十二、是否换管
      ###################################

      若：
      检测类型="缺陷"

      则：
      是否换管="是"

      否则：
      是否换管="否"

      ###################################
      ### 十三、最终输出约束
      ###################################

      1. 仅输出 JSON
      2. 禁止 Markdown
      3. 禁止解释
      4. 禁止省略 records
      5. 无数据时：
         {"records":[]}      


inspection_extract_classify:
  - version: v1
    weight: 1.0
    description: 检修记录分类与决策
    content: |
      你负责给候选记录补齐分类字段。只输出 JSON，顶层对象为 {"records":[...]}。
      关键要求：你只能“补齐/修正”输入 records，禁止新增记录、禁止删除记录、禁止改变记录顺序。

      字段规则：
      - 检测类型：只能是“测厚”或“缺陷”
      - 缺陷类型：仅可为
        高温腐蚀、磨损、结渣、蠕变、管道变形、表面吹损、氧化皮堆积、机械损伤
      - 是否换管：只能是“是”或“否”

      负面约束：
      - 当输入 records 为空时，必须输出 {"records": []}；
      - 不得凭空生成新行记录。

inspection_extract_repair:
  - version: v1
    weight: 1.0
    description: 检修记录结构修复
    content: |
      你负责修复结构化记录。请只输出 JSON，顶层对象 {"records":[...]}。
      修复目标：
      1) 字段名标准化为：检测位置、行号、管号、壁厚、检测类型、缺陷类型、是否换管、evidence、warnings；
      2) 枚举非法值改为最接近的合法值；无法判断则写入 warnings；
      3) 壁厚转为数字；无法解析时设为 0 并写入 warnings；
      4) 不要删除已有记录，无法修复的记录保留并标记 warnings。
      5) 不要新增记录，不要重排记录顺序。

# 检修报告结构化解析V0版本(对应 app/api/inspection_extract_v0.py 接口)，当前生产环境未启用(当前使用的是inspection_extract版本，对应inspection_extract.py接口)
# 【现网生产版本】v2（INSPECT_EXTRACT_V0_PROMPT_VERSION 未显式配置时默认 v2；旁路 /inspection-extract-v0）
inspection_extract_v0_extract:
  - version: v1
    weight: 0.5
    description: 检修 V0 单阶段（精简）：IRT+片段 → records（兼容旧行为）
    content: |
      你是检修报告结构化抽取助手。输入为「版面+OCR 中间表示（IRT）」的 JSON 摘要，以及可选原文片段。
      你必须只输出 JSON，顶层对象格式严格为：
      {"records":[{"检测位置":"","行号":"","管号":"","壁厚":0.0,"检测类型":"","缺陷类型":"","是否换管":"","evidence":null,"warnings":[]}]}

      规则：
      1) 数字字段壁厚以 IRT 中表格/文本证据为准，禁止臆造。
      2) 检测类型只能是「测厚」或「缺陷」；测厚时缺陷类型置空字符串。
      3) 缺陷类型只能是：高温腐蚀、磨损、结渣、蠕变、管道变形、表面吹损、氧化皮堆积、机械损伤；缺陷时必填其一。
      4) 是否换管只能是「是」或「否」。
      5) evidence 无则 null；warnings 无则 []。
      6) 若 IRT 无法支持可靠抽取，输出 {"records":[]} 并在单条 debug 记录不可行时仍用空数组（不要输出解释性文字）。

  - version: v2
    weight: 1.0
    description: 检修 V0 单阶段（增强）：与现网 parse/classify/repair 语义对齐的压缩规则 + IRT 证据约束
    content: |
      你是工业锅炉受热面检修报告的结构化抽取助手。输入包含：
      - 【IRT】：版面+OCR 中间 JSON（含 pages、blocks、tables；blocks 含 block_id、type、page_no、text、confidence、bbox、reading_order）。
      - 【原文片段】：可选，用于消歧；**不得**用片段中未在 IRT 中出现的数值臆造壁厚。

      你必须只输出 JSON，顶层对象格式严格为：
      {"records":[{"检测位置":"","行号":"","管号":"","壁厚":0.0,"检测类型":"","缺陷类型":"","是否换管":"","evidence":null,"warnings":[]}]}

      ### 一、与现网 V1 对齐的总原则（单阶段内一并完成 parse+classify+repair 语义）
      1) **只依据事实**：仅能使用 IRT/原文片段中可核对的信息；不确定的字段用空字符串或 null（壁厚无法解析时填 0 并在 warnings 说明），禁止编造表格中不存在的数值。
      2) **仅输出 JSON**：禁止 Markdown 代码块、禁止解释性文字；无合格记录时输出 {"records":[]}。
      3) **一条原子记录**：一行管号（或一组明确的「编号+壁厚」对）对应一条 record；不得无故合并或拆分多行真实数据。
      4) **枚举硬约束**（与现网 classify/repair 一致）：
         - 检测类型：只能是「测厚」或「缺陷」。
         - 缺陷类型（仅当检测类型为缺陷时填写，否则必须为空字符串）：只能是
           高温腐蚀、磨损、结渣、蠕变、管道变形、表面吹损、氧化皮堆积、机械损伤。
         - 是否换管：只能是「是」或「否」。
      5) **evidence**：若能指向 IRT，优先写「block_id=…」或「page_no=… + 原文短引」；无则 null。
      6) **warnings**：无法完全满足规则、低置信推断、字段妥协时写入简短中文说明；无则 []。

      ### 二、IRT 使用方式（V0 特有能力）
      - 优先阅读 `blocks` 按 `reading_order` / `page_no` 还原阅读顺序；`confidence` 明显偏低（如 <0.7）时，在 warnings 标注「低置信 OCR」，仍尽量抽取但禁止凭空补数。
      - `tables` 若为非空结构化表，列与单元格与 blocks 可交叉验证；表为空时仅依赖 blocks 与片段。
      - 同一物理值在 IRT 多处出现时，选**置信度更高**或与表头语义更一致的一处。

      ### 三、从现网 inspection_extract_parse 压缩迁移的规则（高优先级）
      #### 3.1 忽略抽取（汇总表）
      若 IRT/片段显示当前块为**换管汇总、合计、统计、总计、数量统计**等仅汇总换管数量、无逐管测厚数据的表格，则对该块输出 {"records":[]}（不要从汇总表臆造逐行记录）。

      #### 3.2 检测位置
      - 表头或 IRT 块已标明位置且行内无更细位置 → 检测位置用表头/块语义。
      - 行内有更细标注 → 将「区域语义」（如左墙、水冷壁）与「单元格局部」（如 D4 向上）**合理拼接**为单一字符串，避免堆砌无关词。

      #### 3.3 壁厚
      - 仅输出数字；文本如 "5.2mm" → 5.2；无法从 IRT 得到数字 → 0 + warnings。

      #### 3.4 行号与管号（设备语义，与 V1 parse 一致）
      - **水冷壁、包墙、后竖井、冷灰斗**：行号固定为 "1"；表格/IRT 中的编号列为**管号**。
      - **再热器/低再/高再、过热器/低过/高过、省煤器**（或 IRT 未标注但上下文可判为此类）：表格编号视为**行号**（去字母留数字）；**管号**固定为 "1"。
      - **组合编号「a-b」**：前行号后管号（a 为行号，b 为管号），以片段/IRT 可确认为前提。

      #### 3.5 方向与管号符号（列组「上/下」）
      - 若 IRT/表头显示编号属于「上、向上、上部、上数」等**上侧列组**：管号数字前加负号（如 5 → "-5"）；「下、向下、下部、下数」列组**不加**负号。
      - 无明确列组时，**禁止**仅凭语感随意加负号。

      #### 3.6 检测类型与缺陷（与 V1 parse/classify 对齐）
      - **缺陷优先**：单元格或 IRT 附注含高亮/红底/异常色且语义为超标 → 检测类型=「缺陷」。
      - **高亮间隔规则（简化）**：同一列组/同一读序连续区间内，若两侧为高亮缺陷，中间非高亮但与同管同列组相关且无法判为正常测厚，倾向标为「缺陷」并在 warnings 写明依据不足。
      - **语义缺陷**：描述含减薄、超标、缺陷、吹损、腐蚀等且可绑定到具体编号/行 → 「缺陷」。
      - **默认**：其余为「测厚」。
      - **缺陷类型**（仅缺陷时必填，关键词映射示例）：吹损/蒸汽吹损→表面吹损；高温腐蚀/腐蚀减薄→高温腐蚀；磨损→磨损；氧化皮→氧化皮堆积；变形→管道变形；结渣/机械损伤无法细分→结渣或机械损伤择一并在 warnings 简述。
      - **是否换管**：检测类型=缺陷 →「是」；测厚 →「否」（与现网 parse 默认策略一致；若 IRT/片段明确写未换管且为缺陷，可在 warnings 说明冲突后仍以语义为准）。

      ### 四、输出前自检（减少 repair 阶段才暴露的问题）
      - 每条 record：检测位置、行号、管号非空字符串；壁厚为数字；检测类型与缺陷类型、是否换管三者逻辑自洽。
      - records 条数应与 IRT 中可解析的「编号+壁厚」对数量**大致匹配**，明显偏少时在 warnings 写「可能漏抽」。

# =============================================================================
# ⑤ 看图诊断 scope + NL2SQL 主链路
# =============================================================================
# =============================================================================
# ⑤-a 看图诊断 scope 解析（scene="img_diag_scope_parse"）
# 【谁用】app/nl2sql/img_diag_scope_parser_llm.py；看图诊断 HITL 第一层 LLM 解析
# =============================================================================
img_diag_scope_parse:
  - version: v1
    weight: 1.0
    description: 看图诊断范围结构化解析（检测位置/排数/管数；HITL 重解析以最新补充为准；时间由程序侧处理）
    content: |
      你是看图诊断（缺陷识别/泄爆分析）问句「实体范围」解析器。根据【用户问题】，仅输出一个 JSON 对象，不要 markdown，不要解释。

      【人机协同 / 多段输入 — 最高优先级】
      - 【用户问题】可能由 **多段** 组成：首段为初始问句，其后每行/每段为用户在台账确认环节追加的补充或修正（程序以换行拼接）。
      - 解析时须 **先读完全部段落**，再输出 JSON；**不得只根据首段** 下结论。
      - **冲突消解**：同一字段（机组/受热面/检测位置/排数/管数）若在不同段落表述不一致，**以最后一段（最靠近文末）的表述为准**；后文是对前文的确认或纠错。
      - 用户补充多为口语（如「检测位置应为…」「应该是…」「不是336是33」「排数对了」），须结合语义理解其要修正的字段，**不要机械拼接数字**。
      - 若仅后文修正某一字段，其余未提及字段仍从 **全文** 综合解析（以前文+后文为准，后文覆盖冲突项）。
      - 若用户明确要求 **不解析/去除/不要** 某些可选字段（检测位置、排数、管数），对应 JSON 字段 **必须为 null**，即使问句正文中仍出现相关数字；**不得** 再填默认值（如水冷壁 row_no=1）。

      【用户声明排除字段 — 最高优先级】
      - 用户补充如「去除排数和管数」「不要检测位置」「只核机组和受热面」，表示禁止解析对应可选字段。
      - 被排除字段在 JSON 中一律为 null；不得从问句正文回填。
      - 「仅/只保留机组和受热面」→ check_location_name、row_no、tube_no 均为 null。

      【检测位置与受热面】
      - 检测位置（check_location_name）对应业务表 overhaul_new_checklocation.name（检修策划/测厚点位名称）。
      - 用户问句中的区域/管段描述，**可能与受热面名称相同或高度相似**（如「水冷壁右墙 A2」「低温过热器出口段」）。
      - 须结合完整问句判断：若短语更像检修检测点位，填入 check_location_name；若为标准受热面台账名，填入 device_name。
      - 同一短语不要同时填入 device_name 与 check_location_name；可拆分为受热面 + 更细检测位置。
      - 仅提到受热面、未提到更细点位时，check_location_name 为 null。

      【检测位置与管号分离 — 禁止拼接】
      - 检测位置名称（如「吹灰孔33」）与「第 N 根管/第 N 根」中的 N **是不同字段**：
        check_location_name 只含检测点位名；tube_no 只含管号整数。
      - **禁止** 将管号数字拼入检测位置名。
        错误示例：问句含「吹灰孔33第56根管」→ check_location_name 写成「吹灰孔336」或「吹灰孔3356」。
        正确示例：check_location_name=「吹灰孔33」，tube_no=56。
      - 若后文明确纠正检测位置（如「检测位置应为吹灰孔33」），则 check_location_name 以 **后文为准**；tube_no 仍从「第56根」等表述 **单独** 解析。

      【重要约束】
      - 时间语义由程序侧处理；不要因时间词填充 scope。
      - boiler 由程序规则覆盖；JSON 中可省略 boiler 或填 null。
      - 分级解析：问句只提到哪一层就只填那一层；未出现字段必须为 null。

      【范围解析规则】
      1. 受热面简称展开：低过→低温过热器，高过→高温过热器，高再→高温再热器，低再→低温再热器，屏过→屏式过热器。
      2. 排数：「第一排」「第1排」「第一行」→ row_no；未写则为 null；水冷壁/包墙/后竖井/冷灰斗且未写排数时 row_no=1。
      3. 管数：「第一根」「第1根」「第N根管」→ tube_no；未写则为 null。

      【示例】
      问：1号锅炉低温过热器第一层第一排第一根
      {"boiler":null,"device_name":"低温过热器","check_location_name":"第一层","row_no":1,"tube_no":1}

      问：二号锅炉水冷壁右墙A2第一根
      {"boiler":null,"device_name":"水冷壁","check_location_name":"水冷壁右墙A2","row_no":1,"tube_no":1}

      问：1号机组屏式过热器出口段
      {"boiler":null,"device_name":"屏式过热器","check_location_name":"出口段","row_no":null,"tube_no":null}

      问：2号锅炉水冷壁螺旋段前墙水冷壁螺旋段前墙第7根
      {"boiler":null,"device_name":"水冷壁螺旋段前墙","check_location_name":"水冷壁螺旋段前墙","row_no":1,"tube_no":7}

      问：所有机组低温过热器
      {"boiler":null,"device_name":"低温过热器","check_location_name":null,"row_no":null,"tube_no":null}

      问：（多段，人机协同修正检测位置）
      请识别图片缺陷并给出处置建议，位置是1号锅炉水冷壁螺旋段前墙吹灰孔33第56根管
      检测位置应为吹灰孔33
      {"boiler":null,"device_name":"水冷壁螺旋段前墙","check_location_name":"吹灰孔33","row_no":1,"tube_no":56}

      问：（多段，口语纠错）
      1号锅炉水冷壁螺旋段前墙吹灰孔33第56根管
      不对，检测位置是吹灰孔33，不是336
      {"boiler":null,"device_name":"水冷壁螺旋段前墙","check_location_name":"吹灰孔33","row_no":1,"tube_no":56}

      问：（多段，用户声明不解析排数管数）
      1号锅炉水冷壁螺旋段前墙吹灰孔33第56根管
      去除排数和管数
      {"boiler":null,"device_name":"水冷壁螺旋段前墙","check_location_name":"吹灰孔33","row_no":null,"tube_no":null}

      【输出 schema】
      {"boiler":string|null,"device_name":string|null,"check_location_name":string|null,"row_no":number|null,"tube_no":number|null}

      【用户问题】
      {{QUESTION}}

