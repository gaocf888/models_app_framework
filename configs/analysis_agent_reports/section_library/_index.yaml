# 地降板块库索引。改章节只改本目录 JSON / compose；本文件提供循环词表与共享取数项。
# 平原 8 区与季报有站目录对齐；名称须带「区」，对应 t_station.area。
# 注意：shared_plan_items 会全部进入报告 plan（按 item_id 去重），勿放重复 SQL 的别名项。

plain_districts:
  - { id: chaoyang, name: 朝阳区, seq: 1, figure_no: "2-2" }
  - { id: haidian, name: 海淀区, seq: 2 }
  - { id: tongzhou, name: 通州区, seq: 3, figure_no: "2-3" }
  - { id: shunyi, name: 顺义区, seq: 4, figure_no: "2-4" }
  - { id: daxing, name: 大兴区, seq: 5, figure_no: "2-5" }
  - { id: changping, name: 昌平区, seq: 6, figure_no: "2-6" }
  - { id: pinggu, name: 平谷区, seq: 7, figure_no: "2-7" }
  - { id: yanqing, name: 延庆区, seq: 8, figure_no: "2-8" }

compress_groups:
  # annex_no=2..5：附表1 是地面沉降，压缩层组从附表2 起
  - { id: l01, name: 第一压缩层组, layer_from: 0, layer_to: 1, annex_no: 2, heading: "（一）", depth: "0—50米", missing_note: "" }
  - { id: l12, name: 第二压缩层组, layer_from: 1, layer_to: 2, annex_no: 3, heading: "（二）", depth: "50—100米", missing_note: "" }
  - { id: l23, name: 第三压缩层组, layer_from: 2, layer_to: 3, annex_no: 4, heading: "（三）", depth: "100—180米", missing_note: "位于平谷区东高村镇南宅村的F11监测站无第三压缩层监测。" }
  - { id: l34, name: 第四压缩层组, layer_from: 3, layer_to: 4, annex_no: 5, heading: "（四）", depth: "180米以深", missing_note: "位于平谷区马昌营镇后芮营村的F9监测站、马坊镇洼里村的F10监测站和东高村镇南宅村的F11监测站无第四压缩层监测。" }

# 所有需要沉降数字的模版共用；叙述章 source 指向 q_layer0，禁止用 nl2sql 生成器当附表真源
shared_plan_items:
  - item_id: q_fcb_endpoints
    executor: sql_template
    sql_file: fcb_period_endpoints.sql
    mandatory: true
    dependency_ids: []
    purpose: 边界标窗初窗末累计沉降（覆盖名单 ∩ 层位字典）
  - item_id: q_layer0
    executor: python
    python_fn: slice_layer0
    mandatory: true
    dependency_ids: [q_fcb_endpoints]
    purpose: 层位0地面沉降 Δ=初−末
  - item_id: q_area_rank
    executor: python
    python_fn: rank_by_area
    mandatory: false
    dependency_ids: [q_layer0]
    purpose: 全市平原按行政区汇总层位0
  - item_id: q_ops_rates
    executor: sql_template
    sql_file: om_ops_rates_by_type.sql
    mandatory: false
    dependency_ids: []
    purpose: 各仪器类型在线/完整/有效率（om_result 最新批次）
  - item_id: q_ops_offline_list
    executor: sql_template
    sql_file: om_ops_offline_list.sql
    mandatory: false
    dependency_ids: []
    purpose: 当前离线设备明细与离线天数（om_result 最新批次 status=0）
  - item_id: q_alert_summary
    executor: sql_template
    sql_file: om_alert_summary.sql
    mandatory: false
    dependency_ids: []
    purpose: 告警总览一行（om_result）
  - item_id: q_alert_count_by_type
    executor: sql_template
    sql_file: om_alert_count_by_type.sql
    mandatory: false
    dependency_ids: []
    purpose: 各仪器类型告警设备台数（om_result 最新批次）
  - item_id: q_alert_list
    executor: sql_template
    sql_file: om_alert_list.sql
    mandatory: false
    dependency_ids: []
    purpose: 当前告警仪器列表（om_result，含序号）
