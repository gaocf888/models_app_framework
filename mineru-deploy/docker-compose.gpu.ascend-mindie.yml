# =============================================================================
# MinerU · 昇腾 MindIE 底座编排（300I Duo / 310P 试验栈）
# =============================================================================
# 与 docker-compose.gpu.ascend.yml（vllm-ascend）并列，默认互不影响。
#
# 启动：
#   docker compose --env-file .env -f docker-compose.gpu.ascend-mindie.yml up -d --build
#
# 底座默认：quay.io/ascend/mindie:1.0.RC2-300I-Duo-aarch64
# 宿主 HDK/驱动须与镜像内 CANN 匹配；卡号勿与 vLLM/app 重叠。
#
# 310P 若仍遇算子问题，可在 command 追加（按现场 MinerU 版本支持情况）：
#   --device npu --backend pipeline --dtype float16 --enforce-eager
# =============================================================================

version: '3.8'

services:
  mineru-api:
    build:
      context: .
      dockerfile: Dockerfile.gpu.ascend-mindie
      args:
        BASE_IMAGE: ${MINERU_MINDIE_BASE_IMAGE:-quay.io/ascend/mindie:1.0.RC2-300I-Duo-aarch64}
        MINERU_PIP_SPEC: ${MINERU_GPU_PIP_SPEC:-mineru[core]}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    image: ${MINERU_ASCEND_MINDIE_IMAGE:-mineru-gpu:ascend-mindie-300i}
    container_name: ${MINERU_CONTAINER_NAME:-mineru-api}
    restart: unless-stopped
    runtime: ${ASCEND_DOCKER_RUNTIME:-ascend}
    privileged: true
    shm_size: ${MINERU_SHM_SIZE:-1g}
    ports:
      - "${MINERU_PORT:-8009}:8000"
    environment:
      - MINERU_DEVICE_MODE=${MINERU_DEVICE_MODE:-npu}
      - ASCEND_RT_VISIBLE_DEVICES=${ASCEND_RT_VISIBLE_DEVICES:-6}
      # MinerU 在 ascend 上常依赖该变量切换 spawn，避免 fork 问题
      - MINERU_LMDEPLOY_DEVICE=${MINERU_LMDEPLOY_DEVICE:-ascend}
      - MINERU_MODEL_SOURCE=${MINERU_MODEL_SOURCE:-modelscope}
      - MINERU_TOOLS_CONFIG_JSON=${MINERU_TOOLS_CONFIG_JSON:-/config/mineru.json}
      - MINERU_API_OUTPUT_ROOT=/io/mineru-output
      - HF_HOME=/io/.hf_cache
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-0}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-8}
      - MKL_NUM_THREADS=${MKL_NUM_THREADS:-8}
      - OPENBLAS_NUM_THREADS=${OPENBLAS_NUM_THREADS:-8}
      - NUMEXPR_NUM_THREADS=${NUMEXPR_NUM_THREADS:-8}
      - TORCH_NUM_THREADS=${TORCH_NUM_THREADS:-8}
      - TORCH_NUM_INTEROP_THREADS=${TORCH_NUM_INTEROP_THREADS:-2}
      # 构建阶段会再写入 /etc/ascend-python-bindir；此处覆盖常见 MindIE Python 路径
      - PATH=/usr/local/python3.10.0/bin:/usr/local/python3.10/bin:/usr/local/python3.11.13/bin:/usr/local/python3.12.13/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ${MINERU_MODELS_HOST_PATH}:/models:ro
      - ${MINERU_IO_HOST_PATH}:/io
      - ${MINERU_CONFIG_HOST_PATH:-./config/mineru.json}:/config/mineru.json:ro
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro
      - /dev:/dev
      # MindIE 文档常见附加挂载（宿主机存在时再取消注释，路径缺失会导致 compose 失败）
      # - /usr/local/dcmi:/usr/local/dcmi:ro
      # - /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info:ro
      # - /etc/ascend_install.info:/etc/ascend_install.info:ro
      # - /usr/local/Ascend/firmware:/usr/local/Ascend/firmware:ro
    # 默认与现有 ascend compose 一致；310P 不稳时可改用下方注释 command
    command: ["mineru-api", "--host", "0.0.0.0", "--port", "8000"]
    # command:
    #   - mineru-api
    #   - --host
    #   - 0.0.0.0
    #   - --port
    #   - "8000"
    #   - --device
    #   - npu
    #   - --backend
    #   - pipeline
    #   - --dtype
    #   - float16
    #   - --enforce-eager
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - mineru-net
    mem_limit: ${MINERU_MEM_LIMIT:-16g}

networks:
  mineru-net:
    name: ${MINERU_NETWORK_NAME:-mineru-stack}
    driver: bridge
