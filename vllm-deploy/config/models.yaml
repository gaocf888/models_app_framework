# 配置优先级2
# 当前vllm-deploy/ 的全部配置文件如下（按照配置生效优先级排序）：
# .env
# config/models.yaml
# config/vllm.yaml

# 模型预设配置
presets:
  # ==================== 通义千问 2.5 系列 ====================

  # Qwen2.5 7B 基础模型
  qwen2.5-7b:
    path: "./models/Qwen2.5-7B-Instruct"
    served_model_name: "qwen2.5-7b-instruct"
    dtype: "float16"
    max_model_len: 32768
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.85
    max_num_seqs: 32
    max_num_batched_tokens: 32768
    enable_prefix_caching: true
    multimodal: false
    description: "Qwen2.5 7B 指令模型，适合通用对话"

  # Qwen2.5 14B 模型
  qwen2.5-14b:
    path: "./models/Qwen2.5-14B-Instruct"
    served_model_name: "qwen2.5-14b-instruct"
    dtype: "bfloat16"
    max_model_len: 32768
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.85
    max_num_seqs: 24
    max_num_batched_tokens: 24576
    enable_prefix_caching: true
    multimodal: false
    description: "Qwen2.5 14B 指令模型，平衡性能与效果"

  # Qwen2.5 14B Instruct AWQ（单卡 RTX 3090 24GB 推荐，权重约 9GiB，较 32B AWQ 更易留出 KV 与并发）
  # 与 models-app 同机时：建议嵌入/重排 EMBEDDING_DEVICE=cpu、RAG_RERANKER_DEVICE=cpu，GPU 主要给 vLLM
  qwen2.5-14b-awq:
    path: "./models/Qwen2.5-14B-Instruct-AWQ"
    served_model_name: "qwen2.5-14b-instruct-awq"
    dtype: "half"
    quantization: "awq"
    max_model_len: 8192
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.73
    max_num_seqs: 8
    max_num_batched_tokens: 4096
    enable_prefix_caching: true
    attention-backend: flash_attn
    multimodal: false
    description: "Qwen2.5-14B-Instruct-AWQ，单卡 3090 24G 文本对话（16K 上下文；OOM 时可降 max_model_len 至 8192）"

  # Qwen2.5 32B AWQ 模型（单卡 RTX 3090 24GB 推荐预设）
  # AWQ 权重约 18GiB，24G 卡 KV 余量很小；vLLM 实测可用 KV≈1.25GiB 时 max_model_len 宜≤4096（估上限约 5120）
  qwen2.5-32b-awq:
    path: "./models/Qwen2.5-32B-Instruct-AWQ"
    served_model_name: "qwen2.5-32b-instruct-awq"
    dtype: "half"
    quantization: "awq"
    max_model_len: 4096
    enforce_eager: true
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.93
    max_num_seqs: 4
    max_num_batched_tokens: 4096
    enable_prefix_caching: false
    attention-backend: flash_attn
    multimodal: false
    description: "Qwen2.5 32B AWQ，单卡 3090 24G（4K 上下文；OOM 时可再降 max_model_len 或关闭其他占显存进程）"

  # Qwen2.5 72B 模型
  qwen2.5-72b:
    path: "./models/Qwen2.5-72B-Instruct"
    served_model_name: "qwen2.5-72b-instruct"
    dtype: "bfloat16"
    max_model_len: 32768
    tensor_parallel_size: 4
    gpu_memory_utilization: 0.85
    max_num_seqs: 16
    max_num_batched_tokens: 16384
    enable_prefix_caching: true
    multimodal: false
    description: "Qwen2.5 72B 指令模型，高性能高精度"

  # ==================== 通义千问 2.5 视觉语言模型 ====================

  # Qwen2.5-VL 7B 多模态模型（VL 权重 + 视觉侧占显存大，单卡 16GB 级往往无法同时 32K 上下文，默认 8K；更大显存可调高 max_model_len）
  qwen2.5-vl-7b:
    path: "./models/Qwen2.5-VL-7B-Instruct"
    served_model_name: "qwen2.5-vl-7b-instruct"
    dtype: "float16"
    max_model_len: 8192
    enforce_eager: true
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.92
    max_num_seqs: 8
    max_num_batched_tokens: 8192
    enable_prefix_caching: true
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen2.5-VL 7B 多模态模型，支持图像和视频理解"

  # Qwen2.5-VL 32B 多模态模型
  qwen2.5-vl-32b:
    path: "./models/Qwen2.5-VL-32B-Instruct"
    served_model_name: "qwen2.5-vl-32b-instruct"
    dtype: "bfloat16"
    max_model_len: 16384
    # enforce_eager: true
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.8
    max_num_seqs: 8
    max_num_batched_tokens: 12288
    enable_prefix_caching: true
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen2.5-VL 32B 多模态模型，更强的视觉理解能力"

  # Qwen2.5-VL 32B AWQ 多模态模型
  qwen2.5-vl-32b-awq:
    path: "./models/Qwen2.5-VL-32B-Instruct-AWQ"
    served_model_name: "qwen2.5-vl-32b-instruct-awq"
    dtype: "half"
    quantization: "awq"
    max_model_len: 40960
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.8
    max_num_seqs: 16
    max_num_batched_tokens: 12288
    enable_prefix_caching: true
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen2.5-VL 32B AWQ 多模态模型，兼顾效果与显存占用"

  # Qwen2.5-VL 72B AWQ 多模态模型
  # 官方 AWQ 已 padding intermediate_size=29696，支持 TP=1/2/4/8；双卡 64GB 推荐 TP=2，四卡 80GB 可升至 TP=4
  qwen2.5-vl-72b-awq:
    path: "./models/Qwen2.5-VL-72B-Instruct-AWQ"
    served_model_name: "qwen2.5-vl-72b-instruct-awq"
    dtype: "half"
    quantization: "awq"
    max_model_len: 32768
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.85
    max_num_seqs: 8
    max_num_batched_tokens: 12288
    enable_prefix_caching: true
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen2.5-VL 72B AWQ 多模态模型，兼顾效果与显存占用"


  # ==================== 通义千问 3 语言模型 =======================

  # Qwen3 8B 指令模型（BF16 权重约 16GiB；单卡 24G 宜控制上下文，更大显存或双卡可上调 max_model_len）
  # 昇腾 310P：须 enforce_eager，否则 ACL Graph capture 常失败（driver/firmware 与 ACL Graph 不匹配时尤甚）
  # Qwen3-8B 指令模型（310P 单芯 TP=1；比 14B 更轻，图加速同款配置）
  # 昇腾 310P：float16 + block_size=128；单流延迟优先 TP=1
  # 性能：关 enforce_eager + FULL_DECODE_ONLY 图加速；关 thinking；util=0.90
  # 若 ACL Graph 启动失败，改回 enforce_eager: true 并去掉 compilation_config
  # max_model_len=32K：无压缩 mask 时 mask≈O(L²)，若 OOM 先降 max_num_seqs / util，再降到 16K
  # 权重：Qwen/Qwen3-8B → ./models/Qwen3-8B
  qwen3-8b:
    path: "./models/Qwen3-8B"
    served_model_name: "qwen3-8b"
    dtype: "float16"
    enforce_eager: false
    block_size: 128
    max_model_len: 32768
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.90
    max_num_seqs: 8
    max_num_batched_tokens: 8192
    enable_prefix_caching: true
    compilation_config:
      cudagraph_mode: "FULL_DECODE_ONLY"
      cudagraph_capture_sizes: [1, 2, 4, 8, 16]
    additional_config:
      ascend_compilation_config:
        fuse_norm_quant: false
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal: false
    description: "Qwen3-8B 文本对话（310P：float16 / TP=1 / 32K / decode 图加速 / 默认关 thinking）"

# qwen3-8b备份
#  qwen3-8b:
#    path: "./models/Qwen3-8B"
#    served_model_name: "qwen3-8b"
#    dtype: "bfloat16"
#    max_model_len: 8192
#    tensor_parallel_size: 1
#    gpu_memory_utilization: 0.80
#    max_num_seqs: 16
#    max_num_batched_tokens: 8192
#    enable_prefix_caching: true
#    attention-backend: flash_attn
#    default-chat-template-kwargs:
#      enable_thinking: false
#    multimodal: false
#    description: "Qwen3-8B 文本对话（原生 32K；单卡 24G BF16 默认 8K 上下文）"

  # Qwen3 8B AWQ（单卡 RTX 3090 24GB 推荐；权重约 6GiB，较 BF16 更易留出 KV 或与 GPU embed/rerank 同机）
  qwen3-8b-awq:
    path: "./models/Qwen3-8B-AWQ"
    served_model_name: "qwen3-8b-awq"
    dtype: "half"
    quantization: "awq"
    max_model_len: 16384
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.80
    max_num_seqs: 16
    max_num_batched_tokens: 8192
    enable_prefix_caching: true
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal: false
    description: "Qwen3-8B-AWQ，单卡 3090 24G 文本对话（16K 上下文；与 models-app GPU RAG 同机时可再降 gpu_memory_utilization）"

  # Qwen3 14B 指令模型（FP16 权重约 28GiB；310P 单芯 ~48G 可 TP=1）
  # 昇腾 310P：float16 + block_size=128；单流延迟优先 TP=1
  # 性能：关 enforce_eager + FULL_DECODE_ONLY 图加速；关 thinking；util=0.90
  # 若 ACL Graph 启动失败，改回 enforce_eager: true 并去掉 compilation_config
  # max_model_len=32K：无压缩 mask 时 mask≈O(L²)，若 OOM 先降 max_num_seqs / util，再降到 16K
  # 权重：Qwen/Qwen3-14B → ./models/Qwen3-14B
  qwen3-14b:
    path: "./models/Qwen3-14B"
    served_model_name: "qwen3-14b"
    dtype: "float16"
    enforce_eager: false
    block_size: 128
    max_model_len: 32768
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.90
    max_num_seqs: 8
    max_num_batched_tokens: 8192
    enable_prefix_caching: true
    compilation_config:
      cudagraph_mode: "FULL_DECODE_ONLY"
      cudagraph_capture_sizes: [1, 2, 4, 8, 16]
    additional_config:
      ascend_compilation_config:
        fuse_norm_quant: false
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal: false
    description: "Qwen3-14B 文本对话（310P：float16 / TP=1 / 32K / decode 图加速 / 默认关 thinking）"

  # Qwen3-14B Ascend W8A8SC（310P 官方推荐量化；吞吐/显存优于 FP16）
  # 权重：Eco-Tech/Qwen3-14B-w8a8sc-310-vllm → 下载后取 TP1 子目录挂到下方 path
  #   https://www.modelscope.cn/models/Eco-Tech/Qwen3-14B-w8a8sc-310-vllm
  # 官方：load_format=sharded_state + FULL_DECODE_ONLY；若 Graph 失败再改回 enforce_eager
  # max_model_len=32K；OOM 时先降 max_num_seqs / util
  qwen3-14b-w8a8sc:
    path: "./models/Qwen3-14B-w8a8sc-310-vllm-tp1"
    served_model_name: "qwen3-14b-w8a8sc"
    dtype: "float16"
    quantization: "ascend"
    load_format: "sharded_state"
    enforce_eager: false
    block_size: 128
    max_model_len: 32768
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.92
    max_num_seqs: 8
    max_num_batched_tokens: 8192
    enable_prefix_caching: false
    compilation_config:
      cudagraph_mode: "FULL_DECODE_ONLY"
      cudagraph_capture_sizes: [1, 2, 4, 8, 16]
    additional_config:
      ascend_compilation_config:
        fuse_norm_quant: false
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal: false
    description: "Qwen3-14B W8A8SC-310；TP=1 / ascend / 32K / decode 图加速 / 默认关 thinking"

  # Qwen3 14B AWQ（单卡 RTX 3090 24GB；权重约 8–9GiB）
  qwen3-14b-awq:
    path: "./models/Qwen3-14B-AWQ"
    served_model_name: "qwen3-14b-awq"
    dtype: "half"
    quantization: "awq"
    max_model_len: 8192
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.80
    max_num_seqs: 12
    max_num_batched_tokens: 8192
    enable_prefix_caching: true
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal: false
    description: "Qwen3-14B-AWQ，单卡 3090 24G 文本对话（8K 上下文；OOM 时可再降 max_model_len）"


  # ==================== 通义千问 3 视觉语言模型 ====================

  # Qwen3-VL 32B 多模态模型
  qwen3-vl-32b:
    path: "./models/Qwen3-VL-32B-Instruct"
    served_model_name: "qwen3-vl-32b-instruct"
    dtype: "bfloat16"
    max_model_len: 8192
    enforce_eager: true
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.92
    max_num_seqs: 8
    max_num_batched_tokens: 8192
    enable_prefix_caching: true
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 2
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen3-VL 32B 多模态模型，最新的视觉语言能力"

  # ==================== 通义千问 3.6 多模态（Atlas 300I Duo 现场）====================
  # 硬件约定（README-DEPLOY-ASCEND / 四卡切分）：vLLM 独占物理卡0+卡1 → ASCEND_RT_VISIBLE_DEVICES=0,1,2,3（4 逻辑 NPU / ~192GB）
  # 本预设 tensor_parallel_size=4，用满上述 4 个设备；.env 中 TENSOR_PARALLEL_SIZE 勿小于 4（否则会盖过预设）
  # 310P：勿用 bfloat16；开 prefix caching 时 block_size=128；勿配 attention-backend / 启动期 default-chat-template-kwargs（vllm-ascend CLI 不认）
  # 官方 FP16：Qwen/Qwen3.6-27B；310P 量化用 Eco-Tech/Qwen3.6-27B-W8A8-310P（勿用 HF FP8 / 勿用非-310P 的 w8a8）
  # 底座：vllm-ascend:v0.23.0-310p（CANN 9.1.0）

  # Qwen3.6-27B 原生多模态（FP16；权重体量大，双 Duo / 四芯 TP=4）
  qwen3.6-27b:
    path: "./models/Qwen3.6-27B"
    served_model_name: "qwen3.6-27b"
    dtype: "float16"
    enforce_eager: true
    block_size: 128
    max_model_len: 32768
    tensor_parallel_size: 4
    gpu_memory_utilization: 0.90
    max_num_seqs: 8
    max_num_batched_tokens: 8192
    enable_prefix_caching: true
    # MTP配置(草稿模型，提高推理效率)
    # speculative-config: '{"method":"qwen3_5_mtp","num_speculative_tokens":1}'
    # 关闭思考请在 API extra_body.chat_template_kwargs.enable_thinking=false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen3.6-27B 多模态；Atlas 300I Duo×2（设备 0–3）TP=4 / FP16 / 8K；面向昇腾 310P"

  # ---------- Qwen3.6-27B-FP8（已禁用，仅保留作对照）----------
  # 说明：HuggingFace 细粒度 FP8（亦称 FB8）+ quantization: fp8 在当前 Ascend 310P / vllm-ascend:v0.23.0-310p 上不可用。
  # 实测失败：create_weights → init_fp8_linear_kernel → choose_scaled_mm_linear_kernel
  #            KeyError: <PlatformEnum.OOT: 6>
  # 原因：Ascend 为 OOT 平台，vLLM 通用 FP8 scaled_mm 内核表无该平台条目；改 dtype/max_model_len 无法绕过。
  # 310P 量化请改用下方 qwen3.6-27b-w8a8（Eco-Tech W8A8 + quantization: ascend）；日常优先 qwen3.6-27b（FP16）。
  # qwen3.6-27b-fp8:
  #   path: "./models/Qwen3.6-27B-FP8"
  #   served_model_name: "qwen3.6-27b-fp8"
  #   dtype: "float16"
  #   quantization: "fp8"
  #   enforce_eager: true
  #   block_size: 128
  #   max_model_len: 16384
  #   tensor_parallel_size: 4
  #   gpu_memory_utilization: 0.90
  #   max_num_seqs: 8
  #   max_num_batched_tokens: 8192
  #   enable_prefix_caching: true
  #   multimodal:
  #     enabled: true
  #     limit_images: 4
  #     limit_videos: 1
  #     media_paths:
  #       - "./images"
  #       - "./videos"
  #   description: "（禁用）HF FP8；310P/vllm-ascend 报 PlatformEnum.OOT，请用 qwen3.6-27b 或 qwen3.6-27b-w8a8"

  # Qwen3.6-27B Ascend W8A8（310P 专用；替代不可用的 HF FP8）
  # 重要：勿用 Eco-Tech/Qwen3.6-27B-w8a8（ViT 也被 W8A8_DYNAMIC，310P profile 会报
  #   Bias dtype should be INT32, actual dtype is DT_FLOAT16 / npu_quant_matmul 161002）
  # 须用 310P 权重：Eco-Tech/Qwen3.6-27B-W8A8-310P（visual 保持 FLOAT）
  #   https://www.modelscope.cn/models/Eco-Tech/Qwen3.6-27B-W8A8-310P
  # 下载到 ./models/Qwen3.6-27B-W8A8-310P；须 quantization: ascend（勿用 fp8）
  # 参考：https://github.com/vllm-project/vllm-ascend/issues/14152
  # 310P：本模型（GDN/Mamba 混合 + TP=4）开 FULL_DECODE_ONLY 会在 Capturing CUDA graphs
  #   阶段失败（AclmdlRICaptureEnd 507903 / event resources insufficient）；须 enforce_eager
  # 仍保留：关 thinking、util=0.92（图加速不可用）
  qwen3.6-27b-w8a8:
    path: "./models/Qwen3.6-27B-W8A8-310P"
    served_model_name: "qwen3.6-27b-w8a8"
    dtype: "float16"
    quantization: "ascend"
    enforce_eager: true
    block_size: 128
    max_model_len: 32768
    tensor_parallel_size: 4
    gpu_memory_utilization: 0.92
    max_num_seqs: 8
    max_num_batched_tokens: 8192
    enable_prefix_caching: true
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen3.6-27B W8A8-310P；Duo×2 TP=4 / ascend / 32K / enforce_eager（310P 不支持本模型图加速）/ 默认关 thinking"

  # ---------- Qwen3-30B-A3B（文本 MoE；激活约 3B，310P 吞吐优于稠密 27B）----------
  # 官方：https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/Qwen3-30B-A3B.html
  # 权重：Qwen/Qwen3-30B-A3B；310P 须 float16 + enforce_eager；现场四芯 TP=4
  # 310P 不支持 EP（vllm_ascend/_310p/fused_moe 会直接报错）；勿加 --enable-expert-parallel（A2/A3 文档里的 EP 不适用于 310P）
  # max_model_len：310P 无压缩 mask 时 mask≈O(L²)，64K 易 OOM；32K 为长上下文务实上限，成功后再试 48K
  # 长上下文请压低 max_num_seqs；启动日志看 Available KV / concurrency，满长度并发≥2 再考虑加长
  qwen3-30b-a3b:
    path: "./models/Qwen3-30B-A3B"
    served_model_name: "qwen3-30b-a3b"
    dtype: "float16"
    enforce_eager: true
    block_size: 128
    max_model_len: 32768
    tensor_parallel_size: 4
    gpu_memory_utilization: 0.88
    max_num_seqs: 8
    max_num_batched_tokens: 8192
    enable_prefix_caching: true
    multimodal: false
    description: "Qwen3-30B-A3B 文本 MoE；310P float16 / TP=4（无 EP）/ 32K / enforce_eager"

  # Qwen3-30B-A3B Ascend W8A8（310P 推荐量化；QuaRot）
  # 权重：Eco-Tech/Qwen3-30B-A3B-w8a8-QuaRot-310（以 ModelScope 实际仓库名为准）
