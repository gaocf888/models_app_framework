# 配置优先级2
# 当前vllm-deploy/ 的全部配置文件如下（按照配置生效优先级排序）：
# .env
# config/models.yaml
# config/vllm.yaml

# 模型预设配置
presets:
  # ==================== 通义千问 2.5 系列 ====================

  # Qwen2.5 7B 基础模型
  qwen2.5-7b:
    path: "./models/Qwen2.5-7B-Instruct"
    served_model_name: "qwen2.5-7b-instruct"
    dtype: "float16"
    max_model_len: 32768
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.85
    max_num_seqs: 32
    max_num_batched_tokens: 32768
    enable_prefix_caching: true
    multimodal: false
    description: "Qwen2.5 7B 指令模型，适合通用对话"

  # Qwen2.5 14B 模型
  qwen2.5-14b:
    path: "./models/Qwen2.5-14B-Instruct"
    served_model_name: "qwen2.5-14b-instruct"
    dtype: "bfloat16"
    max_model_len: 32768
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.85
    max_num_seqs: 24
    max_num_batched_tokens: 24576
    enable_prefix_caching: true
    multimodal: false
    description: "Qwen2.5 14B 指令模型，平衡性能与效果"

  # Qwen2.5 14B AWQ 模型
  qwen2.5-14b-awq:
    path: "./models/Qwen2.5-14B-Instruct-AWQ"
    served_model_name: "qwen2.5-14b-instruct-awq"
    dtype: "half"
    quantization: "awq"
    max_model_len: 32768
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.85
    max_num_seqs: 32
    max_num_batched_tokens: 24576
    enable_prefix_caching: true
    multimodal: false
    description: "Qwen2.5 14B AWQ 指令模型，适合单卡高吞吐文本任务"

  # Qwen2.5 72B 模型
  qwen2.5-72b:
    path: "./models/Qwen2.5-72B-Instruct"
    served_model_name: "qwen2.5-72b-instruct"
    dtype: "bfloat16"
    max_model_len: 32768
    tensor_parallel_size: 4
    gpu_memory_utilization: 0.85
    max_num_seqs: 16
    max_num_batched_tokens: 16384
    enable_prefix_caching: true
    multimodal: false
    description: "Qwen2.5 72B 指令模型，高性能高精度"

  # ==================== 通义千问 2.5 视觉语言模型 ====================

  # Qwen2.5-VL 7B 多模态模型（VL 权重 + 视觉侧占显存大，单卡 16GB 级往往无法同时 32K 上下文，默认 8K；更大显存可调高 max_model_len）
  qwen2.5-vl-7b:
    path: "./models/Qwen2.5-VL-7B-Instruct"
    served_model_name: "qwen2.5-vl-7b-instruct"
    dtype: "float16"
    max_model_len: 8192
    enforce_eager: true
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.92
    max_num_seqs: 8
    max_num_batched_tokens: 8192
    enable_prefix_caching: true
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen2.5-VL 7B 多模态模型，支持图像和视频理解"

  # Qwen2.5-VL 32B 多模态模型
  qwen2.5-vl-32b:
    path: "./models/Qwen2.5-VL-32B-Instruct"
    served_model_name: "qwen2.5-vl-32b-instruct"
    dtype: "bfloat16"
    max_model_len: 16384
    # enforce_eager: true
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.8
    max_num_seqs: 8
    max_num_batched_tokens: 12288
    enable_prefix_caching: true
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen2.5-VL 32B 多模态模型，更强的视觉理解能力"

  # Qwen2.5-VL 32B AWQ 多模态模型
  qwen2.5-vl-32b-awq:
    path: "./models/Qwen2.5-VL-32B-Instruct-AWQ"
    served_model_name: "qwen2.5-vl-32b-instruct-awq"
    dtype: "half"
    quantization: "awq"
    max_model_len: 40960
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.7
    max_num_seqs: 16
    max_num_batched_tokens: 12288
    enable_prefix_caching: true
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen2.5-VL 32B AWQ 多模态模型，兼顾效果与显存占用"

  # Qwen2.5-VL 72B AWQ 多模态模型
  # 官方 AWQ 已 padding intermediate_size=29696，支持 TP=1/2/4/8；双卡 64GB 推荐 TP=2，四卡 80GB 可升至 TP=4
  qwen2.5-vl-72b-awq:
    path: "./models/Qwen2.5-VL-72B-Instruct-AWQ"
    served_model_name: "qwen2.5-vl-72b-instruct-awq"
    dtype: "half"
    quantization: "awq"
    max_model_len: 32768
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.85
    max_num_seqs: 8
    max_num_batched_tokens: 12288
    enable_prefix_caching: true
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen2.5-VL 72B AWQ 多模态模型，兼顾效果与显存占用"

  # ==================== 通义千问 3 视觉语言模型 ====================

  # Qwen3-VL 32B 多模态模型
  qwen3-vl-32b:
    path: "./models/Qwen3-VL-32B-Instruct"
    served_model_name: "qwen3-vl-32b-instruct"
    dtype: "bfloat16"
    max_model_len: 8192
    enforce_eager: true
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.92
    max_num_seqs: 8
    max_num_batched_tokens: 8192
    enable_prefix_caching: true
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 2
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen3-VL 32B 多模态模型，最新的视觉语言能力"

  # Qwen3.5 27B 原生多模态模型
#  qwen3-27b:
#    path: "./models/Qwen3.5-27B"
#    served_model_name: "qwen3.5-27b"
#    dtype: "bfloat16"
#    # 两张 64GB 显卡下，提升多轮长上下文能力；并发适当收敛以平衡显存占用
#    max_model_len: 16384
#    enforce_eager: true
#    tensor_parallel_size: 2
#    gpu_memory_utilization: 0.88
#    max_num_seqs: 4
#    max_num_batched_tokens: 12288
#    enable_prefix_caching: true
#    multimodal:
#      enabled: true
#      limit_images: 4
#      limit_videos: 1
#      media_paths:
#        - "./images"
#        - "./videos"
#    description: "Qwen3.5 27B 原生多模态模型，支持图像理解与多轮对话"

  # Qwen3.5 27B 原生多模态模型
  qwen3-27b:
    path: "./models/Qwen3.5-27B"
    served_model_name: "qwen3.5-27b"
    dtype: "half"
    # 两张 64GB 显卡下，提升多轮长上下文能力；并发适当收敛以平衡显存占用
    max_model_len: 16384
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.8
    max_num_seqs: 128
    max_num_batched_tokens: 12288
    enable_prefix_caching: true
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen3.5 27B 原生多模态模型，支持图像理解与多轮对话"

  # ==================== 通义千问 3.6 系列 ====================

  # Qwen3.6 27B（BF16/FP16，原生多模态 + Gated DeltaNet）
  # 沐曦 N260 双卡 64GB 推荐本预设。官方 FP8 权重能加载，但 MXN260 上 W8A8 Block FP8 Triton 内核编译失败
  # （fp8_utils.w8a8_triton_block_scaled_mm → PassManager::run failed / llvm.intr.fmuladd i8）
  # 参数对齐已验证的 qwen3-27b（Qwen3.5-27B）；hybrid 关闭 prefix caching，eager 降低 compile 风险
  # 下面是 qwen3.6-27b 部署在 RTX 4090的配置备份
#  qwen3.6-27b:
#    path: "./models/Qwen3.6-27B"
#    served_model_name: "qwen3.6-27b"
#    dtype: "half"
#    max_model_len: 40960
#    enforce_eager: false
#    tensor_parallel_size: 2
#    gpu_memory_utilization: 0.8
#    max_num_seqs: 16
#    max_num_batched_tokens: 12288
#    enable_prefix_caching: false
#    attention-backend: flash_attn
#    default-chat-template-kwargs:
#      enable_thinking: false
#    multimodal:
#      enabled: true
#      limit_images: 4
#      limit_videos: 1
#      media_paths:
#        - "./images"
#        - "./videos"
#    description: "Qwen3.6 27B 原生多模态，N260 双卡 64G 推荐预设（非 FP8）"
  # 下面是 qwen3.6-27b 部署在 沐曦N260的配置
  qwen3.6-27b:
    path: "./models/Qwen3.6-27B"
    served_model_name: "qwen3.6-27b"
    dtype: "half"
    max_model_len: 40960
    enforce_eager: true
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.8
    max_num_seqs: 16
    max_num_batched_tokens: 12288
    enable_prefix_caching: false
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen3.6 27B 原生多模态，N260 双卡 64G 推荐预设（非 FP8）"

  # Qwen3.6 27B AWQ（4-bit；原生多模态 + Gated DeltaNet）
  # 沐曦 N260 双卡 64GB 量化推荐：vllm_metax 已注册 MacaAWQConfig，可替代不可用的官方 FP8
  # AWQ 权重约 14–18GiB，KV 预算大于 BF16；hybrid 关闭 prefix caching，eager 降低 compile 风险
  qwen3.6-27b-awq:
    path: "./models/Qwen3.6-27B-AWQ"
    served_model_name: "qwen3.6-27b-awq"
    dtype: "half"
    quantization: "awq"
    max_model_len: 32768
    enforce_eager: true
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.8
    max_num_seqs: 16
    max_num_batched_tokens: 12288
    enable_prefix_caching: false
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen3.6 27B AWQ 原生多模态，N260 双卡 64G 量化推荐预设"

  # Qwen3.6 27B FP8（官方细粒度 FP8 W8A8，block size 128；原生多模态 + Gated DeltaNet）
  # ⚠️ 沐曦 N260 + vllm_metax 0.17：权重可加载（quantization=fp8），profile_run 时 Triton 编译 W8A8 Block FP8 失败
  #    缺 MXN260 kernel config，且 metax compiler 不支持该 kernel（Expected f32 but got i8 / PassManager::run failed）
  #    无法通过 YAML 绕过，N260 请改用 qwen3.6-27b 或 qwen3.6-27b-awq。本预设仅适用于 NVIDIA 等已有 FP8 GEMM 的平台
  qwen3.6-27b-fp8:
    path: "./models/Qwen3.6-27B-FP8"
    served_model_name: "qwen3.6-27b-fp8"
    dtype: "auto"
    max_model_len: 16384
    enforce_eager: true
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.7
    max_num_seqs: 16
    max_num_batched_tokens: 12288
    enable_prefix_caching: false
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen3.6 27B FP8 原生多模态（沐曦 N260 不可用，请用 qwen3.6-27b 或 qwen3.6-27b-awq）"

  # Qwen3.5 35B-A3B MoE 多模态模型（256 专家 / 每 token 约 3B 激活）
  # 沐曦 N260 双卡 64GB：TP=2 + Expert Parallel；FP16 权重约 70GB，双卡可支撑 32K 上下文与高并发
  qwen3.5-35b-a3b:
    path: "./models/Qwen3.5-35B-A3B"
    served_model_name: "qwen3.5-35b-a3b"
    dtype: "half"
    enforce_eager: true
    max_model_len: 32768
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.85
    max_num_seqs: 64
    max_num_batched_tokens: 16384
    enable_prefix_caching: true
    enable_expert_parallel: true
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen3.5 35B-A3B MoE 多模态，N260 双卡 64G 推荐预设（TP2+EP，32K 上下文）"

  # Qwen3.5 35B-A3B FP8（官方细粒度 FP8 量化，权重约 35GiB，精度接近 BF16）
  # ⚠️ 平台限制：沐曦 vllm_metax 当前未实现 FP8 MoE 内核（backend_to_kernel_cls -> NotImplementedError）
  #    N260/mthreads 请改用 qwen3.5-35b-a3b（FP16）或 qwen3.5-35b-a3b-awq；本预设仅适用于 NVIDIA 等支持 FP8 MoE 的平台
  qwen3.5-35b-a3b-fp8:
    path: "./models/Qwen3.5-35B-A3B-FP8"
    served_model_name: "qwen3.5-35b-a3b-fp8"
    dtype: "auto"
    enforce_eager: true
    max_model_len: 65536
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.88
    max_num_seqs: 96
    max_num_batched_tokens: 20480
    enable_prefix_caching: true
    enable_expert_parallel: true
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen3.5 35B-A3B FP8 多模态（仅 NVIDIA 等平台；沐曦 N260 不可用，请用 a3b 或 awq 预设）"

  # Qwen3.5 35B-A3B GPTQ-Int4（官方 4-bit GPTQ 量化，权重约 22GiB）
  # MoE + GPTQ 须使用 vLLM 的 moe_wna16（勿用 quantization: gptq）；沐曦 N260 双卡 64GB 推荐 TP2+EP
  qwen3.5-35b-a3b-gptq-int4:
    path: "./models/Qwen3.5-35B-A3B-GPTQ-Int4"
    served_model_name: "qwen3.5-35b-a3b-gptq-int4"
    dtype: "half"
    quantization: "moe_wna16"
    enforce_eager: true
    max_model_len: 40960
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.88
    max_num_seqs: 96
    max_num_batched_tokens: 20480
    enable_prefix_caching: true
    enable_expert_parallel: true
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen3.5 35B-A3B GPTQ-Int4 多模态，N260 双卡 64G 预设（moe_wna16，TP2+EP）"

  # Qwen3.5 35B-A3B AWQ（约 25GiB 权重，显存更宽裕，可进一步提高上下文或并发）
  qwen3.5-35b-a3b-awq:
    path: "./models/Qwen3.5-35B-A3B-AWQ"
    served_model_name: "qwen3.5-35b-a3b-awq"
    dtype: "half"
    quantization: "awq"
    max_model_len: 40960
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.88
    max_num_seqs: 96
    max_num_batched_tokens: 20480
    enable_prefix_caching: true
    enable_expert_parallel: true
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen3.5 35B-A3B AWQ 多模态，N260 双卡 64G 高上下文/高并发预设"

  # ==================== 额外常用模型 ====================

  # Llama 3 8B
  llama3-8b:
    path: "./models/Meta-Llama-3-8B-Instruct"
    served_model_name: "llama3-8b-instruct"
    dtype: "bfloat16"
    max_model_len: 8192
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.85
    max_num_seqs: 32
    max_num_batched_tokens: 32768
    enable_prefix_caching: true
    multimodal: false
    description: "Meta Llama 3 8B 指令模型"

  # Llama 3 70B
  llama3-70b:
    path: "./models/Meta-Llama-3-70B-Instruct"
    served_model_name: "llama3-70b-instruct"
    dtype: "bfloat16"
    max_model_len: 8192
    tensor_parallel_size: 4
    gpu_memory_utilization: 0.85
    max_num_seqs: 16
    max_num_batched_tokens: 16384
    enable_prefix_caching: true
    multimodal: false
    description: "Meta Llama 3 70B 指令模型"

  # DeepSeek V2 Lite
  deepseek-v2-lite:
    path: "./models/DeepSeek-V2-Lite-Chat"
    served_model_name: "deepseek-v2-lite-chat"
    dtype: "bfloat16"
    max_model_len: 16384
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.85
    max_num_seqs: 16
    max_num_batched_tokens: 16384
    enable_prefix_caching: true
    multimodal: false
    description: "DeepSeek V2 Lite 对话模型"

# 当前使用的模型预设
active: "qwen2.5-vl-7b"