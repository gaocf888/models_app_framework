# 配置优先级2
# 当前vllm-deploy/ 的全部配置文件如下（按照配置生效优先级排序）：
# .env
# config/models.yaml
# config/vllm.yaml

# 模型预设配置
presets:
  # ==================== 通义千问 2.5 系列 ====================

  # Qwen2.5 7B 基础模型
  qwen2.5-7b:
    path: "./models/Qwen2.5-7B-Instruct"
    served_model_name: "qwen2.5-7b-instruct"
    dtype: "float16"
    max_model_len: 32768
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.85
    max_num_seqs: 32
    max_num_batched_tokens: 32768
    enable_prefix_caching: true
    multimodal: false
    description: "Qwen2.5 7B 指令模型，适合通用对话"

  # Qwen2.5 14B 模型
  qwen2.5-14b:
    path: "./models/Qwen2.5-14B-Instruct"
    served_model_name: "qwen2.5-14b-instruct"
    dtype: "bfloat16"
    max_model_len: 32768
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.85
    max_num_seqs: 24
    max_num_batched_tokens: 24576
    enable_prefix_caching: true
    multimodal: false
    description: "Qwen2.5 14B 指令模型，平衡性能与效果"

  # Qwen2.5 14B Instruct AWQ（单卡 RTX 3090 24GB 推荐，权重约 9GiB，较 32B AWQ 更易留出 KV 与并发）
  # 与 models-app 同机时：建议嵌入/重排 EMBEDDING_DEVICE=cpu、RAG_RERANKER_DEVICE=cpu，GPU 主要给 vLLM
  qwen2.5-14b-awq:
    path: "./models/Qwen2.5-14B-Instruct-AWQ"
    served_model_name: "qwen2.5-14b-instruct-awq"
    dtype: "half"
    quantization: "awq"
    max_model_len: 8192
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.73
    max_num_seqs: 8
    max_num_batched_tokens: 4096
    enable_prefix_caching: true
    attention-backend: flash_attn
    multimodal: false
    description: "Qwen2.5-14B-Instruct-AWQ，单卡 3090 24G 文本对话（16K 上下文；OOM 时可降 max_model_len 至 8192）"

  # Qwen2.5 32B AWQ 模型（单卡 RTX 3090 24GB 推荐预设）
  # AWQ 权重约 18GiB，24G 卡 KV 余量很小；vLLM 实测可用 KV≈1.25GiB 时 max_model_len 宜≤4096（估上限约 5120）
  qwen2.5-32b-awq:
    path: "./models/Qwen2.5-32B-Instruct-AWQ"
    served_model_name: "qwen2.5-32b-instruct-awq"
    dtype: "half"
    quantization: "awq"
    max_model_len: 4096
    enforce_eager: true
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.93
    max_num_seqs: 4
    max_num_batched_tokens: 4096
    enable_prefix_caching: false
    attention-backend: flash_attn
    multimodal: false
    description: "Qwen2.5 32B AWQ，单卡 3090 24G（4K 上下文；OOM 时可再降 max_model_len 或关闭其他占显存进程）"

  # Qwen2.5 72B 模型
  qwen2.5-72b:
    path: "./models/Qwen2.5-72B-Instruct"
    served_model_name: "qwen2.5-72b-instruct"
    dtype: "bfloat16"
    max_model_len: 32768
    tensor_parallel_size: 4
    gpu_memory_utilization: 0.85
    max_num_seqs: 16
    max_num_batched_tokens: 16384
    enable_prefix_caching: true
    multimodal: false
    description: "Qwen2.5 72B 指令模型，高性能高精度"

  # ==================== 通义千问 2.5 视觉语言模型 ====================

  # Qwen2.5-VL 7B 多模态模型（VL 权重 + 视觉侧占显存大，单卡 16GB 级往往无法同时 32K 上下文，默认 8K；更大显存可调高 max_model_len）
  qwen2.5-vl-7b:
    path: "./models/Qwen2.5-VL-7B-Instruct"
    served_model_name: "qwen2.5-vl-7b-instruct"
    dtype: "float16"
    max_model_len: 8192
    enforce_eager: true
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.92
    max_num_seqs: 8
    max_num_batched_tokens: 8192
    enable_prefix_caching: true
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen2.5-VL 7B 多模态模型，支持图像和视频理解"

  # Qwen2.5-VL 32B 多模态模型
  qwen2.5-vl-32b:
    path: "./models/Qwen2.5-VL-32B-Instruct"
    served_model_name: "qwen2.5-vl-32b-instruct"
    dtype: "bfloat16"
    max_model_len: 16384
    # enforce_eager: true
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.8
    max_num_seqs: 8
    max_num_batched_tokens: 12288
    enable_prefix_caching: true
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen2.5-VL 32B 多模态模型，更强的视觉理解能力"

  # Qwen2.5-VL 32B AWQ 多模态模型
  qwen2.5-vl-32b-awq:
    path: "./models/Qwen2.5-VL-32B-Instruct-AWQ"
    served_model_name: "qwen2.5-vl-32b-instruct-awq"
    dtype: "half"
    quantization: "awq"
    max_model_len: 40960
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.8
    max_num_seqs: 16
    max_num_batched_tokens: 12288
    enable_prefix_caching: true
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen2.5-VL 32B AWQ 多模态模型，兼顾效果与显存占用"

  # Qwen2.5-VL 72B AWQ 多模态模型
  # 官方 AWQ 已 padding intermediate_size=29696，支持 TP=1/2/4/8；双卡 64GB 推荐 TP=2，四卡 80GB 可升至 TP=4
  qwen2.5-vl-72b-awq:
    path: "./models/Qwen2.5-VL-72B-Instruct-AWQ"
    served_model_name: "qwen2.5-vl-72b-instruct-awq"
    dtype: "half"
    quantization: "awq"
    max_model_len: 32768
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.85
    max_num_seqs: 8
    max_num_batched_tokens: 12288
    enable_prefix_caching: true
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen2.5-VL 72B AWQ 多模态模型，兼顾效果与显存占用"


  # ==================== 通义千问 3 语言模型 =======================

  # Qwen3 8B 指令模型（BF16 权重约 16GiB；单卡 24G 宜控制上下文，更大显存或双卡可上调 max_model_len）
  # 昇腾 310P：须 enforce_eager，否则 ACL Graph capture 常失败（driver/firmware 与 ACL Graph 不匹配时尤甚）
  qwen3-8b:
    path: "./models/Qwen3-8B"
    served_model_name: "qwen3-8b"
    dtype: "float16"
    enforce_eager: true
    block_size: 128
    max_model_len: 8192
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.80
    max_num_seqs: 16
    max_num_batched_tokens: 8192
    enable_prefix_caching: true
#    attention-backend: flash_attn
#    default-chat-template-kwargs:
#      enable_thinking: false
    multimodal: false
    description: "Qwen3-8B 文本对话（昇腾 310P：float16 + enforce_eager + block_size=128）"

# qwen3-8b备份
#  qwen3-8b:
#    path: "./models/Qwen3-8B"
#    served_model_name: "qwen3-8b"
#    dtype: "bfloat16"
#    max_model_len: 8192
#    tensor_parallel_size: 1
#    gpu_memory_utilization: 0.80
#    max_num_seqs: 16
#    max_num_batched_tokens: 8192
#    enable_prefix_caching: true
#    attention-backend: flash_attn
#    default-chat-template-kwargs:
#      enable_thinking: false
#    multimodal: false
#    description: "Qwen3-8B 文本对话（原生 32K；单卡 24G BF16 默认 8K 上下文）"

  # Qwen3 8B AWQ（单卡 RTX 3090 24GB 推荐；权重约 6GiB，较 BF16 更易留出 KV 或与 GPU embed/rerank 同机）
  qwen3-8b-awq:
    path: "./models/Qwen3-8B-AWQ"
    served_model_name: "qwen3-8b-awq"
    dtype: "half"
    quantization: "awq"
    max_model_len: 16384
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.80
    max_num_seqs: 16
    max_num_batched_tokens: 8192
    enable_prefix_caching: true
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal: false
    description: "Qwen3-8B-AWQ，单卡 3090 24G 文本对话（16K 上下文；与 models-app GPU RAG 同机时可再降 gpu_memory_utilization）"


  # ==================== 通义千问 3 视觉语言模型 ====================

  # Qwen3-VL 32B 多模态模型
  qwen3-vl-32b:
    path: "./models/Qwen3-VL-32B-Instruct"
    served_model_name: "qwen3-vl-32b-instruct"
    dtype: "bfloat16"
    max_model_len: 8192
    enforce_eager: true
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.92
    max_num_seqs: 8
    max_num_batched_tokens: 8192
    enable_prefix_caching: true
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 2
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen3-VL 32B 多模态模型，最新的视觉语言能力"

  # ==================== 通义千问 3.6 多模态（Atlas 300I Duo 现场）====================
  # 硬件约定（README-DEPLOY-ASCEND / 四卡切分）：vLLM 独占物理卡0+卡1 → ASCEND_RT_VISIBLE_DEVICES=0,1,2,3（4 逻辑 NPU / ~192GB）
  # 本预设 tensor_parallel_size=4，用满上述 4 个设备；.env 中 TENSOR_PARALLEL_SIZE 勿小于 4（否则会盖过预设）
  # 310P：勿用 bfloat16；开 prefix caching 时 block_size=128；勿配 attention-backend / 启动期 default-chat-template-kwargs（vllm-ascend CLI 不认）
  # 官方模型：Qwen/Qwen3.6-27B 、Qwen/Qwen3.6-27B-FP8（用户口中的 FB8 = FP8）
  # 官方 recipe 要求较新 vLLM；本仓库昇腾默认底座 vllm-ascend:v0.23.0-310p（CANN 9.1.0）

  # Qwen3.6-27B 原生多模态（FP16；权重体量大，双 Duo / 四芯 TP=4）
  qwen3.6-27b:
    path: "./models/Qwen3.6-27B"
    served_model_name: "qwen3.6-27b"
    dtype: "float16"
    enforce_eager: true
    block_size: 128
    max_model_len: 8192
    tensor_parallel_size: 4
    gpu_memory_utilization: 0.88
    max_num_seqs: 4
    max_num_batched_tokens: 8192
    enable_prefix_caching: true
    # 关闭思考请在 API extra_body.chat_template_kwargs.enable_thinking=false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen3.6-27B 多模态；Atlas 300I Duo×2（设备 0–3）TP=4 / FP16 / 8K；面向昇腾 310P"

  # Qwen3.6-27B-FP8（细粒度 FP8；亦称 FB8）多模态，同卡切分下显存更宽裕，可略提高上下文
  qwen3.6-27b-fp8:
    path: "./models/Qwen3.6-27B-FP8"
    served_model_name: "qwen3.6-27b-fp8"
    dtype: "auto"
    quantization: "fp8"
    enforce_eager: true
    block_size: 128
    max_model_len: 16384
    tensor_parallel_size: 4
    gpu_memory_utilization: 0.88
    max_num_seqs: 8
    max_num_batched_tokens: 8192
    enable_prefix_caching: true
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen3.6-27B-FP8 多模态；Atlas 300I Duo×2（设备 0–3）TP=4 / FP8 / 16K；310P 上须确认 vllm-ascend 支持 FP8"

  # Qwen3.5 27B 原生多模态模型
#  qwen3-27b:
#    path: "./models/Qwen3.5-27B"
#    served_model_name: "qwen3.5-27b"
#    dtype: "bfloat16"
#    # 两张 64GB 显卡下，提升多轮长上下文能力；并发适当收敛以平衡显存占用
#    max_model_len: 16384
#    enforce_eager: true
#    tensor_parallel_size: 2
#    gpu_memory_utilization: 0.88
#    max_num_seqs: 4
#    max_num_batched_tokens: 12288
#    enable_prefix_caching: true
#    multimodal:
#      enabled: true
#      limit_images: 4
#      limit_videos: 1
#      media_paths:
#        - "./images"
#        - "./videos"
#    description: "Qwen3.5 27B 原生多模态模型，支持图像理解与多轮对话"

  # Qwen3.5 27B 原生多模态模型
  qwen3-27b:
    path: "./models/Qwen3.5-27B"
    served_model_name: "qwen3.5-27b"
    dtype: "half"
    # 两张 64GB 显卡下，提升多轮长上下文能力；并发适当收敛以平衡显存占用
    max_model_len: 16384
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.8
    max_num_seqs: 128
    max_num_batched_tokens: 12288
    enable_prefix_caching: true
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen3.5 27B 原生多模态模型，支持图像理解与多轮对话"

  # Qwen3.5 35B-A3B MoE 多模态模型（256 专家 / 每 token 约 3B 激活）
  # 沐曦 N260 双卡 64GB：TP=2 + Expert Parallel；FP16 权重约 70GB，双卡可支撑 32K 上下文与高并发
  qwen3.5-35b-a3b:
    path: "./models/Qwen3.5-35B-A3B"
    served_model_name: "qwen3.5-35b-a3b"
    dtype: "half"
    enforce_eager: true
    max_model_len: 32768
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.85
    max_num_seqs: 64
    max_num_batched_tokens: 16384
    enable_prefix_caching: true
    enable_expert_parallel: true
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen3.5 35B-A3B MoE 多模态，N260 双卡 64G 推荐预设（TP2+EP，32K 上下文）"

  # Qwen3.5 35B-A3B FP8（官方细粒度 FP8 量化，权重约 35GiB，精度接近 BF16）
  # ⚠️ 平台限制：沐曦 vllm_metax 当前未实现 FP8 MoE 内核（backend_to_kernel_cls -> NotImplementedError）
  #    N260/mthreads 请改用 qwen3.5-35b-a3b（FP16）或 qwen3.5-35b-a3b-awq；本预设仅适用于 NVIDIA 等支持 FP8 MoE 的平台
  qwen3.5-35b-a3b-fp8:
    path: "./models/Qwen3.5-35B-A3B-FP8"
    served_model_name: "qwen3.5-35b-a3b-fp8"
    dtype: "auto"
    enforce_eager: true
    max_model_len: 65536
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.88
    max_num_seqs: 96
    max_num_batched_tokens: 20480
    enable_prefix_caching: true
    enable_expert_parallel: true
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen3.5 35B-A3B FP8 多模态（仅 NVIDIA 等平台；沐曦 N260 不可用，请用 a3b 或 awq 预设）"

  # Qwen3.5 35B-A3B GPTQ-Int4（官方 4-bit GPTQ 量化，权重约 22GiB）
  # MoE + GPTQ 须使用 vLLM 的 moe_wna16（勿用 quantization: gptq）；沐曦 N260 双卡 64GB 推荐 TP2+EP
  qwen3.5-35b-a3b-gptq-int4:
    path: "./models/Qwen3.5-35B-A3B-GPTQ-Int4"
    served_model_name: "qwen3.5-35b-a3b-gptq-int4"
    dtype: "half"
    quantization: "moe_wna16"
    enforce_eager: true
    max_model_len: 40960
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.88
    max_num_seqs: 96
    max_num_batched_tokens: 20480
    enable_prefix_caching: true
    enable_expert_parallel: true
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen3.5 35B-A3B GPTQ-Int4 多模态，N260 双卡 64G 预设（moe_wna16，TP2+EP）"

  # Qwen3.5 35B-A3B AWQ（约 25GiB 权重，显存更宽裕，可进一步提高上下文或并发）
  qwen3.5-35b-a3b-awq:
    path: "./models/Qwen3.5-35B-A3B-AWQ"
    served_model_name: "qwen3.5-35b-a3b-awq"
    dtype: "half"
    quantization: "awq"
    max_model_len: 40960
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.88
    max_num_seqs: 96
    max_num_batched_tokens: 20480
    enable_prefix_caching: true
    enable_expert_parallel: true
    attention-backend: flash_attn
    default-chat-template-kwargs:
      enable_thinking: false
    multimodal:
      enabled: true
      limit_images: 4
      limit_videos: 1
      media_paths:
        - "./images"
        - "./videos"
    description: "Qwen3.5 35B-A3B AWQ 多模态，N260 双卡 64G 高上下文/高并发预设"

  # ==================== 额外常用模型 ====================

  # Llama 3 8B
  llama3-8b:
    path: "./models/Meta-Llama-3-8B-Instruct"
    served_model_name: "llama3-8b-instruct"
    dtype: "bfloat16"
    max_model_len: 8192
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.85
    max_num_seqs: 32
    max_num_batched_tokens: 32768
    enable_prefix_caching: true
    multimodal: false
    description: "Meta Llama 3 8B 指令模型"

  # Llama 3 70B
  llama3-70b:
    path: "./models/Meta-Llama-3-70B-Instruct"
    served_model_name: "llama3-70b-instruct"
    dtype: "bfloat16"
    max_model_len: 8192
    tensor_parallel_size: 4
    gpu_memory_utilization: 0.85
    max_num_seqs: 16
    max_num_batched_tokens: 16384
    enable_prefix_caching: true
    multimodal: false
    description: "Meta Llama 3 70B 指令模型"

  # DeepSeek V2 Lite
  deepseek-v2-lite:
    path: "./models/DeepSeek-V2-Lite-Chat"
    served_model_name: "deepseek-v2-lite-chat"
    dtype: "bfloat16"
    max_model_len: 16384
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.85
    max_num_seqs: 16
    max_num_batched_tokens: 16384
    enable_prefix_caching: true
    multimodal: false
    description: "DeepSeek V2 Lite 对话模型"

# 当前使用的模型预设
active: "qwen2.5-vl-7b"