version: '3.8'

services:
  vllm:
    build:
      dockerfile: docker/Dockerfile-mx
      args:
        BASE_IMAGE: ${BASE_IMAGE:-cr.metax-tech.com/public-ai-release/maca/vllm-metax:0.17.0-maca.ai3.5.3.307-torch2.8-py312-kylinv11-amd64}
        VLLM_REQUIREMENTS_PROFILE: ${VLLM_REQUIREMENTS_PROFILE:-extras}
    privileged: true
    environment:
      - MX_VISIBLE_DEVICES=${MX_VISIBLE_DEVICES:-0}
    volumes:
      # 沐曦（gcu）常见做法为特权模式并透传 /dev；若现场文档要求特定设备节点，请按规范收敛为精确挂载。
      - /dev:/dev
