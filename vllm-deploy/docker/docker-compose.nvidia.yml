version: '3.8'

services:
  vllm:
    build:
      dockerfile: docker/Dockerfile-nvidia
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nvidia/cuda:12.3.0-runtime-ubuntu22.04}
        VLLM_REQUIREMENTS_PROFILE: ${VLLM_REQUIREMENTS_PROFILE:-full}
    environment:
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_DEVICE_COUNT:-all}
              capabilities: [gpu]
